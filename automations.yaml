    data:
      entity_id: ai_task.google_ai_task
      task_name: Analyze Two Garage Doors
      instructions: 'Based on the attached image, determine the state of the two garage
        doors. Return the state for each door.

        '
      structure:
        doors:
          description: A dictionary containing the state of each garage door.
          selector:
            object:
              fields:
                door_left:
                  selector:
                    boolean: {}
                door_right:
                  selector:
                    boolean: {}
      attachments:
      - media_content_id: media-source://local/{{ snapshot_filename }}
        media_content_type: image/jpeg
    action: ai_task.generate_data
  variables:
    snapshot_filename: garage_doors_snapshot.jpg
  mode: single
