# Home Assistant Template Sensor
# Purpose: Aggregates TV, Apple TV, AVR, and Art Mode states into a single chronologically sorted event string.

sensor:
  - name: "Living Room Media Events"
    unique_id: "living_room_media_event_log"
    icon: "mdi:history"
    state: |
      {% set area_id = 'living_room' %}

      {# 1. Identify Devices by Role Label #}
      {% set tv_dev = label_devices('media_role_tv') | select('in', area_devices(area_id)) | first | default('none') %}
      {% set atv_dev = label_devices('media_role_source_atv') | select('in', area_devices(area_id)) | first | default('none') %}

      {# 2. Resolve Entities #}
      {% set tv = device_entities(tv_dev) | select('match', 'media_player\.') | first | default('none') %}
      {% set atv = device_entities(atv_dev) | select('match', 'media_player\.') | first | default('none') %}
      {% set avr = label_entities('media_role_avr') | select('in', area_entities(area_id)) | first | default('none') %}

      {# Identify Art Mode Sensor by Label (e.g., 'media_role_art_sensor') #}
      {% set art_mode = label_entities('media_role_art_sensor') | select('in', area_entities(area_id)) | first | default('none') %}

      {% set events = [] %}

      {# 3. TV & ATV: Track State Changes ONLY (last_changed) #}
      {% for ent in [tv, atv] if ent != 'none' %}
        {% if states(ent) != 'unknown' %}
          {% set events = events + [ as_timestamp(states[ent].last_changed) ~ '@' ~ ent ~ '@state@' ~ states[ent].state ] %}
        {% endif %}
      {% endfor %}

      {# 4. Track Confirmed Art Mode Transitions #}
      {% if art_mode != 'none' and states(art_mode) != 'unknown' %}
        {% set events = events + [ as_timestamp(states[art_mode].last_changed) ~ '@' ~ art_mode ~ '@connectivity@' ~ states(art_mode) ] %}
      {% endif %}

      {# 5. AVR: Track Attribute Updates ONLY (last_updated) #}
      {% if avr != 'none' %}
        {% set avr_s = states[avr] %}
        {% if avr_s != none %}
          {% set events = events + [ as_timestamp(avr_s.last_updated) ~ '@' ~ avr ~ '@source@' ~ (avr_s.attributes.source | default('unknown')) ] %}
          {% set events = events + [ as_timestamp(avr_s.last_updated) ~ '@' ~ avr ~ '@sound_mode@' ~ (avr_s.attributes.sound_mode | default('unknown')) ] %}
        {% endif %}
      {% endif %}

      {# 6. Output: Latest relevant event (Format: Timestamp@Entity@Attribute@Value) #}
      {{ (events | sort(reverse=true) | first) if events | count > 0 else 'none' }}

