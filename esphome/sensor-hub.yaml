substitutions:
  name: new-hub
  friendly_name: New Hub
  board: esp32-poe-iso



# Enable Home Assistant API
api:

# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

#   # Enable fallback hotspot (captive portal) in case wifi connection fails
#   ap:
#     ssid: "Sensor-Hub Fallback Hotspot"



# packages:
#   esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/olimex-esp32-poe-iso.yaml@main

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

esp32:
  board: ${board}
  framework:
    type: esp-idf

# uart:
#   tx_pin: GPIO04
#   rx_pin: GPIO36
#   baud_rate: 256000
#   parity: NONE
#   stop_bits: 1

ethernet:
  # clk_mode: GPIO17_OUT
  phy_addr: 0
  type: LAN8720
  power_pin: GPIO12
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk: 
    pin: 17
    mode: CLK_OUT

# Enable logging
logger:

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true


binary_sensor:
  - id: pin_0
    platform: gpio
    name: "GPIO 0"
    pin: 
      number: 0
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door

  - id: pin_2
    platform: gpio
    name: "GPIO 02"
    pin: 
      number: 02
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door
    
  - id: pin_04
    platform: gpio
    name: "GPIO 04"
    pin: 
      number: 04
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door

  - id: pin_14
    platform: gpio
    name: "panel Door Sensor"
    pin: 
      number: 14
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door

  - id: pin_16
    platform: gpio
    name: "back Door Sensor"
    pin: 
      number: 16
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door
    
  - id: pin_33
    platform: gpio
    name: "GPIO 33"
    pin: 
      number: 33
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door
    
  - id: pin_32
    platform: gpio
    name: "GPIO 32"
    pin: 
      number: 32
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door
    
  - id: pin_39
    platform: gpio
    name: "GPIO 39"
    pin: 
      number: 39
      inverted: false
      mode:
        input: true
        #pullup: true
    device_class: door


time:
  - platform: sntp
    id: time_sntp
