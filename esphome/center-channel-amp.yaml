substitutions:
  name: center-channel-amp #change
  friendly_name: Center Channel Amp #change
  icon: "mdi:light-switch"
  event: nodered_automation
  button: button
  board: esp01_1m

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  # Registry-First: The custom eISCP logic
  project:
    name: Teckin.SP10 
    version: "1.0"
  includes:
    - integra_pwr/integra_pwr.h # This pulls in our C++ "Spy"

packages:   # as a list
#  - !include wifi.yaml
  - !include common/trusted.yaml
#  - !include formatted_uptime_sensor.yaml
#  - !include sensor_base.yaml


  
esp8266:
  board: ${board}
  restore_from_flash: true

preferences:
  flash_write_interval: 30s

# Enable logging
logger:
  level: DEBUG

ota:
  - platform: esphome

