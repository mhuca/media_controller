# =============================================================================
# Area Switch Implementation: Powder Room
# Path: /config/esphome/powder_room_switch.yaml
# =============================================================================

substitutions:
  device_name: "powder-room-switch"
  friendly_name: "Powder Room Switch"
  room_key: "powder_room"
  board: esp01_1m

esphome:
  name: ${device_name}
  comment: "Decoupled Edge Controller with Local Zigbee2MQTT Fallback"
  
  # Boot Trigger: Request Area Context Update on startup
  on_boot:
    priority: -100.0
    then:
      - lambda: |-
          if (api.connected()) {
            esphome_api->fire_homeassistant_event("gpe_area_request_update", {
              {"area_id", "${room_key}"}
            });
            ESP_LOGI("GPE_BOOT", "Boot sequence complete. Context request sent for ${room_key}.");
          }

packages:
  board_template: !include common/templates/ts602s_switch.yaml

# -----------------------------------------------------------------------------
# Local Hardware Motion Sensor (GPIO3 Native Overrides)
# -----------------------------------------------------------------------------
binary_sensor:
  - id: !extend motion_sensor
    platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: false
    
    # Tier 1: State streams automatically to HA native API
    # Tier 2: Executes local fallback ONLY when API is disconnected
    on_press:
      then:
        - if:
            condition:
              not:
                api.connected:
            then:
              - logger.log: "Tier 2: Motion Detected (API Offline) -> Activating Local Fallback"
              - script.stop: tier2_light_off_timer
              - script.stop: tier2_fan_off_timer
              - script.execute: execute_tier2_activation

    on_release:
      then:
        - if:
            condition:
              not:
                api.connected:
            then:
              - if:
                  condition:
                    lambda: 'return id(glbl_door_is_open);'
                  then:
                    - logger.log: "Tier 2: Motion Cleared with Door OPEN -> Starting Watchdog Grace Timers"
                    - script.execute: tier2_light_off_timer
                    - script.execute: tier2_fan_off_timer
                  else:
                    - logger.log: "Tier 2: Motion Cleared with Door CLOSED -> Shutting Down Active Loads"
                    - script.stop: tier2_light_off_timer
                    - script.stop: tier2_fan_off_timer
                    - lambda: |-
                        if (mqtt.connected()) {
                          auto m = esphome::mqtt::global_mqtt_client;
                          char light_topic[80], fan_topic[80];
                          snprintf(light_topic, sizeof(light_topic), "%s/%s/set", id(gpe_root_topic), id(gpe_light_target));
                          snprintf(fan_topic, sizeof(fan_topic), "%s/%s/set", id(gpe_root_topic), id(gpe_fan_target));
                          
                          m->publish(light_topic, "{\"state\":\"OFF\"}");
                          m->publish(fan_topic, "{\"state\":\"OFF\"}");
                        }

# -----------------------------------------------------------------------------
# Dynamic Learned State Globals (RAM-Only: No Flash Wear)
# -----------------------------------------------------------------------------
globals:
  # MQTT Target Topics
  - id: gpe_root_topic
    type: char[32]
    restore_value: no
    initial_value: '"zigbee2mqtt"'
  - id: gpe_light_target
    type: char[32]
    restore_value: no
    initial_value: '"powder_room_lights_group"'
  - id: gpe_fan_target
    type: char[32]
    restore_value: no
    initial_value: '"powder_room_fan"'
  - id: gpe_door_topic
    type: char[64]
    restore_value: no
    initial_value: '"powder_room_door_sensor"'

  # Hardware Capabilities & Runtime Postures
  - id: gpe_scene_eligible
    type: bool
    restore_value: no
    initial_value: "true"
  - id: gpe_use_scene
    type: bool
    restore_value: no
    initial_value: "true"

  # Dynamic Scene Identifiers
  - id: light_on_scene_id
    type: int
    restore_value: no
    initial_value: "15"
  - id: light_off_scene_id
    type: int
    restore_value: no
    initial_value: "0"

  # Fallback Timeouts (Seconds)
  - id: gpe_light_timeout
    type: int
    restore_value: no
    initial_value: "300"
  - id: gpe_fan_timeout
    type: int
    restore_value: no
    initial_value: "900"

# -----------------------------------------------------------------------------
# Networking & Local Zigbee2MQTT Subscription
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  keepalive: 15s
  on_json_message:
    - topic: !lambda 'return std::string(id(gpe_root_topic)) + "/" + std::string(id(gpe_door_topic));'
      then:
        - lambda: |-
            if (x.containsKey("contact")) {
              bool closed = x["contact"];
              id(glbl_door_is_open) = !closed;
              ESP_LOGI("TIER2_DOOR", "Zigbee Door Contact Updated -> Open: %s", id(glbl_door_is_open) ? "YES" : "NO");
            }

# -----------------------------------------------------------------------------
# Native API Event Listener (Tier 1 Context Synchronizer)
# -----------------------------------------------------------------------------
api:
  id: esphome_api
  on_event:
    event_type: gpe_area_update
    then:
      - lambda: |-
          // Heap Optimization: Zero-allocation string comparison
          if (x.count("area_id") && strcmp(x["area_id"].as<const char*>(), "${room_key}") == 0) {
            
            // 1. Core Targets
            if (x.count("root_topic")) snprintf(id(gpe_root_topic), sizeof(id(gpe_root_topic)), "%s", x["root_topic"].as<const char*>());
            if (x.count("light_target")) snprintf(id(gpe_light_target), sizeof(id(gpe_light_target)), "%s", x["light_target"].as<const char*>());
            if (x.count("fan_target")) snprintf(id(gpe_fan_target), sizeof(id(gpe_fan_target)), "%s", x["fan_target"].as<const char*>());

            // 2. Hardware Capabilities & Postures
            if (x.count("features")) {
              auto f = x["features"];
              if (f.count("scene_eligible")) id(gpe_scene_eligible) = f["scene_eligible"].as<bool>();
              if (f.count("use_scene")) id(gpe_use_scene) = f["use_scene"].as<bool>();
            }

            // 3. Scene IDs
            if (x.count("scenes")) {
              auto s = x["scenes"];
              if (s.count("light_on")) id(light_on_scene_id) = s["light_on"].as<int>();
              if (s.count("light_off")) id(light_off_scene_id) = s["light_off"].as<int>();
            }

            // 4. Dynamic Timeouts
            if (x.count("timeouts")) {
              auto t = x["timeouts"];
              if (t.count("light_sec")) id(gpe_light_timeout) = t["light_sec"].as<int>();
              if (t.count("fan_sec")) id(gpe_fan_timeout) = t["fan_sec"].as<int>();
            }

            // 5. Topography
            if (x.count("topography")) {
              auto topo = x["topography"];
              if (topo.count("door_topic")) {
                snprintf(id(gpe_door_topic), sizeof(id(gpe_door_topic)), "%s", topo["door_topic"].as<const char*>());
              }
            }

            // 6. Direct Door State Sync
            if (x.count("is_door_closed")) {
              id(glbl_door_is_open) = !x["is_door_closed"].as<bool>();
            }

            ESP_LOGI("GPE_LEARN", "Context Synced -> Light Target: %s | Fan Timeout: %ds",
                     id(gpe_light_target), id(gpe_fan_timeout));
          }

# -----------------------------------------------------------------------------
# Routing & Direct Execution Scripts
# -----------------------------------------------------------------------------
script:
  # --- BUTTON PRESS HANDLER ---
  - id: handle_button_press
    mode: restart
    then:
      - lambda: |-
          if (api.connected()) {
            esphome_api->fire_homeassistant_event("gpe_wall_switch_press", {
              {"area_id", "${room_key}"},
              {"action", "toggle"}
            });
            ESP_LOGI("TIER1_EXEC", "Dispatched button press event to central engine.");
          } else {
            id(execute_tier2_activation).execute();
          }

  # --- TIER 2 ACTIVATION EXECUTION ---
  - id: execute_tier2_activation
    mode: single
    then:
      - lambda: |-
          if (mqtt.connected()) {
            auto m = esphome::mqtt::global_mqtt_client;
            
            char light_topic[80], fan_topic[80], light_payload[32];
            snprintf(light_topic, sizeof(light_topic), "%s/%s/set", id(gpe_root_topic), id(gpe_light_target));
            snprintf(fan_topic, sizeof(fan_topic), "%s/%s/set", id(gpe_root_topic), id(gpe_fan_target));
            
            bool recall_scene = id(gpe_scene_eligible) && id(gpe_use_scene);

            if (recall_scene) {
              snprintf(light_payload, sizeof(light_payload), "{\"scene_recall\": %d}", id(light_on_scene_id));
            } else {
              snprintf(light_payload, sizeof(light_payload), "{\"state\":\"ON\"}");
            }
            
            m->publish(light_topic, light_payload);
            m->publish(fan_topic, "{\"state\":\"ON\"}");
            
            ESP_LOGW("TIER2_EXEC", "Published Fallback -> Light: %s [%s] | Fan: ON", light_topic, light_payload);

            id(tier2_light_off_timer).execute();
            id(tier2_fan_off_timer).execute();
          } else {
            ESP_LOGE("TIER2_EXEC", "Critical: Loss of both Core API and Local MQTT!");
          }

  # --- TIER 2 LIGHT WATCHDOG OFF TIMER ---
  - id: tier2_light_off_timer
    mode: restart
    then:
      - delay: !lambda "return id(gpe_light_timeout) * 1000;"
      - lambda: |-
          if (!api.connected() && mqtt.connected()) {
            auto m = esphome::mqtt::global_mqtt_client;
            char light_topic[80], light_payload[32];
            
            snprintf(light_topic, sizeof(light_topic), "%s/%s/set", id(gpe_root_topic), id(gpe_light_target));
            
            if (id(gpe_scene_eligible) && id(gpe_use_scene) && id(light_off_scene_id) > 0) {
              snprintf(light_payload, sizeof(light_payload), "{\"scene_recall\": %d}", id(light_off_scene_id));
            } else {
              snprintf(light_payload, sizeof(light_payload), "{\"state\":\"OFF\"}");
            }
            
            m->publish(light_topic, light_payload);
            ESP_LOGI("TIER2_TIMER", "Light Watchdog Expired -> Deactivated %s", light_topic);
          }

  # --- TIER 2 FAN WATCHDOG OFF TIMER ---
  - id: tier2_fan_off_timer
    mode: restart
    then:
      - delay: !lambda "return id(gpe_fan_timeout) * 1000;"
      - lambda: |-
          if (!api.connected() && mqtt.connected()) {
            auto m = esphome::mqtt::global_mqtt_client;
            char fan_topic[80];
            
            snprintf(fan_topic, sizeof(fan_topic), "%s/%s/set", id(gpe_root_topic), id(gpe_fan_target));
            m->publish(fan_topic, "{\"state\":\"OFF\"}");
            
            ESP_LOGI("TIER2_TIMER", "Fan Watchdog Expired -> Deactivated %s", fan_topic);
          }