          app:
          command: top_menu
      activity_key_lower: '{{ activity_key | lower }}'
      profile_map_entry: '{% set entry = activity_map[activity_key_lower] | default(activity_map[''home_music''])
        %} {{ entry }}

        '
      activity_base_config: '{{ profile_map_entry.profile }}'
      required_state_mask: '{{ activity_base_config.required_state_mask | int(0) }}'
      action_mapping: '{{ activity_base_config.action_mapping }}'
      app_to_launch: '{{ profile_map_entry.app | default(none) }}'
      command_to_send: '{{ profile_map_entry.command | default(none) }}'
      current_state_mask: '{{ states(''sensor.living_room_media_current_state_mask'')
        | int(0) }}'
      action_code: '{{ required_state_mask | bitwise_xor(current_state_mask) }}'
      inter_step_delay: 0.1
  - alias: 3. Iterate and Execute Required Actions
    repeat:
      for_each: '{{ action_mapping.keys() | sort | list }}'
      sequence:
      - variables:
          action_details: '{{ action_mapping[repeat.item] }}'
          field_mask: '{{ action_details.mask | int }}'
          needs_action: "{{ (current_state_mask | int | bitwise_and(field_mask)) !=
            \n   (required_state_mask | int | bitwise_and(field_mask)) }}\n"
      - if:
        - condition: template
          value_template: '{{ needs_action }}'
        then:
        - action: '{{ action_details.service }}'
          target: '{{ action_details.target | default({}) }}'
          data: '{{ action_details.data | default({}) }}'
        - delay: '{{ action_details.delay | default(''00:00:00.100'') }}'
  - alias: 4.1 Launch Activity App
    if:
    - condition: template
      value_template: '{{ app_to_launch is not none and app_to_launch != '''' }}'
    then:
    - alias: Launch Activity App
      target:
        entity_id: media_player.living_room_atv
      data:
        source: '{{ app_to_launch }}'
      action: media_player.select_source
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 50
  - alias: 4.2 Send ATV command
    if:
    - condition: template
      value_template: '{{ command_to_send is not none and command_to_send != ''''
        }}'
    then:
    - action: remote.send_command
      metadata: {}
      target:
        entity_id: remote.living_room_atv
      data:
        command: '{{ command_to_send }}'
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 50
  - alias: 4.0 Post-Action Art Mode Correction (Simplified Frame TV Fix)
    if:
    - condition: template
      value_template: '{{ (required_state_mask | bitwise_and(1024)) > 0 }}'
    - condition: template
      value_template: '{{ (required_state_mask | bitwise_and(512)) > 0 }}'
    then:
    - alias: Wait for TV Boot Sequence to Pass Default Art Mode
      delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
      enabled: false
    - alias: Force Art Mode OFF (Disable)
      data:
        action: disable
      action: script.art_mode_toggle_controller
      enabled: false
    enabled: false
  - alias: 3. Cleanup/Finalization
    data:
      name: Activity Engine
      message: 'Activity ''{{ activity_key }}'' executed. Action Code (Binary Difference):
        {{ action_code }}. Required State: {{ required_state_mask }}. Current State:
        {{ current_state_mask }}'
    action: logbook.log
  mode: single
art_mode_toggle_controller:
  alias: Art Mode Toggle Controller
  mode: single
  sequence:
  - variables:
      is_physically_art: '{{ is_state(''binary_sensor.frame_physical_art_state'',
        ''on'')}}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not (action == ''enable'' and is_physically_art) }}'
      sequence: []
    - conditions:
      - condition: template
        value_template: '{{ not (action == ''disable'' and not is_physically_art)
          }}'
      sequence: []
    enabled: false
  - alias: Abort if Reality already matches Action
    condition: template
    value_template: '{{ not (action == ''enable'' and is_physically_art) and not (action
      == ''disable'' and not is_physically_art) }}

      '
  - alias: Update Intent (Instant UI Feedback)
    action: '{{ ''input_boolean.turn_on'' if action == ''enable'' else ''input_boolean.turn_off''
      }}

      '
    target:
      entity_id: input_boolean.art_mode_intent
  - alias: Send Physical Command
    action: remote.send_command
    data:
      command:
      - KEY_POWER
      - KEY_POWER
      delay_secs: 0.1
    target:
      entity_id: remote.samsung_the_frame_65
  - alias: 4. Short Wait
    delay: 1
  - alias: Log successful Art Mode Toggle
    data:
      name: Art Mode Controller
      message: Successfully toggled Art Mode for action '{{ action }}'.
    action: logbook.log
  fields:
    action:
      name: Select Action
      description: Choose whether to enable or disable Art Mode.
      required: true
      selector:
        select:
          options:
          - label: Enable Art Mode
            value: enable
          - label: Disable Art Mode
            value: disable
