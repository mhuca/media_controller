  fields:
    activity_key:
      name: Activity Key
      required: true
      example: Watch_Plex
      selector:
        text: {}
  sequence:
  - alias: 0.0 Sync Intent Boolean to Physical Reality
    action: '{{ ''input_boolean.turn_on'' if is_state(''binary_sensor.art_mode_frame_tv'',
      ''on'') else ''input_boolean.turn_off'' }}

      '
    target:
      entity_id: input_boolean.art_mode_intent
    enabled: false
  - alias: 1.1 Define VSX Audio Profile
    variables:
