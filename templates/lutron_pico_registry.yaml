        #       {% set ns.verdict = 'hold_stop' %}
        #     {% else %}
        #       {# Maintain existing verdict for double-press releases #}
        #       {% set ns.status = s.status %}
        #       {% set ns.verdict = s.verdict %}
        #     {% endif %}
        #   {% endif %}

          
        # {% else %}
        #   {{ current }}
        # {% endif %}

      overrides: >
        {% set current = state_attr('sensor.pico_registry', 'overrides') %}
        {% set current = current if current is mapping else {} %}
        
        {% if trigger.event.event_type == 'pico_register_override' %}
          {% set new_entries = namespace(data={}) %}
          {% for s in trigger.event.data.device_ids %}
            {% set new_entries.data = dict(new_entries.data, **{s|string: trigger.event.data.command_map}) %}
          {% endfor %}
          {{ dict(current, **new_entries.data) }}
        {% else %}
          {{ current }}
        {% endif %}