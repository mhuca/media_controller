- id: '1769271410367'
  alias: 'Powder Room: Stateless Verified Wasp'
  description: Self-contained occupancy logic with verified wasp and soft-landing
  triggers:
  - trigger: state
    entity_id: binary_sensor.powder_room_fan_motion
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.powder_room_door
    to: 'on'
  - trigger: event
    event_type: watchman_audit_ping
    event_data:
      area_key: powder_room
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.powder_room_light_override
      state: 'off'
    then:
    - event: universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_on
        area_key: powder_room
        action_value: '{{ 75 if is_state(''binary_sensor.night_lights_sensor'', ''on'')
          else 190 }}

          '
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.powder_room_fan_motion
      to: 'off'
    continue_on_timeout: false
  - delay: 00:00:01
  - if:
    - condition: state
      entity_id: binary_sensor.powder_room_door
      state: 'off'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.powder_room_fan_motion
        to: 'on'
      timeout: 00:02:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      then:
      - stop: 'Wasp Verified: Staying on indefinitely.'
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - if:
    - condition: state
      entity_id: input_boolean.powder_room_light_override
      state: 'off'
    then:
    - event: universal_controller_command
      event_data:
        action_type: light_call
        command_input: turn_on
        area_key: powder_room
        action_value: 25
  - delay: 00:00:30
  - event: universal_controller_command
    event_data:
      action_type: light_call
      command_input: turn_off
      area_key: powder_room
  - if:
    - condition: state
      entity_id: input_boolean.powder_room_light_override
      state:
      - 'on'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.powder_room_light_override
      data: {}
  mode: restart
- id: '1769280553666'
  alias: 'Powder Room: Motion - State'
  description: 'Simplified logic: Automation only runs if door is open and override
    is off'
  triggers:
  - trigger: state
    entity_id: binary_sensor.powder_room_fan_motion
    id: Motion_Detected
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.powder_room_fan_motion
    id: Motion_Cleared
    to: 'off'
  - trigger: event
    event_type: watchman_audit_ping
    event_data:
      area_key: powder_room
    id: Motion_Detected
    enabled: false
  - type: opened
    device_id: b42e782b6114979091b48458a4fca80e
    entity_id: 80775b675c2fe7ca52d530db7e1cbb50
    domain: binary_sensor
    trigger: device
    id: Motion_Detected
  conditions:
  - condition: state
    entity_id: input_boolean.powder_room_light_override
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.powder_room_door
      state: 'on'
    - condition: template
      value_template: "{% if trigger.id == 'Motion_Cleared' %}\n  {% set motion_off
        = trigger.to_state.last_changed %}\n  {% set door_change = states.binary_sensor.powder_room_door.last_changed
        %}\n  {{ (motion_off - door_change).total_seconds() < 3 }}\n{% else %}\n  {#
        If it's an Audit or Door Open, we want the condition to pass #}\n  {{ true
        }}\n{% endif %}\n"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: Motion_Detected
      sequence:
      - event: universal_controller_command
        event_data:
          action_type: light_call
          command_input: turn_on
          area_key: powder_room
          action_value: '{{ 75 if is_state(''binary_sensor.night_lights_sensor'',
            ''on'') else 190 }}

            '
    - conditions:
      - condition: trigger
        id: Motion_Cleared
      sequence:
      - delay: 00:02:00
      - event: universal_controller_command
        event_data:
          action_type: light_call
          command_input: turn_on
          area_key: powder_room
          action_value: 25
      - delay: 00:00:30
      - event: universal_controller_command
        event_data:
          action_type: light_call
          command_input: turn_off
          area_key: powder_room
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.powder_room_light_override
  mode: restart
- id: '1769283408209'
  alias: 'System: Lighting Watchman Heartbeat'
  description: Periodic audit to trigger self-healing in stateless automations
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  actions:
  - event: watchman_audit_ping
    event_data:
      area_key: powder_room
      source: system_heartbeat
  mode: single
- id: '1769441182178'
  alias: 'Kitchen: Pro Adaptive Lighting (Multi-Zone with Delays)'
  description: Syncs non-CCT kitchen lights to Lux, CCT, and Zone Presence with 20s
    grace period
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.hallway_presence
    id: hallway
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_prep_zone_presence
    id: prep_zone
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_island_presence
    id: island
  conditions:
  - condition: state
    entity_id: binary_sensor.night_lights_sensor
    state: 'off'
  actions:
  - variables:
      raw_lux: '{{ states(''sensor.kitchen_light_level'') | float(0) }}'
      master_cct: '{{ states(''sensor.cct_calculation'') | float(3400) }}'
      is_dark_enough: '{{ states(''binary_sensor.kitchen_light_required'') == ''on''
        }}'
      current_brightness: '{{ (state_attr(''light.kitchen_main'', ''brightness'')
        | float(0) ) }}

        '
      lux_offset: '{{ (current_brightness * 0.4) | round(0) }}'
      effective_lux: "{% set result = raw_lux - lux_offset %} \n{{ result if result
        > 0 else 0 }}\n"
      base_brightness: "{% if is_dark_enough %}\n  {% set lux_ratio = (effective_lux
        / 100) %}\n  {% set lux_ratio = 1 if lux_ratio > 1 else lux_ratio %}\n  {%
        set brightness = (255 * 75 / 100) * (1 - lux_ratio ** 0.8) %}\n  {% set final
        = brightness | round(0) | int %}\n  {{ final if final > 25 else 25 }}\n{%
        else %}\n  0\n{% endif %}\n"
      pots: "{% if not is_dark_enough %}\n  0\n{% elif master_cct > 2700 %}\n  {{
        base_brightness | int }}\n{% elif master_cct <= 2202 %}\n  0\n{% else %}\n
        \ {% set range_total = 2700 - 2202 %}\n  {% set current_pos = master_cct -
        2202 %}\n  {% set fade_factor = (current_pos / range_total) ** 2 %}\n  {{
        (base_brightness * fade_factor) | round(0) | int }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: trigger
        id:
        - hallway
      sequence:
      - if:
        - condition: template
          value_template: "{% set current = state_attr('light.kitchen_main', 'brightness')
            | float(0) %} \n{{ (pots - current) | abs > 15 or pots == 0 }}\n"
        - condition: template
          value_template: '{{ states(''binary_sensor.hallway_presence'') == ''on''
            and pots > 0 }}'
        then:
        - action: light.turn_on
          target:
            entity_id: light.kitchen_main
          data:
            brightness: '{{ pots }}'
            transition: 5
        else:
        - delay: 00:02:00
        - action: light.turn_off
          target:
            entity_id: light.kitchen_main
          data: {}
    - conditions:
      - condition: trigger
        id:
        - island
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''binary_sensor.kitchen_island_presence'') ==
            ''on'' and base_brightness > 0 }}'
        - condition: template
          value_template: '{% set current = state_attr(''light.kitchen_island'', ''brightness'')
            | float(0) %}

            {{ (base_brightness - current) | abs > 15 or base_brightness == 0 }}

            '
        then:
        - action: light.turn_on
          target:
            entity_id: light.kitchen_island
          data:
            brightness: '{{ base_brightness }}'
            transition: 3
        else:
        - delay: 00:00:20
        - action: light.turn_off
          target:
            entity_id: light.kitchen_island
    - conditions:
      - condition: trigger
        id:
        - prep_zone
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(''binary_sensor.kitchen_prep_zone_presence'')
            == ''on'' and base_brightness > 0 }}'
        - condition: template
          value_template: "{% set current = state_attr('light.kitchen_counter', 'brightness')
            | float(0) %} \n{{ (base_brightness - current) | abs > 5 or base_brightness
            == 0 }}\n"
        then:
        - action: light.turn_on
          target:
            entity_id: light.kitchen_counter
          data:
            brightness: '{{ base_brightness }}'
            transition: 3
        else:
        - delay: 00:00:20
        - action: light.turn_off
          target:
            entity_id: light.kitchen_counter
  mode: restart
- id: '1769529750050'
  alias: 'Watchdog - Boiling Water Extended Heating '
  description: ''
  triggers:
  - entity_id:
    - sensor.boiling_water_kitchen_boiling_water_watchdog_power
