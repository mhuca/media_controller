- id: '1765761956988'
  alias: Art Mode - Auto Revert to Art Mode on ATV Off Proactive Handshake & Interrupt
  description: Distinguishes between User Intent, Sleep Timers, and Glitches. Glitches
    (Default) allow a 60s window for a remote-press veto.
  triggers:
  - trigger: state
    entity_id:
    - media_player.living_room_atv
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 1
  conditions:
  - condition: state
    entity_id: media_player.samsung_the_frame_65_2
    state: 'on'
  - condition: state
    entity_id: binary_sensor.art_mode_frame_tv
    state: 'off'
  - condition: template
    value_template: '{{ trigger.from_state.state != ''unknown'' }}'
    enabled: false
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.from_state.state in [''idle'', ''paused''] }}'
      sequence:
      - action: script.art_mode_toggle_controller
        data:
          action: enable
    - conditions:
      - condition: template
        value_template: '{{ trigger.from_state.state == ''playing'' }}'
      sequence:
      - action: homeassistant.reload_config_entry
        metadata: {}
        data: {}
        target:
          device_id: 5dcaf3f145bf2751f65c27aab9d7b165
    default:
    - action: logbook.log
      data:
        name: Art Mode Logic
        message: Suspicious ATV shutdown ({{ trigger.from_state.state }} -> off).
          Waiting 60s for veto.
    - wait_for_trigger:
      - trigger: event
        event_type: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: media_call
          area_key: living_room
      - trigger: event
        event_type: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: remote_send
          area_key: living_room
      - trigger: event
        event_type: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: activity_call
          area_key: living_room
      - trigger: state
        entity_id: media_player.living_room_atv
        to: playing
      timeout: 00:01:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.trigger == none }}'
      - condition: state
        entity_id: media_player.living_room_atv
        state: 'off'
      then:
      - action: script.art_mode_toggle_controller
        data:
          action: enable
  mode: restart
- id: '1765851213130'
  alias: Command - Send Light Call - Turn On
  description: ''
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: light_call
      command_input: turn_on
    enabled: true
  - trigger: event
    event_type: esphome.universal_controller_command
    event_data:
      action_type: light_call
      command_input: turn_on
    enabled: true
  conditions: []
  actions:
  - alias: Intent and Context
    variables:
      action_val: '{{ trigger.event.data.action_value | default('''') }}'
      area_key: '{{ trigger.event.data.area_key }}'
      target_kelvin: '{{ states(''sensor.cct_calculation'') | int(3200) }}'
      val: '{{ trigger.event.data.target_label | default([], true) }}'
      target_labels: "{{ ( [val] if val is string else val) \n  | map('label_entities')
        \n  | sum(start=[]) \n  | unique \n  | list \n}}\n"
  - alias: Data Constants
    variables:
      dim_factor: 20
      command_map:
        max:
          brightness: 255
        raise:
          brightness_step: 35
        lower:
          brightness_step: -35
        min:
          brightness: 25
        night_mode:
          brightness: 90
        day_mode:
          brightness: 190
        release:
          brightness_step: 0
      payload: {}
  - alias: Target Expansion (The "Engine")
    variables:
      area_lights: '{{ area_entities(area_key) | select(''match'', ''light.*'') |
        list }}'
      target_entities: "{% if target_labels | length > 0 %}\n    {{ area_lights |
        intersect(target_labels) }}\n  {% else %}\n    {{ area_lights }}\n  {% endif
        %}\n"
  - alias: Hardware Bucketing
    variables:
      target_br: "{% set val = 190 %}  {% if action_val is number or (action_val |
        is_number) %}\n  {% set val = action_val | int %}\n{% else %}\n  {% set val
        = command_map.get(action_val, {}).get('brightness', 190) %}\n{% endif %}  {{
        ([0, val, 255] | sort)[1] }}\n"
      ikea_cct_lights: "{% set ns = namespace(to_update=[]) %} \n{% for l in states.light
        \n  | selectattr('entity_id', 'in', target_entities) \n    if l.attributes.get('max_color_temp_kelvin',
        0) | int <= 4000 \n   and 'color_temp' in l.attributes.get('supported_color_modes',
        []) %}\n      {% set cur_k = l.attributes.get('color_temp_kelvin', 0) | int(0)
        %}\n      {% set cur_br = l.attributes.get('brightness', 0) | int(0) %}\n
        \     {% set clamped_k = ([l.attributes.get('min_color_temp_kelvin', 2202)
        | int, target_kelvin, 4000] | sort)[1] %}\n      {% if l.state == 'off' or
        (cur_k - clamped_k) | abs > 50 or (cur_br - target_br) | abs > 3 %}\n    {%
        set ns.to_update = ns.to_update + [l.entity_id] %}\n  {% endif %}\n{% endfor
        %} {{ ns.to_update }}\n"
      standard_cct_lights: "{% set ns = namespace(to_update=[]) %} {% for l in states.light
        | selectattr('entity_id', 'in', target_entities) \n   if l.entity_id not in
        ikea_cct_lights\n   and 'color_temp' in l.attributes.get('supported_color_modes',
        []) %}\n  {% set cur_k = l.attributes.get('color_temp_kelvin', 0) | int(0)
        %}\n  {% set cur_br = l.attributes.get('brightness', 0) | int(0) %}\n  {%
        set min_hw = l.attributes.get('min_color_temp_kelvin', 2200) | int %}\n  {%
        set max_hw = l.attributes.get('max_color_temp_kelvin', 7000) | int %}\n  {%
        set clamped_k = ([min_hw, target_kelvin, max_hw] | sort)[1] %}\n  {% if l.state
        == 'off' or (cur_k - clamped_k) | abs > 50 or (cur_br - target_br) | abs >
        3 %}\n    {% set ns.to_update = ns.to_update + [l.entity_id] %}\n  {% endif
        %}\n{% endfor %} {{ ns.to_update }}\n"
  - alias: Hardware Bucketing
    variables:
      dimmer_lights: "{{ target_entities \n  | intersect(label_entities('CurrentCTDimmer'))
        \n  | select('is_state', 'off')\n  | list }}\n"
      standard_lights: "{{ target_entities \n  | reject('in', ikea_cct_lights + standard_cct_lights
        + dimmer_lights) \n  | select('is_state', 'off')\n  | list }}\n"
  - parallel:
    - alias: IKEA CCT Turn On
      if:
      - condition: template
        value_template: '{{ ikea_cct_lights | length > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ ikea_cct_lights }}'
        data:
          brightness: '{{ target_br }}'
          color_temp_kelvin: '{{ [ ([target_kelvin, 2202] | max ), 4000] | min }}'
    - alias: Standard CCT Turn On
      if:
      - condition: template
        value_template: '{{ standard_cct_lights | length > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ standard_cct_lights }}'
        data:
          brightness: '{{ target_br }}'
          color_temp_kelvin: '{{ target_kelvin }}'
    - alias: Dimmer Lights Turn On
      if:
      - condition: template
        value_template: '{{ dimmer_lights | length > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ dimmer_lights }}'
        data:
          brightness: '{{ states(''sensor.cct_to_brightness'') | int(150) }}'
    - alias: Standard Lights Turn On
      if:
      - condition: template
        value_template: '{{ standard_lights | length > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ standard_lights }}'
        data:
          brightness: '{{ target_br }}'
  - action: logbook.log
    data:
      name: 'Light Call Source: {{ trigger.event.data.source_device }}'
      message: 'Light Call Source: {{ trigger.event.data.source_device }}'
  mode: queued
  max: 5
- &id001
  id: '1765852842316'
  alias: Command - Pico Dispatcher - New DELETE
  description: Single, double, and long press detection
  triggers:
  - trigger: event
    event_type: lutron_caseta_button_event
