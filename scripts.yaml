media_activity_snapshot_v1_4:
  alias: Media Activity Snapshot (V1.4)
  description: "# MEDIA ACTIVITY SNAPSHOT (V1.4) - METADATA SANITIZED\n## 1. OVERVIEW\nCaptures
    the current physical state of a Media Area (AVR, Display, Source, Power) and broadcasts
    a `capture_media_activity` event to the Node-RED Authoring Tool.\n## 2. DISCOVERY
    LOGIC\nUses HA Labels to dynamically find hardware without hardcoding entity IDs:\n*
    **media_role_avr**: Primary Audio Processor (Pioneer, DHC, etc.).  \n* **media_role_tv**:
    Primary Screen/TV (The Frame, Projector).  \n* **media_role_source_atv**: Active
    Playback Device (ATV, Shield, PS5).  \n* **media_power_sensor**: Hardware Validator
    (Athom Plug / Power Sensor).\n## 3. USAGE INSTRUCTIONS (IMPORTANT)\n* **App ID
    Capture**: If you intend to \"bake\" a specific application (e.g., Plex, Netflix)
    into a Codebook activity, **media must be actively playing or paused** within
    that app during the snapshot.\n* **Launcher State**: If the source device is on
    the Home Screen/Launcher (Idle), the script will intentionally set the `app_id`
    to `none` to prevent stale metadata from contaminating the registry.\n## 4. RECENT
    UPDATES\n* **CEC Mitigation**: Added explicit `source_on` state capture for environments
    where CEC is disabled.  \n* **Registry Alignment**: Ensures the Authoring Tool
    receives literal power states for all targeted silicon.\n* **Apple TV App Alignment**:
    Now includes \"Focus Validation\" for Apple TV to prevent capturing stale App
    IDs when the device is on the Launcher."
  sequence:
  - alias: 1. Resolve Entities and States
    variables:
      area_entities_list: '{{ area_entities(area_id) }}'
      avr_id: '{{ label_entities(''media_role_avr'') | select(''in'', area_entities_list)
        | first | default(''none'') }}

        '
      display_id: '{{ label_entities(''media_role_tv'') | select(''in'', area_entities_list)
        | first | default(''none'') }}

        '
      source_id: '{{ label_entities(''media_role_source_atv'') | select(''in'', area_entities_list)
        | first | default(''none'') }}

        '
      power_sensor_id: '{{ label_entities(''media_power_sensor'') | select(''in'',
        area_entities_list) | first | default(''none'') }}

        '
      current_avr_source: '{{ state_attr(avr_id, ''source'') if avr_id != ''none''
        else ''unknown'' }}'
      current_avr_mode: '{{ state_attr(avr_id, ''sound_mode'') if avr_id != ''none''
        else ''unknown'' }}'
      current_avr_state: '{{ states(avr_id) if avr_id != ''none'' else ''off'' }}'
      current_display_state: '{{ states(display_id) if display_id != ''none'' else
        ''off'' }}'
      current_source_state: '{{ states(source_id) if source_id != ''none'' else ''off''
        }}'
      current_power_watts: '{{ states(power_sensor_id) | float(0) if power_sensor_id
        != ''none'' else 0 }}'
      current_app_id: "{% if current_source_state in ['playing', 'paused'] %}\n  {{
        state_attr(source_id, 'app_id') | default('none') }}\n{% else %}\n  none\n{%
        endif %}\n"
      current_app_name: "{% if current_source_state in ['playing', 'paused'] %}\n
