# -----------------------------------------------------------------------------
# 3. Local Switch (For Physical Button)
# -----------------------------------------------------------------------------
switch:
  - id: switch_1
    name: Local Switch
    platform: template
    internal: true
    # State reflects the light's state
    lambda: 'return id(relay_1);'
    
    # Turn actions target the light component
    turn_on_action:
      - light.turn_on: ${target_id}
    turn_off_action:
      - light.turn_off: ${target_id}
      
    on_turn_on:
      - switch.turn_on: switch_1
    on_turn_off:
      - switch.turn_off: switch_1
