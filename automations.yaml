- id: '1765534037383'
  alias: Command - Send Raw Remote Command
  description: Handles IR/RF remote commands with target discovery
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: remote_send
  conditions: []
  actions:
  - condition: template
    value_template: '{% set current_mask = states(''sensor.living_room_media_current_state_mask'')
      | int(0) %} {{ (current_mask | bitwise_and(28672)) == 12288 }}'
  - alias: Define Actions and Detective Logic
    variables:
      area_key: '{{ trigger.event.data.area_key }}'
      action_value: '{{ trigger.event.data.action_value | default('''', true) }}'
      passed_remote: "{% set data = trigger.event.data %} {% set ov = data.get('overrides',
        {}) %} {{ data.get('remote_id') \n   | default(ov.get('remote_id'), true)\n
        \  | default(ov.get('entity_id') if 'remote.' in ov.get('entity_id', '') else
        none, true)\n   | default('', true) }}\n"
      payload: '{{ trigger.event.data.get(''data_payload'', {}) }}'
      hold_secs: '{{ payload.get(''hold_secs'') | default(0, true) }}'
      delay_secs: '{{ payload.get(''delay_secs'') | default(0.1, true) }}'
      num_repeats: '{{ payload.get(''num_repeats'') | default(1, true) }}'
  - alias: Determine Targets
    variables:
      dynamic_remote: "{{ area_entities(area_key) \n   | select('match', 'remote.')
        \n   | first | default(none) }}\n"
      target_remote: '{{ passed_remote if passed_remote | length > 0 else dynamic_remote
        }}'
  - if:
    - condition: template
      value_template: '{{ target_remote is not none }}'
    then:
    - action: remote.send_command
      target:
        entity_id: '{{ target_remote }}'
      data:
        command: '{{ action_value }}'
        hold_secs: '{{ hold_secs | float(0) }}'
        delay_secs: '{{ delay_secs | float(0.1) }}'
        num_repeats: '{{ num_repeats | int(1) }}'
  - if:
    - condition: template
      value_template: '{{ area_key == ''living_room'' }}'
    - condition: state
      entity_id: binary_sensor.art_mode_frame_tv
      state: 'on'
    then:
    - action: script.art_mode_toggle_controller
      data:
        action: disable
  variables:
    area_key: '{{ trigger.event.data.area_key }}'
  mode: single
- id: '1765534079246'
  alias: Command - Send Media Call
  description: 'Handles media intent calls. Heavy lifting in Listener.  Prioritizes:
    Local Volume Handshake > Receiver Audio > CD Source Context.

    '
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: media_call
  actions:
  - alias: Context and Intent
    variables:
      area_key: '{{ trigger.event.data.get(''area_key'', '''') }}'
      action_value: '{{ trigger.event.data.get(''action_value'', '''') }}'
      command_type: '{{ trigger.event.data.get(''command_type'', ''press'') }}'
  - alias: Define Command Mapping
    variables:
      command_map:
        volume.up:
          service: media_player.volume_up
          is_audio: true
        volume.down:
          service: media_player.volume_down
          is_audio: true
        volume.mute:
          service: media_player.volume_mute
          is_audio: true
        media.next:
          service: media_player.media_next_track
          is_audio: false
        media.previous:
          service: media_player.media_previous_track
          is_audio: false
        play.toggle:
          service: media_player.media_play_pause
          is_audio: false
  - alias: Resolve Action Details
    variables:
      details: '{{ command_map.get(action_value, {}) }}'
      target_service: '{{ details.get(''service'') }}'
      num_repeats: '{{ 2 if details.get(''is_audio'') and ''hold'' in command_type
        else 1 }}'
  - alias: Local Area Heavy Lifting
    variables:
      all_receivers: '{{ label_entities(''receiver'') | select(''match'', ''media_player.'')
        | list }}'
      local_receiver: '{{ area_entities(area_key) | select(''match'',''media_player.'')
        | select(''in'', all_receivers ) | first | default(none) }}

        '
      local_media_player: '{{ area_entities(area_key) | select(''match'', ''media_player.'')
        | difference(all_receivers) | first | default(none) }}

        '
      current_source: '{{ state_attr(local_receiver, ''source'') if local_receiver
        is not none else none }}'
      final_target: "{% if local_media_player is not none and state_attr(local_media_player,
        'volume_level') is not none %}\n  {{ local_media_player }}\n{% elif details.get('is_audio')
        and local_receiver is not none %}\n  {{ local_receiver }}\n{% elif current_source
        == 'CD' %}\n  {{ states('sensor.home_music_player') }}\n{% else %}\n  {{ local_media_player
        | default(local_receiver) | default('none') }}\n{% endif %}\n"
  - alias: Execute Command
    if:
    - condition: template
      value_template: '{{ target_service is not none and final_target not in [''none'',
        ''unknown'', ''unavailable'', ''''] }}'
    then:
    - repeat:
        count: '{{ num_repeats }}'
        sequence:
        - action: '{{ target_service }}'
          target:
            entity_id: '{{ final_target }}'
          data: "{% if action_value == 'volume.mute' %}\n  {{ { \"is_volume_muted\":
            not (state_attr(final_target, 'is_volume_muted') | default(false)) } }}\n{%
            else %}\n  {}\n{% endif %}\n"
        - if:
          - condition: template
            value_template: '{{ repeat.index < num_repeats }}'
          then:
          - delay:
              milliseconds: 125
  mode: restart
- id: '1765729159002'
  alias: Override - Powder Room Lights
  description: Native Lutron devices Powder Room Remote changes Event
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
