command_router:
  alias: Command Router
  description: Routes actions based on URL query parameters and dynamically finds
    target media entities.
  fields:
    command_input:
      name: Command String (e.g., scene.next)
      required: true
      selector:
        text:
    area_key:
      name: Target Area
      required: true
      selector:
        area:
    action_value:
      name: Optional Action Value (e.g., Plex, Home, Volume Level)
      required: false
      selector:
        text:
    media_player_id:
      name: Target Media Player (Override)
      required: false
      selector:
        entity:
          domain: media_player
    remote_id:
      name: Target Remote (Override)
      required: false
      selector:
        entity:
          domain: remote
    light_id:
      name: Target Lights (Override)
      required: false
      selector:
        entity:
          multiple: true
    data_payload:
      name: Data Payload
      description: Optional dictionary for passing extra data (e.g., hold_secs, brightness).
      required: false
      selector:
        object: {}
  sequence:
  - alias: Determine Targets
    variables:
      command: '{{ command_input }}'
      dynamic_media_player: "{% set receivers = label_entities('receiver') \n  | select('match',
        'media_player.')\n  | list\n%}\n{% set media_players = area_entities(area_key)
        \n  | select('match', 'media_player.') \n  | difference( receivers )\n  |
        list \n%}  \n{{ media_players[0] if media_players | length > 0 else none \n}}\n"
      dynamic_remote: "{% set remotes = area_entities(area_key) \n  | select('match',
        'remote.') \n  | list\n%}  \n{{ remotes[0] if remotes | length > 0 else none
        }}\n"
      target_media_player: '{{ media_player_id | default(dynamic_media_player, true
        ) }}'
      target_remote: '{{ remote_id | default(dynamic_remote, true ) }}'
      target_lighting_script: script.{{ area_key }}_set_lighting_level
      target_cycle_options: sensor.{{ area_key }}_cycle_options
      cycle_script_options: '{{ state_attr(target_cycle_options, ''scripts'') }}'
  - alias: Define Command Mapping
    variables:
      command_map:
        light.on:
          action_type: light_call
        light.off:
          action_type: light_call
          service: light.turn_off
        dim.up:
          action_type: light_call
        dim.down:
          action_type: light_call
        light.max_brightness:
          action_type: light_call
        scene.next:
          action_type: cycling
        scene.previous:
          action_type: cycling
        scene.min:
          action_type: cycling
        scene.max:
          action_type: cycling
        scene.music:
          action_type: script_call
          target_script: script.living_rm_play_cd_with_art_mode
        volume.up:
          action_type: media_call
          service: media_player.volume_up
        volume.down:
          action_type: media_call
          service: media_player.volume_down
        volume.mute:
          action_type: media_call
          service: media_player.volume_mute
          data:
            is_volume_muted: '{{ not state_attr(target_media_player, ''is_volume_muted'')
              }}'
        play.toggle:
          action_type: media_call
          service: media_player.media_play_pause
        track.next:
          action_type: media_call
          service: media_player.media_next_track
        media.toggle:
          action_type: media_call
          service: media_player.media_play_pause
        media.source:
          action_type: source_select
        remote_send:
          action_type: remote_send
        media.command:
          action_type: remote_send
  - alias: Define Actions
    variables:
      action_details: '{{ command_map[command] if command in command_map else none
        }}'
      action_type: '{{ action_details.action_type }}'
      target_script: '{{ action_details.target_script | default(none) }}'
      target_data: '{{ action_details.data | default({}) }}'
      derived_service: '{{ command_map[command].service | default(none) }}'
      target_service: "{% if action_type == 'light_call' and derived_service is none
        %}\n  light.turn_on\n{% else %}\n  {{ derived_service }}\n{% endif %}\n"
      has_light: "{{ area_key \n  | area_entities \n  | select(\"search\", \"light.\")
        \n  | list \n  | count > 0 \n}}\n"
      has_media: "{{ area_key \n  | area_entities\n  | select(\"search\",\"media_player.\")
        \n  | list \n  | count > 0 \n}}\n"
      target_service_old: '{{ action_details.service | default(none) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''cycling'' }}'
      sequence:
      - variables:
          target_state_entity: input_text.{{ area_key }}_scene_state
          target_label: lighting
          all_labels: '{{ label_entities(''lighting'') }}

            '
          options: "{% set all_scripts = states.script %}    \n{{ all_scripts\n  |
            selectattr('entity_id', 'in', area_entities(area_key))\n  | selectattr('entity_id',
            'in', label_entities(target_label))\n  | map(attribute='entity_id')\n
            \ | list | sort(reverse=false)\n}}\n"
          current_state: '{{ states(''input_text.'' ~ area_key ~ ''_scene_state'')
            }}

            '
          current: '{{ current_state | default(options[1] if options | length > 0
            else none) }}

            '
          current_index: '{{ options.index(current) if current in options else -1
            }}

            '
          next_script_id: none
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ command == ''scene.next'' }}'
          sequence:
          - variables:
              new_index: "{% if current_index == -1 %}\n  0\n{% elif current_index
                >= options | length - 1 %}\n  {{ current_index }}\n{% else %}\n  {{
                current_index + 1 }}\n{% endif %}\n"
              next_script_id: '{{ options[new_index] }}'
          alias: Scene Next
        - conditions:
          - condition: template
            value_template: '{{ command == ''scene.previous'' }}'
          sequence:
          - variables:
              new_index: "{% if current_index <= 0 %}\n  0\n{% else %}\n  {{ current_index
                - 1 }}\n{% endif %}\n"
              next_script_id: '{{ options[new_index] }}'
          alias: Scene Previous
        - conditions:
          - condition: template
            value_template: '{{ command == ''scene.min'' }}'
          sequence:
          - variables:
              next_script_id: '{{ options[0] if options | length > 0 else none }}'
          alias: Scene First
        - conditions:
          - condition: template
            value_template: '{{ command == ''scene.max'' }}'
          sequence:
          - variables:
              next_script_id: '{{ options[-1] if options | length > 0 else none }}'
          alias: Scene Last
        default:
        - data:
            level: warning
            message: 'Command Router: Cycling failed for {{ area_key }}. No cycle
              scripts found with the ''lighting_cycle'' label.'
          action: system_log.write
      - condition: template
        value_template: '{{ next_script_id is not none }}'
      - alias: Store New Scene State
        data:
          value: '{{ next_script_id }}'
        target:
          entity_id: '{{ target_state_entity }}'
        action: input_text.set_value
      - alias: Execute Lighting Script
        action: script.turn_on
        data: {}
        target:
          entity_id: '{{ next_script_id }}'
      alias: Lighting Cycle
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''light_call'' }}'
      sequence:
      - variables:
          dim_factor: 7
          transition: 0.2
          brightness_pct: 100
          brightness_step_pct: "{% if command == 'dim.up' %}\n  1\n{% elif command
            == 'dim.down' %}\n  -1\n{% else %}\n  0\n{% endif %}\n"
          final_data: "{% set data_block = [\"'transition': 0.2\"] %}\n\n{% if command
            == 'light.max_brightness' %}\n    {% set data_block = data_block +  ['\"brightness_pct\":
            100'] %} \n{% elif command in ['dim.up', 'dim.down'] %}\n    {% if command
            == 'dim.up' %}\n      {% set data_block = data_block +  ['\"brightness_step_pct\":
            ' ~ dim_factor] %} \n    {% elif command == 'dim.down' %}\n       {% set
            data_block = data_block +  ['\"brightness_step_pct\": ' ~ -1*dim_factor]
            %} \n    {% endif %}\n{% endif %}\n\n{% set data = \"{\" ~ (data_block)
            | join(',') ~ \"}\" %}\n\n{{ data | to_json }}\n"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ has_light }}'
          sequence:
          - if:
            - alias: Override Default Service
              condition: template
              value_template: '{{ derived_service is not none }}'
            then:
            - action: light.turn_off
              metadata: {}
              data: {}
              target:
                area_id: '{{ area_key }}'
            else:
            - action: light.turn_on
              metadata: {}
              data: '{{ final_data | from_json }}'
              target:
                area_id: '{{ area_key }}'
        default:
        - data:
            title: Command Router Error
            message: 'No Light entities found in Area: {{ area_key }}'
          action: persistent_notification.create
      alias: Send Light Call
    - conditions:
      - condition: template
        value_template: '{{ action_details.action_type == ''script_call'' }}'
      sequence:
      - target:
          entity_id: '{{ action_details.target_script }}'
        action: script.turn_on
        data:
          area_key: '{{ area_key }}'
      alias: Call Script
    - conditions:
      - condition: template
        value_template: '{{ action_details.action_type == ''source_select'' }}'
      sequence:
      - alias: Wake Up Media Player if off
        choose:
        - conditions:
          - condition: template
            value_template: '{{ states(target_media_player) in [''off'', ''standby'',
              ''unavailable''] }}

              '
          sequence:
          - alias: Send Wake-Up Command
            action: media_player.turn_on
            data: {}
            target:
              entity_id: '{{ target_media_player }}'
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
      - alias: Select Media Source
        target:
          entity_id: '{{ target_media_player }}'
        data:
          source: '{{ action_value }}'
        action: media_player.select_source
      - condition: state
        state:
        - 'on'
        entity_id: binary_sensor.art_mode_frame_tv
      - condition: template
        value_template: '{{ area_key == "living_room" }}'
      - alias: Send Power Command End Art Mode
        data:
          command:
          - KEY_POWER
          - KEY_POWER
          delay_secs: 0.1
        action: remote.send_command
        target:
          entity_id: remote.samsung_the_frame_65
      alias: Select Source
    - conditions:
      - condition: template
        value_template: '{{ action_details.action_type == ''remote_send'' }}'
      sequence:
      - alias: Wake Up Media Player if off
        choose:
        - conditions:
          - condition: template
            value_template: '{{ states(target_media_player) in [''off'', ''standby'',
              ''unavailable''] }}

              '
            alias: ATV is Off
          sequence:
          - alias: Send Wake-Up Command
            action: media_player.turn_on
            data: {}
            target:
              entity_id: '{{ target_media_player }}'
          - delay:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
      - action: remote.send_command
        metadata: {}
        target:
          entity_id: '{{ target_remote }}'
        data:
          command: '{{ action_value }}'
          hold_secs: '{{ data_payload["hold_secs"] | int(0) }}'
      - condition: state
        state:
        - 'on'
        entity_id: binary_sensor.art_mode_frame_tv
      - condition: template
        value_template: '{{ area_key == "living_room" }}'
      - alias: Send Power Command End Art Mode
        data:
          command:
          - KEY_POWER
          - KEY_POWER
          delay_secs: 0.1
        action: remote.send_command
        target:
          entity_id: remote.samsung_the_frame_65
      alias: Send Raw Remote Command
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''media_call'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ has_media }}'
          sequence:
          - data: '{{ target_data }}'
            target:
              area_id: '{{ area_key }}'
            action: '{{ target_service }}'
        default:
        - data:
            title: Command Router Error
            message: 'No Media Player found in Area: {{ area_key }}'
          action: persistent_notification.create
      alias: Send Media Call
    default:
    - alias: Log Error for Unmapped Command
      data:
        logger: custom_loggers.command_router
        level: warning
        message: 'Command Router received unmapped command: {{ command_input }}'
      action: homeassistant.log
configure_area_configuration_item_ci:
  alias: Configure Area Configuration Item (CI)
  description: Creates or updates the default media/lighting targets for a given area,
    storing the config in JSON format.
  fields:
    area_key:
      name: Area Key (e.g., 'living_room')
      required: true
      selector:
        text:
    media_player_id:
      name: Default Media Player
      required: false
      selector:
        entity:
          domain: media_player
    remote_id:
      name: Default Remote
      required: false
      selector:
        entity:
          domain: remote
    lighting_script_id:
      name: Default Lighting Script (e.g., script.living_room_set_lighting_level)
      required: false
      selector:
        entity:
          domain: script
    cycle_options_id:
      name: Cycle Options Sensor (e.g., sensor.living_room_cycle_options)
