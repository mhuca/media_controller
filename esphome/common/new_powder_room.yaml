substitutions:
  name: powder-room
  friendly_name: Powder Room
  area_key: powder_room
  event: nodered_automation
  button: button
  short_name: Speed
  board: esp01_1m
  is_true: "true"
  is_false: "false"


esphome:
  project:
    name: Generic.KS-602s
    version: "1.0"

packages:   # as a list
  - !include common/wifi.yaml
  - !include common/device_base.yaml # Contains core timer scripts, global vars, and sntp sync
  
api:

switch:
  - id: switch_1
    name: Local Switch
    platform: template
    internal: true
    lambda: return id(hw_relay).state;
    turn_on_action:
      - fan.turn_on: fan_1
    turn_off_action:
      - fan.turn_off: fan_1
    on_turn_on:
      - fan.turn_on: fan_1
    on_turn_off:
      - fan.turn_off: fan_1

  - id: light_1
    platform: template
    name: Light
    lambda: return id(ha_light).state;
    optimistic: true

binary_sensor:
  - id: ha_door
# - id: switch_2
    platform: homeassistant
    entity_id: binary_sensor.powder_room_door

  - id: ha_light
    platform: homeassistant
    entity_id: light.powder_room_lights

  # - id: ha_motion
  #   platform: homeassistant
  #   entity_id: binary_sensor.powder_room_motion

  - id: button_1_local
    platform: template
    internal: true
    lambda: return id(button_1).state;

  - id: switch_2
# - id: ha_door
    name: Door
    platform: template
    device_class: door
    lambda: return id(ha_door).state;
    # pin: 
    #   number: GPIO01
    #   inverted: false
    #   mode:
    #     input: true
    #     pullup: true

  - id: switch_3
    name: Motion
    device_class: motion
    # platform: template
    # lambda: return id(ha_motion).state;
    platform: gpio
#    entity_category: "diagnostic"
    pin: 
      number: 03
      inverted: false
      mode:
        input: true
        pullup: false
    #on_relase is when motion has ended
    on_release:
      then:
        - if:
            condition:
              binary_sensor.is_on: switch_2
              #is_on means door is open
            then:
              - script.execute: on_timer_restart
            else:
              - script.execute: on_timer_stop

    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: switch_2
              #is_on means door is open
            then:
            - fan.turn_on: fan_1
            - script.execute: on_timer_stop

output:
  - id: gpio_13
    platform: gpio
    pin:
      number: 13
      inverted: true

light:
  - id: relay_status_leds
    name: ${friendly_name} Indicator Lights
    platform: status_led
    output: gpio_13
    # Classify this as a "config" entity rather than a primary entity
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

  # See: https://esphome.io/components/light/binary.html
fan:
  - id: fan_1
    name: Fan
    platform: binary
    output: relay_1
    #lambda: return id(glbl_relay_state);
    # Resume last state on boot if possible. Else, off
    restore_mode: RESTORE_DEFAULT_OFF

    # Wire in the count down timer automation if enabled
    on_turn_on:
      then:
        # - output.turn_on: relay_1
        - globals.set:
            id: glbl_relay_state
            value: "true"
        - if:
            condition:
              # If the countdown timer is enabled (defined in device_base)
              lambda: 'return id(glbl_timeout_enabled);'
            then:                          
              # The light is already on, start counting the seconds.
              # When timer ends, light will be turned off
              - script.execute: start_timer
              - logger.log:
                  level: DEBUG
                  format: "Timer Just Started due to fan_1 being turned on"

            else:
              - logger.log:
                  level: DEBUG
                  format: "Fan1 turned on, countdown timer not enabled"

    # This can be called by the natural end of the timer OR manually through any other source.
    # Regardless of the source, we just need to stop the ticking if it's running.
    on_turn_off:
      then:
        # - output.turn_off: relay_1
        - globals.set:
            id: glbl_relay_state
            value: "false"
        - homeassistant.event:
            event: esphome.lighting_registry_update
            data:
              action: add
              area_key: ${area_key}
              seconds: '5'
              locked: "false"
              skip_warning: "true"
              # Uses esptime from device_base.yaml
              timestamp: !lambda 'return str_sprintf("%.0f", id(esptime).now().timestamp);'
        - delay: 500ms
        - homeassistant.event:
            event: esphome.start_registry_cleaner
        - if:
            condition:
              # _timer_tick script lives in device_base.yaml
              lambda: 'return id(_timer_tick).is_running();'
            then:
              - script.execute: on_timer_stop

            else:
              - logger.log:
                  level: DEBUG
                  format: "Fan1 turned off, countdown timer not enabled"