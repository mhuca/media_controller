    - binary_sensor.powder_room_door
    trigger: state
    to:
    - 'on'
    id: Door_Open
  - entity_id:
    - binary_sensor.powder_room_door
    trigger: state
    to:
    - 'off'
    id: Door_Closed
  - trigger: state
    entity_id:
    - switch.powder_room_relay
    id: Manual_Toggle
    from:
    to:
  conditions: []
  actions:
  - parallel:
    - choose:
      - conditions:
        - condition: trigger
          id:
          - Motion_On
          - Door_Open
        - condition: template
          value_template: '{% set current = state_attr(''sensor.active_area_overrides'',
            ''overridden_areas'') or [] %}

            {{ not ''powder_room'' in current }}'
        sequence:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: '{{ ''night_mode'' if is_state(''binary_sensor.night_lights_sensor''
              ,''on'') else ''day_mode'' }}

              '
            area_key: powder_room
            command_input: turn_on
            target_label:
            - main
            data_payload: '{{ trigger }}'
            overrides: {}
        - alias: IsDoorOpen
          if:
          - condition: state
            entity_id: binary_sensor.powder_room_door
            state:
            - 'on'
          then:
          - delay:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
          - alias: Emit Generic Universal Controller Command Event
            event: universal_controller_command
            event_data:
              source_device: presence
              action_type: light_call
              action_value: ''
              command_input: turn_off
              target_label:
              - main
              area_key: powder_room
              data_payload: '{{ trigger }}'
              overrides: {}
          - event: universal_controller_command
            event_data:
              action_type: light_override
              area_key: powder_room
              command_input: 'off'
              data_payload: '{{ trigger.to_state }}'
          else:
          - stop: Sequence complete - Door Closed
      - conditions:
        - condition: trigger
          id:
          - Door_Closed
        sequence:
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
        - alias: Wait for Motion
          wait_template: '{{ is_state(''binary_sensor.powder_room_fan_motion'', ''on'')
            }}'
          timeout: 00:00:20
          continue_on_timeout: true
        - condition: template
          value_template: '{{ wait.remaining == 0 }}'
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: min
            command_input: turn_on
            target_label:
            - main
            area_key: powder_room
            data_payload: '{{ trigger }}'
            overrides: {}
        - alias: Wait for Motion
          wait_template: '{{ is_state(''binary_sensor.powder_room_fan_motion'', ''on'')
            }}'
          timeout: 00:00:10
          continue_on_timeout: true
        - condition: template
          value_template: '{{ not wait.completed }}'
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: ''
            command_input: turn_off
            target_label:
            - main
            area_key: powder_room
            data_payload: '{{ trigger }}'
            overrides: {}
      - conditions:
        - condition: trigger
          id: Manual_Toggle
        - condition: template
          value_template: '{{ trigger.to_state.context.user_id is none and trigger.to_state.context.parent_id
            is none }}'
        sequence:
        - event: universal_controller_command
          event_data:
            action_type: light_override
            area_key: powder_room
            command_input: 'on'
            data_payload: '{{ trigger.to_state }}'
      - conditions:
        - condition: trigger
          id:
          - Motion_Off
        sequence:
        - event: universal_controller_command
          event_data:
            action_type: light_override
            area_key: powder_room
            command_input: 'off'
            data_payload: '{{ trigger.to_state }}'
    - if:
      - condition: trigger
        id:
        - Door_Open
      then:
      - event: universal_controller_command
        event_data:
          action_type: light_override
          area_key: powder_room
          command_input: 'off'
          data_payload: '{{ trigger.to_state }}'
  mode: restart
