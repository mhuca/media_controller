# -----------------------------------------------------------------------------
# Core Components for Communication (Essential for Safety & HA)
# -----------------------------------------------------------------------------
# API for Home Assistant communication (mandatory for lights/sensors)
api:

# Use the time component to track the current time, often useful for automations
# The server is defaulted to pool.ntp.org
time:
  - platform: sntp
    id: esptime
    timezone: "America/Toronto" # Your preferred timezone
    
# Enable web server for easy configuration access over the network
web_server:
  port: 80

# The ultimate safety net for Wi-Fi issues
captive_portal:
  # This creates a fallback access point if Wi-Fi connection fails
   
binary_sensor:
  - id: button_1
    name: ${friendly_name} Button
    platform: gpio
    internal: true
    entity_category: "diagnostic"
    pin:
      number: GPIO13
      inverted: true


output:
  # https://esphome.io/components/output/esp8266_pwm.html
  - platform: esp8266_pwm
    id: blue_led_output
    pin:
      number: GPIO2
      inverted: True

light:
  # https://esphome.io/components/light/monochromatic.html
  - platform: monochromatic
    name: SP10 Blue LED
    output: blue_led_output
    id: blue_led
    default_transition_length: 1ms # default 1s
    internal: True

switch:
  - platform: gpio
    # https://esphome.io/components/switch/gpio
    pin: GPIO15
    id: physical_relay
    internal: True

  # tie the led & relay operation together and report status based on relay state
  # - platform: template
  #   # https://esphome.io/components/switch/template.html
  #   name: SP10
  #   id: relay_template
  #   lambda: |-
  #     if (id(relay).state) {
  #       return true;
  #     } else {
  #       return false;
  #     }
  #   turn_on_action:
  #     - light.turn_on: blue_led
  #     - switch.turn_on: relay
  #   turn_off_action:
  #     - light.turn_off: blue_led
  #     - switch.turn_off: relay

  - platform: template
    name: "Relay"
    id: relay_template
    optimistic: true
    # This ensures the physical relay follows the logic state
    on_turn_on:
      - switch.turn_on: physical_relay
      - homeassistant.service:
          service: logbook.log
          data:
            name: "Center Channel Amp"
            message: "eISCP Link: 12V Trigger A HIGH - Powering ON"
            entity_id: "switch.center_channel_amp_relay"
    on_turn_off:
      - switch.turn_off: physical_relay
      - homeassistant.service:
          service: logbook.log
          data:
            name: "Center Channel Amp"
            message: "eISCP Link: 12V Trigger A LOW - Powering OFF"
            entity_id: "switch.center_channel_amp_relay"
    # on_turn_on:
    #   - lambda: |-
    #       static bool is_registered = false;
    #       if (!is_registered) {
    #         App.register_component_(esphome::integra::integra_global);
    #         is_registered = true;
    #         ESP_LOGI("main", "UCC: Anchor Triggered. Component Registered.");
    #       }

# Use a one-time interval to kickstart the Sovereign logic
interval:
  - interval: 200ms
    then:
      - lambda: |-
          static bool first_run = true;
          if (first_run) {
            esphome::integra::integra_global->setup();
            first_run = false;
            ESP_LOGI("main", "UCC: Sovereign Loop Jumpstarted.");
          }
          // Explicitly calling the loop since the engine is being stubborn
          esphome::integra::integra_global->loop();

# This creates a text input box in Home Assistant
text:
  - platform: template
    name: "Integra Target IP"
    id: integra_ip_addr
    initial_value: "10.0.168.212"
    restore_value: true
    mode: text
    # Required for template text components:
    set_action:
      then:
        - lambda: 'id(integra_ip_addr).publish_state(x);'

# Number works as previously discussed
number:
  - platform: template
    name: "Integra Target Port"
    id: integra_port_num
    initial_value: 60128
    min_value: 1
    max_value: 65535
    step: 1
    restore_value: true
    optimistic: true
    set_action:
      then:
        - lambda: 'id(integra_port_num).publish_state(x);'

  - platform: template
    name: "Amp Cool Down"
    id: amp_sustain_minutes
    icon: "mdi:timer-sand"
    initial_value: 2
    min_value: 1
    max_value: 15
    step: 1
    unit_of_measurement: "min"
    restore_value: true
    optimistic: true
    set_action:
      then:
        - lambda: 'id(amp_sustain_minutes).publish_state(x);'


