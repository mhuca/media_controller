substitutions:
  name: olimex-dev-ld2410-v2
  friendly_name: olimex dev ld2410 v2
  board: esp32-poe-iso

packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/olimex-esp32-poe-iso.yaml@main

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}


# Enable Home Assistant API
api:
  encryption:
    key: rqjcBnzlHNqdp/r/3sIqpnukRr4gzSRMTXOMXnb+tog=

esp32:
  board: ${board}
  framework:
    type: esp-idf

uart:
  tx_pin: GPIO04
  rx_pin: GPIO36
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 0
# ethernet:
#   type: LAN8720
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18
#   clk: 
#     pin: 17
#     mode: CLK_OUT
#   phy_addr: 0
  power_pin: GPIO12

# ethernet:
#   clk_mode: GPIO17_OUT
#   phy_addr: 0
#   type: LAN8720
#   power_pin: GPIO12
#   mdc_pin: GPIO23
#   mdio_pin: GPIO18

# Enable logging
logger:

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

ld2410:
  id: ld2410_radar

number:
  - platform: ld2410
    timeout:
      name: Radar Timeout
    max_move_distance_gate:
      name: Radar Max Move Distance
    max_still_distance_gate:
      name: Radar Max Still Distance
    g0:
      move_threshold:
        name: g0 move threshold
      still_threshold:
        name: g0 still threshold
    g1:
      move_threshold:
        name: g1 move threshold
      still_threshold:
        name: g1 still threshold
    g2:
      move_threshold:
        name: g2 move threshold
      still_threshold:
        name: g2 still threshold
    g3:
      move_threshold:
        name: g3 move threshold
      still_threshold:
        name: g3 still threshold
    g4:
      move_threshold:
        name: g4 move threshold
      still_threshold:
        name: g4 still threshold
    g5:
      move_threshold:
        name: g5 move threshold
      still_threshold:
        name: g5 still threshold
    g6:
      move_threshold:
        name: g6 move threshold
      still_threshold:
        name: g6 still threshold
    g7:
      move_threshold:
        name: g7 move threshold
      still_threshold:
        name: g7 still threshold
    g8:
      move_threshold:
        name: g8 move threshold
      still_threshold:
        name: g8 still threshold

binary_sensor:
  - id: pin_13
    platform: gpio
    name: "Garage Door Sensor"
    pin: 
      number: 13
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door


  - id: pin_14
    platform: gpio
    name: "panel Door Sensor"
    pin: 
      number: 14
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door


  - id: pin_15
    platform: gpio
    name: "server Door Sensor"
    pin: 
      number: 15
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door


  - id: pin_16
    platform: gpio
    name: "back Door Sensor"
    pin: 
      number: 16
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door

  - platform: ld2410
    has_target:
      name: Radar Target
      id: radar_has_target
    has_moving_target:
      name: Radar Moving Target
    has_still_target:
      name: Radar Still Target

  - id: switch_2
    platform: gpio
    name: Door
    pin: 
      number: GPIO01
      inverted: false
      mode:
        input: true
        pullup: true
    device_class: door
    entity_category: "diagnostic"

sensor:
  - platform: ld2410
    moving_distance:
      name: Radar Moving Distance
      id: moving_distance
    still_distance:
      name: Radar Still Distance
      id: still_distance
    moving_energy:
      name: Radar Move Energy
    still_energy:
      name: Radar Still Energy
    detection_distance:
      name: Radar Detection Distance
      id: radar_detection_distance
    g0:
      move_energy:
        name: g0 move energy
      still_energy:
        name: g0 still energy
    g1:
      move_energy:
        name: g1 move energy
      still_energy:
        name: g1 still energy
    g2:
      move_energy:
        name: g2 move energy
      still_energy:
        name: g2 still energy
    g3:
      move_energy:
        name: g3 move energy
      still_energy:
        name: g3 still energy
    g4:
      move_energy:
        name: g4 move energy
      still_energy:
        name: g4 still energy
    g5:
      move_energy:
        name: g5 move energy
      still_energy:
        name: g5 still energy
    g6:
      move_energy:
        name: g6 move energy
      still_energy:
        name: g6 still energy
    g7:
      move_energy:
        name: g7 move energy
      still_energy:
        name: g7 still energy
    g8:
      move_energy:
        name: g8 move energy
      still_energy:
        name: g8 still energy
#Exposes control switches
switch:
  - platform: ld2410
    bluetooth:
      name: "Radar Control Bluetooth"
      id: radar_bluetooth
    engineering_mode:
      name: "Radar Engineering Mode"
time:
  - platform: sntp
    id: time_sntp

#Radar firmware version
text_sensor:
  - platform: ld2410
    version:
      name: "Radar Firmware Version"
#Set distance resolution - 0.75m or 0.2m
select:
  - platform: ld2410
    distance_resolution:
      name: "Radar Distance Resolution"