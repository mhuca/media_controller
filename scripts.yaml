media_registry_auditor_v1_3_3:
  alias: Media Registry Auditor (V1.3.3)
  description: "# MEDIA REGISTRY AUDITOR (V1.3.3)\n\n## 1. OVERVIEW\n\nDiscovers and
    maps the physical relationship between AVRs, Displays, and Sources within an Area.
    \n\n## 2. DISCOVERY LOGIC\n\n* **Primary Hook**: Finds all entities labeled `media_role_avr`.\n\n*
    **Area Context**: Matches labeled sources (`media_role_source_atv`) and sensors
    (`media_power_sensor`) within the same `area_id`.\n\n* **Registry Sync**: Broadcasts
    a `sync_media_matrix` event for Node-RED ingestion.\n\n## 3. DATA STRUCTURE\n\n**0-based
    Indexing**: Generates a zero-based index for `source_list` and `sound_mode_list`
    to align with the 16-bit Codebook requirements."
  sequence:
  - repeat:
      for_each: '{{ label_entities(''media_role_avr'') }}'
      sequence:
      - variables:
          avr: '{{ repeat.item }}'
          area_key: '{{ area_id(avr) }}'
          area_name: '{{ area_name(area_key) }}'
          sources: "{% set ns = namespace(items={}) %} {% set source_list = state_attr(avr,
            'source_list') %} {% if source_list is not none %}\n  {% for src in source_list
            %}\n    {% set ns.items = dict(ns.items, **{src: loop.index0}) %}\n  {%
            endfor %}\n{% endif %} {{ ns.items }}"
          modes: "{% set ns = namespace(items={}) %} {% set mode_list = state_attr(avr,
            'sound_mode_list') %} {% if mode_list is not none %}\n  {% for mode in
            mode_list %}\n    {% set ns.items = dict(ns.items, **{mode: loop.index0})
            %}\n  {% endfor %}\n{% endif %} {{ ns.items }}"
          source_entity: '{{ label_entities(''media_role_source_atv'') | select(''in'',
            area_entities(area_key)) | first | default(''none'') }}

            '
          power_sensor: '{{ label_entities(''media_power_sensor'') | select(''in'',
            area_entities(area_key)) | first | default(''none'') }}

            '
      - event: sync_media_matrix
        event_data:
          area_id: '{{ area_key }}'
          area_name: '{{ area_name }}'
          avr_registry:
            source: '{{ sources }}'
            sound_mode: '{{ modes }}'
          shadow_registry:
            AppleTV: '{{ source_entity }}'
          hardware_map:
            avr: '{{ avr }}'
            source: '{{ source_entity }}'
            power_sensor: '{{ power_sensor }}'
  - action: logbook.log
    data:
      name: Matrix Auditor
      message: Registry sync event broadcast completed for all discovered areas.
