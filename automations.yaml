  - type: turned_off
    device_id: 91c3753a18068bf4c9c9dbfe6d355620
    entity_id: 026c85c714f63e5268617f8b9542d16c
    domain: switch
    trigger: device
    id: local_trip
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: warning
