- id: '1723357232867'
  alias: Set Tarrif through out year
  description: ''
  trigger:
  - platform: time
    at: 07:00:00
    variables:
      tariff: peak
    id: 7am
  - platform: time
    at: '11:00:00'
    variables:
      tariff: peak
    id: 11am
  - platform: time
    at: '17:00:00'
    variables:
      tariff: peak
    id: 5pm
  - platform: time
    at: '19:00:00'
    variables:
      tariff: offpeak
    id: 7pm
  condition: []
  action:
  - if:
    - condition: template
      value_template: '{{ is_state("binary_sensor.workday_sensor", "off") }}'
      alias: Is Not Working Day
    then:
    - action: select.select_option
      target:
        entity_id: select.alectra
      data:
        option: Off-Peak
      alias: Set Alectra to Off Peak
    else:
    - if:
      - condition: trigger
        id:
        - 7pm
      then:
      - action: select.select_option
        target:
          entity_id: select.alectra
        data:
          option: Off-Peak
        alias: Set Alectra to Off Peak
      else:
      - if:
        - condition: template
          value_template: '{% set currentMonth = now().month | int %}

            {{ (currentMonth > 4) and (currentMonth < 11) }}'
          alias: Test if month is May to October
        then:
        - choose:
          - conditions:
            - condition: trigger
              id:
              - 7am
              - 5pm
            sequence:
            - alias: Set Alectra to Mid Peak
              action: select.select_option
              target:
                entity_id: select.alectra
              data:
                option: Mid-Peak
          - conditions:
            - condition: trigger
              id:
              - 11am
            sequence:
            - alias: Set Alectra to Peak
              action: select.select_option
              target:
                entity_id: select.alectra
              data:
                option: Peak
        else:
        - choose:
          - conditions:
            - condition: trigger
              id:
              - 7am
              - 5pm
            sequence:
            - alias: Set Alectra to Peak
              action: select.select_option
              target:
                entity_id: select.alectra
              data:
                option: Peak
          - conditions:
            - condition: trigger
              id:
              - 11am
            sequence:
            - alias: Set Alectra to Mid Peak
              action: select.select_option
              target:
                entity_id: select.alectra
              data:
                option: Mid-Peak
  mode: single
