substitutions:
  name: "living-room-media-frame-tv"
  friendly_name: "Living Room Media Frame TV"
  project_version: "1.6.1-SAFE-MODE-FIX"
  standby_threshold: "55.0"
  video_threshold: "99.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp8266:
  board: esp8285 

packages:
  wifi: !include common/wifi.yaml

# New top-level safe_mode component (replaces old oa: safe_mode)
safe_mode:
  num_attempts: 10
  reboot_timeout: 1min

web_server:
  port: 80

captive_portal:

