powder_room_presence:
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.powder_room_fan_motion
      state: 'off'
    then:
    - if:
      - condition: state
        entity_id: binary_sensor.powder_room_door
        state: 'off'
        enabled: true
      then:
      - stop: Door Is Closed
      else:
      - action: timer.start
        metadata: {}
        data: {}
        target:
          entity_id:
          - timer.powder_room_fan_timer
        enabled: false
      - if:
        - condition: state
          entity_id: input_boolean.powder_room_light_override
          state: 'on'
        then:
        - stop: Light Overide is on
        else:
        - action: timer.start
          metadata: {}
          data: {}
          target:
            entity_id:
            - timer.powder_room_light_timer
    else:
    - action: switch.turn_on
      metadata: {}
      data: {}
      target:
        entity_id: switch.powder_room_fan
      enabled: false
    - action: timer.cancel
      metadata: {}
      data: {}
      target:
        entity_id:
        - timer.powder_room_fan_timer
      enabled: false
    - action: timer.cancel
      metadata: {}
      data: {}
      target:
        entity_id:
        - timer.powder_room_light_timer
    - if:
      - condition: state
        entity_id: binary_sensor.powder_room_door
        state: 'off'
      then:
      - stop: Door Is Closed
      else:
      - if:
        - condition: state
          entity_id: input_boolean.powder_room_light_override
          state: 'off'
        then:
        - if:
          - condition: state
            entity_id: binary_sensor.night_lights_sensor
            state: 'on'
          then:
          - action: light.turn_on
            metadata: {}
            data:
              brightness_pct: 35
              color_temp_kelvin: '{{  state_attr(''sensor.sun_solar_temperature'',''color_temp_kelvin'')
                }}'
            target:
              entity_id:
              - light.powder_room_bulb_1_light
              - light.powder_room_bulb_2_light
              - light.powder_room_bulb_3_light
              - light.powder_room_lights
          else:
          - action: light.turn_on
            metadata: {}
            data:
              brightness_pct: 75
              color_temp_kelvin: '{{  state_attr(''sensor.sun_solar_temperature'',''color_temp_kelvin'')
                }}'
            target:
              entity_id:
              - light.powder_room_bulb_1_light
              - light.powder_room_bulb_2_light
              - light.powder_room_bulb_3_light
              - light.powder_room_lights
  alias: Powder Room Presence
  description: Powder Room Presence
