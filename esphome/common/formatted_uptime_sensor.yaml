globals:
  # Global variable to store the exact timestamp of the last boot.
  # This is stable and only updates when the device restarts.
  - id: glbl_boot_time
    type: std::string
    # The initial value is empty, it will be set on boot.
    initial_value: ""

# The 'boot' action runs immediately after the device starts up and connects to Wi-Fi/Time.
# We use this to capture the exact current time and store it in our global variable.
# We also log it for troubleshooting.
# NOTE: The 'time' component must be initialized before this action runs.
esphome:
  on_boot:
    priority: -100 # Run after core components are initialized
    then:
      # Set the boot time immediately upon start, formatted nicely.
      - globals.set:
          id: glbl_boot_time
          value: 'id(esptime).now().strftime("%Y-%m-%d %H:%M:%S %Z")'
      - logger.log:
          level: INFO
          format: "System Boot Detected: Last Boot Time set to %s"
          args: ['id(glbl_boot_time)']

sensor:
  # 1. The standard uptime sensor must be defined (internal and hidden).
  - platform: uptime
    id: raw_uptime
    name: Uptime (Raw Seconds)
    internal: true
    entity_category: "diagnostic"

