            default_entity_id: binary_sensor.{{ target_area }}_{{ appId }}
            state_topic: home/{{ target_area }}/{{ appId }}/state
            value_template: '{% raw %}{{ value }}{% endraw %}'
            device: '{{ deviceObj }}'
            device_class: motion
            icon: mdi:motion-sensor
        alias: Config Definition
      - action: mqtt.publish
        data:
          topic: '{{ topic }}'
          payload: '{{ payload | tojson }}'
          retain: true
