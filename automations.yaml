        select('in', area_lights)\n  | list %} \n\n{{ label_entities if label_entities
        | length > 0 else area_lights }}\n"
  - variables:
      dim_direction: "{% if target_entities | length > 0 %}\n  {{ 'lower' if (state_attr(target_entities[0],
        'brightness') | int(0) > 190 ) else 'raise' }}\n{% else %}\n  raise\n{% endif
        %}\n"
      target_state: '{{ ''turn_on'' if (states(target_entities[0]) == ''off'' ) else
        ''turn_off'' }}

        '
  - choose:
    - conditions:
      - condition: template
