- id: '1766509326875'
  alias: Command - Lighting Cycle - Redux
  description: Unified scene cycling with self-healing state logic
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: cycling
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.command != ''hold'' }}'
  actions:
  - variables:
      area_key: '{{ trigger.event.data.area_key }}'
      target_state_entity: input_text.{{ area_key }}_scene_state
      action_val: '{{ trigger.event.data.action_value }}'
      options: "{{ states.script\n  | selectattr('entity_id', 'in', area_entities(area_key))\n
        \ | selectattr('entity_id', 'in', label_entities('lighting'))\n  | map(attribute='entity_id')\n
        \ | list | sort }}\n"
      raw_state: '{{ states(target_state_entity) }}'
      is_valid: '{{ raw_state in options }}'
      safe_default_index: '{{ 1 if options | length > 1 else 0 }}'
      next_script_id: "{% set len = options | length %} {% if len == 0 %} \n  none\n{%
        elif not is_valid %}\n  {# RECOVERY: State was lost or script was renamed.
        Reset to Safe Default. #}\n  {{ options[safe_default_index] }}\n{% else %}\n
        \ {% set i = options.index(raw_state) %}\n  {% if action_val == 'scene.next'
        %}\n    {{ options[i + 1] if i < len - 1 else options[len - 1] }}\n  {% elif
        action_val == 'scene.previous' %}\n    {{ options[i - 1] if i > 0 else options[0]
        }}\n  {% elif action_val == 'scene.min' %}\n    {{ options[0] }}\n  {% elif
        action_val == 'scene.max' %}\n    {{ options[-1] }}\n  {% else %}\n    {{
        options[safe_default_index] }}\n  {% endif %}\n{% endif %}\n"
  - condition: template
    value_template: '{{ next_script_id is not none }}'
  - action: input_text.set_value
    target:
      entity_id: '{{ target_state_entity }}'
    data:
      value: '{{ next_script_id }}'
  - action: script.turn_on
    target:
      entity_id: '{{ next_script_id }}'
  mode: single
- id: '1766516522204'
  alias: Override - Living Room Dim Cycle - Watchdog Processor
  description: Uses Session ID as a watchdog heartbeat to maintain a local dimming
    ramp
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: light_call
      data_payload:
        serial: 69245901
        button_type: stop
    enabled: false
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.command_type in [''stop_hold'',''stop_release'']
      }}'
  actions:
  - variables:
      area_key: '{{ trigger.event.data.area_key }}'
      target_override: '{{ trigger.event.data.overrides.target | default('''', true)
        }}'
      data_override: '{{ trigger.event.data.overrides | default('''', true) }}'
      serial: '{{ trigger.event.data.data_payload.serial }}'
      session_id: '{{ trigger.event.data.session_id }}'
      is_continuation: '{{ state_attr(''this.entity_id'', ''last_session_id'') ==
        session_id }}

        '
      target_direction: "{% if is_continuation %}\n  {{ state_attr('this.entity_id',
        'last_direction') }}\n{% else %}\n  {% set lights = area_entities(area_key)
        \n    | select('search', '^light.') \n    | select('is_state', 'on') \n    |
        list \n  %}\n  {% set bright = (expand(lights) \n    | map(attribute='attributes.brightness')
        \n    | map('int', 0) \n    | average / 2.55) if lights \n    | length > 0
        else 0 \n  %}\n  {{ 'lower' if bright > 70 else 'raise' }}\n{% endif %}\n"
  - alias: Target Expansion (The "Engine")
    variables:
      raw_target: "{% if target_override == '' %} \n  {{ {'area_id': area_key} }}
        \n{% else %}\n  {{ target_override }} \n{% endif %}\n"
      target_entities: "{% set ns = namespace(found=[]) %} \n{% if raw_target.area_id
        is defined %}\n  {% set ns.found = area_entities(raw_target.area_id) %}\n{%
        elif raw_target.entity_id is defined %}\n  {% set ent = raw_target.entity_id
        %}\n  {% set ns.found = [ent] if ent is string else ent %}\n{% endif %} \n{{
        \n  ns.found \n    | map('expand') \n    | sum(start=[]) \n    | selectattr('domain',
        'eq', 'light') \n    | map(attribute='entity_id') \n    | list \n    | unique
        \n    | list \n}}\n"
  - alias: Hardware Bucketing
    variables:
      native_cct_lights: "{{ states.light \n  | selectattr('entity_id', 'in', target_entities)
        \n  | selectattr('attributes.supported_color_modes', 'defined')\n  | selectattr('attributes.supported_color_modes',
        'search', 'color_temp') \n  | map(attribute='entity_id') \n  | list \n}}\n"
      dimmer1_lights: '{{ target_entities | select(''in'', label_entities(''CurrentCTDimmer''))
        | list }}'
      dimmer2_lights: '{{ target_entities | select(''in'', label_entities(''CurrentCTDimmer2''))
        | list }}'
      standard_lights: '{% set specialized = dimmer1_lights + dimmer2_lights %}

        {{ target_entities | reject(''in'', specialized) | list }}

        '
      target: "{{ data_override \n  | combine({'target':{'entity_id': standard_lights
        }}) \n}}\n"
  - event: universal_controller_command
    event_data:
      action_type: light_call
      action_value: '{{ target_direction }}'
      area_key: '{{ area_key }}'
      metadata:
        last_session_id: '{{ session_id }}'
        last_direction: '{{ target_direction }}'
      source_device: pico
      command_input: '{{ trigger.event.data.command_input }}'
      data_payload: '{{ trigger.event.data.data_payload }}'
      overrides: '{{ target }}'
      command: '{{ trigger.event.data.command }}'
      command_type: '{{ trigger.event.data.command_type }}'
    enabled: false
  - repeat:
      while:
      - condition: template
        value_template: '{{ not wait.completed and repeat.index < 10 }}'
      sequence:
      - wait_for_trigger:
        - event_type: lutron_caseta_button_event
          event_data:
            serial: '{{ serial }}'
            action: release
          trigger: event
        timeout:
          milliseconds: 250
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - event: universal_controller_command
          event_data:
            action_type: light_call
            action_value: '{{ target_direction }}'
            area_key: '{{ area_key }}'
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  mode: restart
