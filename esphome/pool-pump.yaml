      - globals.set:
          id: glbl_relay_intent_2
          value: "false"
      - globals.set:
          id: glbl_relay_intent_3
          value: "false"
      - switch.turn_on: relay_4
      - switch.turn_off: helper_1
      - switch.turn_off: helper_2
      - switch.turn_off: helper_3
    on_turn_off:
      - globals.set:
          id: glbl_relay_intent_4
          value: "false"
      - switch.turn_off: relay_4

binary_sensor:
  - id: button_1
    name: Call ${short_name} 1
    platform: gpio
    entity_category: "diagnostic"
    pin:
      number: GPIO0
      inverted: true     
      mode:
        pullup: true
        input: true   
    on_click:
    - min_length: 20ms
      max_length: 350ms
      then:
        - if:
            # If the input -> output functionality is enabled
            condition:
              lambda: 'return id(glbl_relay_bind);'
            then:
              - logger.log:
                  level: DEBUG
                  format: "Button 1 Pressed"
              - switch.toggle: helper_1

  - id: button_2
