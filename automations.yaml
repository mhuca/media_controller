          }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: '{{ area_timer | default(''timer.none'') }}'
      - variables:
          target_val: '{{ sub_data.action_value | default(35 if is_night else 75)
            | int(default=75) }}

            '
      - if:
        - condition: template
          value_template: '{{ is_locked | default(false) }}'
        then:
        - stop: Privacy Lock Active
        else:
        - event: universal_controller_command
