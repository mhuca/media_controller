          '3':
            mask: 512
            action_type: power_on
            service: switch.turn_off
            target:
              entity_id: switch.the_frame_art_mode
          '4':
            mask: 64
            action_type: power_on
            service: media_player.turn_on
            target:
              entity_id: media_player.dhc_60_7_zone_2
          '5':
            mask: 24
            action_type: source_select
            service: media_player.select_source
            target:
              entity_id: media_player.dhc_60_7_zone_2
            data:
              source: NVR
          '1.5':
