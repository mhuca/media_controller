# =============================================================================
# Device Configuration: Furnace Room (TS-602S Model)
# Path: /config/esphome/furnace-room.yaml
# =============================================================================

substitutions:
  name: furnace-room
  friendly_name: "Furnace Room"
  board: esp01_1m
  
  # Automation metadata used by Home Assistant events
  event: nodered_automation
  button: button
  short_name: Speed
  device_type: Fan


  # Core chip architecture must be declared here at the root level:
esp8266:
  board: ${board}
  restore_from_flash: true

preferences:
  flash_write_interval: 30s

# Enable core diagnostic logging
logger:

esphome:
  name: ${name}
  project:
    name: "Generic.TS-602S"
    version: "0.9"

# -----------------------------------------------------------------------------
# Modular Packages (The Core Foundation)
# -----------------------------------------------------------------------------
packages:
  - !include common/network/wifi_iot.yaml          # Sets up Wi-Fi, OTA, and IP sensors
  - !include common/core/system_diagnostics.yaml   # Sets up NTP, Last Boot Time, Free Heap, & Uptime
  - !include common/templates/ts602s_switch.yaml   # Configures platform, relays, buttons, and LEDs- 

# -----------------------------------------------------------------------------
# Core Communications
# -----------------------------------------------------------------------------
api:

# -----------------------------------------------------------------------------
# Local Mappings, Diagnostics, & Timers
# -----------------------------------------------------------------------------
switch:
  # Local template switch mirroring the primary light state
  - id: switch_1
    name: "Local Switch"
    platform: template
    internal: true
    lambda: 'return id(light_1).state;'
    turn_on_action:
      - light.turn_on: light_1
    turn_off_action:
      - light.turn_off: light_1

binary_sensor:
  # Exposes physical button updates locally
  - id: button_1_local
    platform: template
    internal: true
    lambda: 'return id(physical_button).state;'

