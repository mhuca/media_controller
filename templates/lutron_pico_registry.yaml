trigger:
  - platform: event
    event_type: "lutron_button_event"
  - platform: event
    event_type: "pico_register_override"

sensor:
  - name: "Pico Registry"
    unique_id: pico_registry
    state: "{{ trigger.event.data.device_id | default('idle') }}"
    attributes:
      active_sessions: >
        {% set current = state_attr('sensor.pico_registry', 'active_sessions') or {} %}
        {% set now_ts = as_timestamp(now()) %}
        {% set device_id = trigger.event.data.device_id %}
        {% set isOwned = trigger.event.data.isOwned | bool(false) %}

        {% if trigger.event.event_type == 'lutron_button_event' %}
          {# 1. Filter out old/expired locks (> 10s) and the current device #}
          {% set ns = namespace(new={}) %}
          {% for s_id, data in current.items() %}
            {% if (now_ts - data.ts) < 10 and s_id != device_id %}
              {% set ns.new = dict(ns.new, **{s_id: data}) %}
            {% endif %}
          {% endfor %}

          {% if isOwned %}
            {# 2. LOCK: Add device to registry #}
            {% set update = { device_id: { 'isOwned': true, 'ts': now_ts } } %}
            {{ dict(ns.new, **update) }}
          {% else %}
            {# 3. RELEASE: Clear device from registry #}
            {{ ns.new }}
          {% endif %}
        {% else %}
          {{ current }}
        {% endif %}
        
