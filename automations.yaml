- id: '1759555862881'
  alias: Powder Room Motion Changes - State - Timer
  description: Native Binary sensor Powder Room Fan Motion changes State
  triggers:
  - entity_id:
    - binary_sensor.powder_room_fan_motion
    trigger: state
    id: Motion_Detected
    to:
    - 'on'
  - entity_id:
    - binary_sensor.powder_room_fan_motion
    trigger: state
    id: Motion_Cleared
    to:
    - 'off'
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.powder_room_light_timer
    id: Timer_Finished
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Motion_Cleared
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - if:
        - condition: state
          entity_id: binary_sensor.powder_room_door
          state: 'off'
          enabled: true
        then:
        - stop: Door Is Closed
        else:
        - if:
          - condition: state
            entity_id: input_boolean.powder_room_light_override
            state: 'on'
          then:
          - stop: Light Overide is on
          else:
          - action: timer.start
            metadata: {}
            data: {}
            target:
              entity_id:
              - timer.powder_room_light_timer
    - conditions:
      - condition: trigger
        id:
        - Motion_Detected
      sequence:
      - action: timer.cancel
        metadata: {}
        data: {}
        target:
          entity_id:
          - timer.powder_room_light_timer
      - if:
        - condition: state
          entity_id: binary_sensor.powder_room_door
          state: ''
        then:
        - stop: Door Is Closed
        else:
        - if:
          - condition: state
            entity_id: input_boolean.powder_room_light_override
            state: 'off'
          then:
          - if:
            - condition: state
              entity_id: binary_sensor.night_lights_sensor
              state: 'on'
            then:
            - event: universal_controller_command
              event_data:
                action_type: light_call
                command_input: turn_on
                area_key: powder_room
                action_value: '{{ 75 if is_state(''binary_sensor.night_lights_sensor'',
                  ''on'') else 190 }}

                  '
            else:
            - event: universal_controller_command
              event_data:
                action_type: light_call
                command_input: turn_off
                area_key: powder_room
                action_value: ''
    - conditions:
      - condition: trigger
        id:
        - Timer_Finished
      sequence:
      - alias: Emit Generic Universal Controller Command Event
        event: universal_controller_command
        event_data:
          source_device: light
          action_type: light_call
          action_value: ''
          command_input: turn_off
          target_label: ''
          area_key: powder_room
          data_payload: '{{ trigger }}'
          overrides: {}
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.powder_room_light_override
  mode: single
