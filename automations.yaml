      command_input: turn_off
    enabled: true
  conditions: []
  actions:
  - alias: Define Actions
    variables:
      area_key: '{{ trigger.event.data.area_key }}'
      command: '{{ trigger.event.data.command_input }}'
      action_type: '{{ trigger.event.data.action_type }}'
      action_value: '{{ trigger.event.data.action_value }}'
  - variables:
      dim_factor: 7
      transition: 0.2
      overrides: '{{ trigger.event.data.overrides | default('''', true ) }}'
      target_override: '{{ overrides.target | default('''', true ) }}'
      target_label: '{{ trigger.event.data.target_label | default('''', true) }}'
      raw_target: "{% if target_override == '' %} \n  {{ {'area_id': area_key} }}
        \n{% else %}\n  {{ target_override }} \n{% endif %}\n"
      target: "{% set ns = namespace(found=[]) %}\n{% if raw_target.area_id is defined
        %}\n  {% set ns.found = area_entities(raw_target.area_id) %}\n{% elif raw_target.entity_id
        is defined %}\n  {% set ent = raw_target.entity_id %}\n  {% set ns.found =
        [ent] if ent is string else ent %}\n{% endif %}\n{% set expanded = ns.found
        \n    | map('expand') \n    | sum(start=[]) \n    | selectattr('domain', 'eq',
        'light') \n    | map(attribute='entity_id') \n    | list \n%}\n{% if target_label
        != '' %}\n  {# Apply the subset filter to the expanded list #}\n  {{ expanded
        | select('in', label_entities(target_label)) | list | unique | list }}\n{%
        else %}\n  {{ expanded | unique | list }}\n{% endif %}\n"
  - action: light.turn_off
    metadata: {}
    data:
      transition: '{{ transition }}'
    target:
      entity_id: '{{ target }}'
    enabled: true
  mode: queued
  max: 5
