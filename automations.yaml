  max: 10
- id: '1765761830387'
  alias: Automation - Auto-Launch ATV Activity on Native Wake-Up
  description: If the ATV is woken up by a native remote, trigger the Watch_Plex activity
    to power on the rest of the stack.
  triggers:
  - entity_id:
    - media_player.living_room_atv
    from:
    - 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: media_player.vsx_933
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: media_player.samsung_the_frame_65_2
      state: 'off'
    - condition: state
      entity_id: binary_sensor.art_mode_frame_tv
      state: 'on'
  actions:
  - alias: Call Orchestrator for default ATV Activity
    data:
      activity_key: Watch_Plex
    action: script.universal_media_activity_orchestrator
    enabled: false
  mode: single
- id: '1765761956988'
  alias: Art Mode - Auto Revert to Art Mode on ATV Off Proactive Handshake & Interrupt
  description: Distinguishes between User Intent, Sleep Timers, and Glitches. Glitches
    (Default) allow a 60s window for a remote-press veto.
  triggers:
  - trigger: state
    entity_id:
    - media_player.living_room_atv
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 1
  conditions:
  - condition: state
    entity_id: media_player.samsung_the_frame_65_2
    state: 'on'
  - condition: state
    entity_id: binary_sensor.art_mode_frame_tv
    state: 'off'
  - condition: template
    value_template: '{{ trigger.from_state.state != ''unknown'' }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set last_remote = as_timestamp(state_attr(''automation.command_sofabaton_dispatcher'',
          ''last_triggered''), 0) %}

          {{ (as_timestamp(now()) - last_remote) < 15 }}

          '
      sequence:
      - action: script.art_mode_toggle_controller
        data:
          action: enable
        enabled: false
    - conditions:
      - condition: template
        value_template: '{{ trigger.from_state.state in [''idle'', ''paused''] }}'
      sequence:
      - action: script.art_mode_toggle_controller
        data:
          action: enable
    - conditions:
      - condition: template
        value_template: '{{ trigger.from_state.state == ''playing'' }}'
      sequence:
      - action: homeassistant.reload_config_entry
        metadata: {}
        data: {}
        target:
          device_id: 5dcaf3f145bf2751f65c27aab9d7b165
    default:
    - action: logbook.log
      data:
        name: Art Mode Logic
        message: Suspicious ATV shutdown ({{ trigger.from_state.state }} -> off).
          Waiting 60s for veto.
    - wait_for_trigger:
      - trigger: event
        event_type: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: media_call
          area_key: living_room
      - trigger: event
        event_type: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: remote_send
          area_key: living_room
      - trigger: event
        event_type: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: activity_call
          area_key: living_room
      - trigger: state
        entity_id: media_player.living_room_atv
        to: playing
      timeout: 00:01:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.trigger == none }}'
      - condition: state
        entity_id: media_player.living_room_atv
        state: 'off'
      then:
      - action: script.art_mode_toggle_controller
        data:
          action: enable
  mode: restart
