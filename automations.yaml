          seconds: 0
          milliseconds: 300
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          sequence:
          - variables:
              event_count: '{{ event_count + 1 }}'
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is none and event_count == 1 }}'
          sequence:
          - variables:
              is_hold: true
  - variables:
      area_lights: "{{ \n  area_entities(area) \n  | select('match', 'light.') \n
