- id: '22223334445'
  alias: Watchdog - Unified MAC Lookup and Reconnect
  description: Triggers self-healing reconnection for devices that are unavailable/unreachable
    after a sustained period.
  triggers:
  - entity_id: sensor.watchdog_failed_device_count
    above: 0
    for:
      minutes: 2
    trigger: numeric_state
  - minutes: /15
    trigger: time_pattern
  actions:
  - action: logbook.log
    data:
      message: 'WATCHDOG Fired! Mode: {% if trigger.platform == ''numeric_state''
        %}Reactive (Count: {{ trigger.to_state.state }}) {% else %}Proactive (Scheduled){%
        endif %}. Processing {{ states(''sensor.watchdog_failed_device_count'') }}
        failed devices.'
      name: Watchdog Fired
  - if:
    - condition: numeric_state
      entity_id: sensor.watchdog_failed_device_count
      above: 0
    then:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KB5B9CHPZJKAZW2GBN5YYGSW
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KBKT9X9HPMZ4WH8KJEPK0H4W
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KB3263WAPBCQ0R12Y0QAM2H8
    - delay:
        hours: 0
        minutes: 0
        seconds: 20
        milliseconds: 0
  - condition: numeric_state
    entity_id: sensor.watchdog_failed_device_count
    above: 0
  - repeat:
      for_each: '{{ states(''sensor.watchdog_unavailable_device_list'') | from_json
        }}'
      sequence:
      - condition: template
        value_template: "{% set mac = repeat.item.mac %} \n{{ mac is not none and
          mac is not in [\"\", \"00:00:00:00:00:00\", \"unavailable\", \"unknown\",
          \"null\"] }}\n"
      - event: omada_reconnect_mac
        event_data:
          mac: '{{ repeat.item.mac }}'
          entity_id: '{{ repeat.item.entity_id }}'
      - action: logbook.log
        data:
          message: 'RECONNECT SUCCESS for: {{ repeat.item.entity_id }} (MAC: {{ repeat.item.mac
            }})'
          name: Watchdog Reconnect Generated
  mode: parallel
- id: '1765010749347'
  alias: Command - Sofabaton Dispatcher
  description: Triggers actions based on URL query parameters and passes control to
    the Command Router.
  triggers:
  - webhook_id: sofabaton01
    allowed_methods:
    - GET
    - POST
    local_only: true
    trigger: webhook
  conditions: []
  actions:
  - variables:
      last_run: '{{ as_timestamp(this.attributes.last_triggered) | float | default(now())
        }}'
      now_ms: '{{ as_timestamp(now()) | float }}'
      time_delta: '{{ (now_ms - last_run) * 1000 if last_run < now_ms else -1 }}'
      is_hold: '{{ time_delta < 110 }}'
  - variables:
      incoming_payload: '{{ trigger.json | default({''hold_secs'': 0}) }}'
      value_map:
        VUP: volume_up
        VDN: volume_down
        MUT: volume_mute
        PLY: media_play_pause
        NXT: media_next_track
        PRV: media_previous_track
        PWR: turn_off
        ONN: turn_on
        TGL: toggle
        STP: media_stop
        PLA: media_play
        PSE: media_pause
        VST: volume_set
        JUN: join
        UJN: unjoin
        SRC: select_source
        SND: select_sound_mode
        SHF: shuffle_set
        RPT: repeat_set
        MED: play_media
        SEK: media_seek
        CLR: clear_playlist
      remote_value_map:
        UPP: up
        DWN: down
        LFT: left
        RGT: right
        SEL: select
        LSL: select_hold
        MNU: menu
        TMN: top_menu
        HOM: home
        LHM: home_hold
        PLA: play
        PSE: pause
        PLY: play_pause
        STP: stop
        NXT: next
        PRV: previous
        SKF: skip_forward
        SKB: skip_backward
        WKE: wakeup
        SPD: suspend
        VUP: volume_up
        VDN: volume_down
      type_map:
        MED: media_call
        LIT: light_call
        SCN: scene_cycle
        REM: remote_send
        PET: pet_feeder
        ARC: area_command
      final_type: '{{ type_map.get(trigger.query.action, trigger.query.action | default(''media_call''))
        }}'
      final_value: '{{ value_map.get(trigger.query.value | upper, trigger.query.value)
        }}'
      area_key: '{{ trigger.query.area_key | default(''living_room'') }}'
      command_input: '{{ ''broadcast'' if final_type in [''scene_cycle'',''light_call'']
        else '''' }}'
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 20
  - wait_for_trigger:
    - webhook_id: sofabaton01
      allowed_methods:
      - GET
      - POST
      local_only: true
      trigger: webhook
    timeout:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 140
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          sequence:
          - event: universal_controller_command
            event_data:
              source_device: sofabaton
              action_type: '{{ final_type }}'
              action_value: '{{ final_value }}'
              target_label: []
              command: hold
              command_input: '{{ command_input }}'
              area_key: '{{ area_key }}'
              data_payload: '{{ incoming_payload }}'
              overrides: {}
          - wait_for_trigger:
            - trigger: webhook
              webhook_id: sofabaton01
              allowed_methods:
              - POST
              - PUT
              local_only: true
            timeout: '00:00:00.150'
            continue_on_timeout: true
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is none }}'
      sequence:
      - wait_for_trigger:
        - trigger: webhook
          webhook_id: sofabaton01
          allowed_methods:
          - POST
          - PUT
          local_only: true
        timeout:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 250
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.trigger is not none }}'
        then:
        - variables:
            command: double
        else:
        - variables:
            command: press
      - event: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: '{{ final_type }}'
          action_value: '{{ final_value }}'
          target_label: []
          command: '{{ command }}'
          command_input: '{{ command_input }}'
          area_key: '{{ area_key }}'
          data_payload: '{{ incoming_payload }}'
          overrides: {}
  mode: single
- &id001
  id: '1765852842316'
  alias: Command - Pico Dispatcher - New DELETE
  description: Single, double, and long press detection
  triggers:
  - trigger: event
    event_type: lutron_caseta_button_event
    event_data:
      action: press
  conditions: []
  actions:
  - wait_for_trigger:
    - event_type: lutron_caseta_button_event
      event_data:
        serial: '{{ serial }}'
        button_number: '{{ button_number }}'
        action: release
      id: release_event
      trigger: event
    timeout:
      milliseconds: 450
    continue_on_timeout: true
  - variables:
      area_key: '{{ area_id(trigger.event.data.device_id) }}'
      data_override: "{% set all_overrides = label_entities('override') \n  | select('match',
        'sensor.')\n  | list\n%}\n{% set overrides = \n  device_entities(trigger.event.data.device_id)
        \n  | select('match','sensor.')\n  | select('in', all_overrides )\n  | list\n%}\n{%
        if overrides | length > 0 %}\n  {{ states(overrides[0]) | default('') }}\n{%
        endif%}\n"
      command_input: '{{ ''turn_off'' if trigger.event.data.button_type == ''off''
        else ''turn_on'' }}'
      target_device_name: "{{ trigger.event.data.device_name \n  | lower \n  | replace('
        ','_') \n  | regex_replace(find='\\\\d+', replace='')\n}}\n"
      target_lights: "{% set all_lights = label_entities(target_device_name) \n  |
        select('match', 'light.')\n  | list\n%}    \n{{\n  area_entities(area_key)
        \n  | select('match','light.')\n  | select('in', all_lights )\n  | list\n}}\n"
      target: "{% set target = {} %}\n{% if trigger.event.data.device_name != 'Remote'
        %} \n  {% set target = target \n    | combine({'target':{'entity_id': target_lights
        }}) \n  %}\n{% endif %}\n{% if data_override | length > 0 %}\n  {% set target
        = target \n    | combine(data_override) \n  %}\n{% endif %}\n{{ target }}\n"
      action_type: "{{ 'media_call' if trigger.event.data.device_name == 'Media' else
        'light_call' }} \n"
      device_prefix: "{{ 'media_' if trigger.event.data.device_name == 'Media' else
        '' }} \n"
  - if:
    - condition: template
      value_template: '{{ wait.completed }}'
    then:
    - wait_for_trigger:
      - event_type: lutron_caseta_button_event
        event_data:
          serial: '{{ serial }}'
          button_number: '{{ button_number }}'
          action: press
        id: press_event
        trigger: event
      timeout:
        milliseconds: 250
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.completed }}'
      then:
      - variables:
          command: double
          action_value: "{% set command_map = {\n    'on': 'max',\n    'raise': '',\n
            \   'stop': '',\n    'lower': '',\n    'off': 'min',\n    'media_on':
            '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
            \   'media_stop': 'play.toggle',\n    'media_off': ''\n} %}\n{{ command_map[device_prefix
            ~ trigger.event.data.button_type] }}\n"
          command_input: turn_on
      - alias: Double Event
        event: universal_controller_command
        event_data:
          source_device: pico
          action_type: '{{ action_type }}'
          action_value: '{{ action_value }}'
          command_input: '{{ command_input }}'
          area_key: '{{ area_id(trigger.event.data.device_id) }}'
          data_payload: '{{ trigger.event.data }}'
          overrides: '{{ target }}'
          command: '{{ command }}'
          command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
            ', '') \n  | replace('_', '') }}_{{ command }}\n"
      else:
      - variables:
          command: press
          action_value: "{% set command_map = {\n    'on': '',\n    'raise': 'raise',\n
            \   'stop': '',\n    'lower': 'lower',\n    'off': '',\n    'media_on':
            '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
            \   'media_stop': 'play.toggle',\n    'media_off': ''\n} %}\n{{ command_map[device_prefix
            ~ trigger.event.data.button_type] }}\n"
      - alias: Press Event
        event: universal_controller_command
        event_data:
          source_device: pico
          action_type: '{{ action_type }}'
          action_value: '{{ action_value }}'
          command_input: '{{ command_input }}'
          area_key: '{{ area_id(trigger.event.data.device_id) }}'
          data_payload: '{{ trigger.event.data }}'
          overrides: '{{ target }}'
          command: '{{ command }}'
          command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
            ', '') \n  | replace('_', '') }}_{{ command }}\n"
    else:
    - variables:
        command: hold
        action_value: "{% set command_map = {\n    'on': 'raise',\n    'raise': 'raise',\n
          \   'stop': '',\n    'lower': 'lower',\n    'off': 'lower',\n    'media_on':
          '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
          \   'media_stop': 'play.toggle',\n    'media_off': ''\n} %}\n{{ command_map[device_prefix
          ~ trigger.event.data.button_type] }}\n"
        command_input: turn_on
    - alias: Hold Event
      event: universal_controller_command
      event_data:
        source_device: pico
        action_type: '{{ action_type }}'
        action_value: '{{ action_value }}'
        command_input: '{{ command_input }}'
        area_key: '{{ area_id(trigger.event.data.device_id) }}'
        data_payload: '{{ trigger.event.data }}'
        overrides: '{{ target }}'
        command: '{{ command }}'
        command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
          ', '') \n  | replace('_', '') }}_{{ command }}\n"
    - repeat:
        while:
        - condition: template
          value_template: '{{ not wait.completed }}'
        sequence:
        - alias: Hold Event Repeat
          event: universal_controller_command
          event_data:
            source_device: pico
            action_type: '{{ action_type }}'
            action_value: '{{ action_value }}'
            command_input: '{{ command_input }}'
            area_key: '{{ area_id(trigger.event.data.device_id) }}'
            data_payload: '{{ trigger.event.data }}'
            overrides: '{{ target }}'
            command: '{{ command }}'
            command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
              ', '') \n  | replace('_', '') }}_{{ command }}\n"
        - wait_for_trigger:
          - event_type: lutron_caseta_button_event
            event_data:
              serial: '{{ serial }}'
              button_number: '{{ button_number }}'
              action: release
            trigger: event
          timeout:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 450
          continue_on_timeout: true
    - variables:
        command: release
        action_value: "{% set command_map = {\n    'on': 'max',\n    'raise': '',\n
          \   'stop': '',\n    'lower': '',\n    'off': 'min',\n    'media_on': '',\n
          \   'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n    'media_stop':
          'play.toggle',\n    'media_off': ''\n} %}\n{{ command_map[device_prefix
          ~ trigger.event.data.button_type] }}\n"
        command_input: ''
    - alias: Release Event
      event: universal_controller_command
      event_data:
        source_device: pico
        action_type: '{{ action_type }}'
        action_value: '{{ action_value }}'
        command_input: '{{ command_input }}'
        area_key: '{{ area_id(trigger.event.data.device_id) }}'
        data_payload: '{{ trigger.event.data }}'
        overrides: '{{ target }}'
        command: '{{ command }}'
        command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
          ', '') \n  | replace('_', '') }}_{{ command }}\n"
      enabled: false
  mode: queued
  max: 5
  variables:
    serial: '{{ trigger.event.data.serial }}'
    button_number: '{{ trigger.event.data.button_number }}'
