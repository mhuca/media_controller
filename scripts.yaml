media_activity_snapshot_v4_0:
  alias: Media Activity Snapshot (v4.0)
  description: Captures current hardware states using definitive label discovery.
    Includes Art/Video bitmask logic (1, 2, 4, 8, 64, 128).
  fields:
    area_key:
      name: Target Area
      required: true
      default: living_room
      selector:
        area:
    activity_name:
      name: Activity Name
      description: e.g., 'Netflix', 'PS5', 'Music'
      required: true
      selector:
        text:
    remote_cmd:
      name: Final Remote Command
      description: 'Optional: Command to send after switching (e.g. ''home'').'
      required: false
      default: none
      selector:
        text:
  sequence:
  - alias: 1. Hardware Discovery & State Analysis
    variables:
      avr: '{{ (label_entities(''media_role_avr'') | select(''in'', area_entities(area_key))
        | first | default(''none'')) | replace(''"'', '''') | trim }}'
      tv_dev: '{{ (label_devices(''media_role_tv'') | select(''in'', area_devices(area_key))
        | first | default(''none'')) | replace(''"'', '''') | trim }}'
      tv: '{{ (device_entities(tv_dev) | select(''match'', ''media_player\.'') | first
        | default(''none'')) | replace(''"'', '''') | trim }}'
      atv_dev: '{{ (label_devices(''media_role_source_atv'') | select(''in'', area_devices(area_key))
        | first | default(''none'')) | replace(''"'', '''') | trim }}'
      atv: '{{ (device_entities(atv_dev) | select(''match'', ''media_player\.'') |
        first | default(''none'')) | replace(''"'', '''') | trim }}'
      interconnect: '{{ (label_entities(''media_role_interconnect'') | select(''in'',
        area_entities(area_key)) | first | default(''none'')) | replace(''"'', '''')
        | trim }}'
      art: '{{ (label_entities(''media_role_art_sensor'') | select(''in'', area_entities(area_key))
        | first | default(''none'')) | replace(''"'', '''') | trim }}'
      calculated_bits: '{% set avr_on = 1 if is_state(avr, ''on'') else 0 %} {% set
        tv_on = 2 if is_state(tv, ''on'') else 0 %} {% set atv_on = 4 if (atv != ''none''
        and not is_state(atv, ''off'') and not is_state(atv, ''unavailable'')) else
        0 %} {% set int_on = 8 if is_state(interconnect, ''on'') else 0 %} {% set
        art_active = is_state(art, ''on'') if art != ''none'' else false %} {% set
        art_on = 64 if (is_state(tv, ''on'') and art_active) else 0 %} {% set vid_on
        = 128 if (is_state(tv, ''on'') and not art_active) else 0 %} {{ (avr_on +
        tv_on + atv_on + int_on + art_on + vid_on) | int }}'
      atv_active: '{{ calculated_bits | int | bitwise_and(4) }}'
      activity_id: "{{ { activity_name | lower | replace(' ', '_') : {\n    'bits':
        calculated_bits,\n    'source': state_attr(avr, 'source') | default('none'),\n
        \   'sound':  state_attr(avr, 'sound_mode') | default('none'),\n    'app_id':
        state_attr(atv, 'app_id') if calculated_bits | bitwise_and(4) == 4 else 'none',\n
        \   'app':  state_attr(atv, 'app_name') if calculated_bits | bitwise_and(4)
        == 4 else 'none' ,\n    'remote_cmd': remote_cmd \n    }  \n  }\n}}\n"
  - alias: 2. Transmit Snapshot to UCC
    if:
    - condition: template
      value_template: '{{ calculated_bits > 0 }}'
    then:
    - event: capture_media_activity
      event_data:
        area_key: '{{ area_key }}'
        activity: '{{ activity_id }}'
        debug_info:
          tv: '{{ tv }}'
          art_sensor: '{{ art }}'
          area_name: '{{ area_name(area_key) }}'
    - action: logbook.log
      data:
        name: UCC Snapshot
        message: 'Saved ''{{ activity_name }}'' for {{ area_key }} (Bits: {{ calculated_bits
          }})'
