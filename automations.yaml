          integration: '{{ config_entry_attr(config_id, ''domain'') if config_id else
            ''unknown'' }}'
          target_val: '{% if integration == ''zha'' %} 10 {% elif integration == ''matter''
            %} 0.1 {% else %} 1 {% endif %}

            '
          current_val: '{{ states(repeat.item) | float(-1) }}'
      - if:
        - condition: template
          value_template: '{{ (current_val - target_val) | abs > 0.01 }}'
        then:
        - action: number.set_value
          target:
            entity_id: '{{ repeat.item }}'
          data:
            value: '{{ target_val }}'
        - delay: 00:00:01
