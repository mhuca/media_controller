  alias: Lutron Pico - Backup (1/11/26)
  description: Single, double, and long press detection
  triggers:
  - trigger: event
    event_type: lutron_caseta_button_event
    event_data:
      action: press
  conditions: []
  actions:
  - alias: Look for Proactive Subscription
    wait_for_trigger:
    - event_type: pico_subscription
      trigger: event
      event_data:
        session_id: '{{ session_id }}'
    continue_on_timeout: true
    enabled: true
    timeout:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 10
  - variables:
      sub_captured: '{{ wait.trigger is not none }}'
      subscription: '{{ wait.trigger.event.data if wait.trigger is not none else none
        }}'
  - variables:
      serial: '{{ trigger.event.data.serial }}'
      button_number: '{{ trigger.event.data.button_number }}'
      area_key: '{{ area_id(trigger.event.data.device_id) }}'
      old_action_type: '{{ ''media_call'' if trigger.event.data.device_name == ''Media''
        else ''light_call'' }}

        '
      target_device_name: "{{ trigger.event.data.device_name \n  | lower \n  | replace('
        ','_') \n  | regex_replace(find='\\\\d+', replace='')\n}}\n"
      device_prefix: "{{ 'media_' if trigger.event.data.device_name == 'Media' else
        '' }} \n"
      default_action_type: "{% set intent_map = {\n    'zone': 'scene_cycle',\n    'scene':
        'scene_cycle',\n    'media': 'media_call'\n} %}\n{{ intent_map[target_device_name]
        | default('light_call') }}\n"
  - wait_for_trigger:
    - event_type: lutron_caseta_button_event
      event_data:
        serial: '{{ serial }}'
        button_number: '{{ button_number }}'
        action: release
      id: release_event
      trigger: event
    timeout:
      milliseconds: 350
    continue_on_timeout: true
    alias: Wait for first Release Event... If None After 450ms then it's Hold
  - variables:
      is_hold: '{{ wait.trigger is none }}'
      release_wait: '{{ wait }}'
      data_override: "{% set all_overrides = label_entities('override') \n  | select('match',
        'sensor.')\n  | list\n%}\n{% set overrides = \n  device_entities(trigger.event.data.device_id)
        \n  | select('match','sensor.')\n  | select('in', all_overrides )\n  | list\n%}\n{%
        if overrides | length > 0 %}\n  {{ states(overrides[0]) | default('') }}\n{%
        endif%}\n"
      command_input: '{{ ''turn_off'' if trigger.event.data.button_type == ''off''
        else ''turn_on'' }}'
      temp_all: "{{\n  label_entities(target_device_name) \n    | select('match',
        'light.')\n    | list \n}}\n"
      temp_area_lights: "{{\n  area_entities(area_key) \n  | select('match','light.')\n
        \ | list\n}}\n"
      target_lights: "{% set all_lights = label_entities(target_device_name) \n  |
        select('match', 'light.')\n  | list\n%}    \n{{\n  area_entities(area_key)
        \n  | select('match','light.')\n  | select('in', all_lights )\n  | list\n}}\n"
      target: "{% set target = {} %}\n{% if trigger.event.data.device_name != 'Remote'
        %} \n  {% set target = target \n    | combine({'target':{'entity_id': target_lights
        }}) \n  %}\n{% endif %}\n{% if data_override | length > 0 %}\n  {% set target
        = target \n    | combine(data_override) \n  %}\n{% endif %}\n{{ target }}
        \n"
      hold_duration: '{{ 500 - (wait.remaining | default(0) * 1000) }}'
  - if:
    - condition: template
      value_template: '{{ not is_hold }}'
    then:
    - wait_for_trigger:
      - event_type: lutron_caseta_button_event
        event_data:
          serial: '{{ serial }}'
          button_number: '{{ button_number }}'
          action: press
        id: press_event
        trigger: event
      timeout:
        milliseconds: 250
      continue_on_timeout: true
      alias: Wait For Second Press
    - variables:
        is_double: '{{ wait.trigger is not none }}'
    - if:
      - condition: template
        value_template: '{{ is_double }}'
      then:
      - variables:
          command: double
          action_value: "{% set command_map = {\n    'on': 'max',\n    'raise': '',\n
            \   'stop': '',\n    'lower': '',\n    'off': 'min',\n    'media_on':
            '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
            \   'media_stop': 'play.toggle',\n    'media_off': ''\n} %}\n{{ command_map[device_prefix
            ~ trigger.event.data.button_type] }}\n"
          command_input: turn_on
      else:
      - variables:
          command: press
          action_value: "{% set command_map = {\n    'on': '',\n    'raise': 'raise',\n
            \   'stop': '',\n    'lower': 'lower',\n    'off': '',\n    'media_on':
            'play.toggle',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
            \   'media_stop': 'volume.mute',\n    'media_off': 'media.next'\n} %}\n{{
            command_map[device_prefix ~ trigger.event.data.button_type] }}\n"
    - variables:
        command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
          ', '') \n  | replace('_', '') }}_{{ command }}\n"
    - variables:
        override_command: "{% if subscription is not none %}\n  {{ subscription.command_map[command]
          is not none }}\n{% else %}\n  {{ false }}\n{% endif %}\n"
        valid_commands: '{{ subscription.command_map[command] if override_command
          else none }}'
        override_button: "{% if valid_commands is not none %}\n  {{ valid_commands[
          button_number | string ] is not none }}\n{% else %}\n  {{ false }}\n{% endif
          %}\n"
        the_action_type: "{{ \n  subscription.command_map[command][ button_number
          | string ]['type']\n  if override_button else default_action_type\n}}\n"
        the_action_value: "{{ \n  subscription.command_map[command][ button_number
          | string ]['value']\n  if override_button else action_value\n}}\n"
    - alias: Press Event
      event: universal_controller_command
      event_data:
        source_device: pico
        action_type: '{{ the_action_type }}'
        action_value: '{{ the_action_value }}'
        command_input: '{{ command_input }}'
        area_key: '{{ area_id(trigger.event.data.device_id) }}'
        session_id: '{{ session_id }}'
        data_payload: '{{ trigger.event.data }}'
        overrides: '{{ target }}'
        command: '{{ command }}'
        command_type: '{{ command_type }}'
      enabled: true
    else:
    - variables:
        command: hold
        action_value: "{% set command_map = {\n    'on': 'raise',\n    'raise': 'raise',\n
          \   'stop': '',\n    'lower': 'lower',\n    'off': 'lower',\n    'media_on':
          '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
          \   'media_stop': '',\n    'media_off': ''\n} %}\n{{ command_map[device_prefix
          ~ trigger.event.data.button_type] }}\n"
        command_input: turn_on
    - variables:
        buttons: '{{ button_type in subscription.buttons }}'
        bypass_command: '{{ command in subscription.types }}'
        is_overridden: '{{ buttons and bypass_command }}'
        action_type: '{{ subscription.topic if is_overridden else default_action_type
          }}'
        command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
          ', '') \n  | replace('_', '') }}_{{ command }}\n"
        repeat_delay: '{{ 125 if action_type == ''media_call'' else 500 }}'
        max_hold_time: 9
        max_iterations: '{{ (max_hold_time / (repeat_delay / 1000)) | round(0) }}'
        override_command: "{% if subscription is not none %}\n  {{ subscription.command_map[command]
          is not none }}\n{% else %}\n  {{ false }}\n{% endif %}\n"
        valid_commands: '{{ subscription.command_map[command] if override_command
          else none }}'
        override_button: "{% if valid_commands is not none %}\n  {{ valid_commands[
          button_number | string ] is not none }}\n{% else %}\n  {{ false }}\n{% endif
          %}\n"
        the_action_type: "{{ \n  subscription.command_map[command][ button_number
          | string ]['type']\n  if override_button else default_action_type\n}}\n"
        the_action_value: "{{ \n  subscription.command_map[command][ button_number
          | string ]['value']\n  if override_button else action_value\n}}\n"
    - repeat:
        until:
        - condition: template
          value_template: '{{ not is_hold or repeat.index > max_iterations }}'
        sequence:
        - alias: Hold Event
          event: universal_controller_command
          event_data:
            source_device: pico
            action_type: '{{ the_action_type }}'
            action_value: '{{ the_action_value }}'
            command_input: '{{ command_input }}'
            area_key: '{{ area_id(trigger.event.data.device_id) }}'
            session_id: '{{ session_id }}'
            data_payload: '{{ trigger.event.data }}'
            overrides: '{{ target }}'
            command: '{{ command }}'
            command_type: '{{ command_type }}'
          enabled: true
        - wait_for_trigger:
          - event_type: lutron_caseta_button_event
            event_data:
              serial: '{{ serial }}'
              button_number: '{{ button_number }}'
              action: release
            trigger: event
          timeout:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: '{{ repeat_delay | int }}'
          continue_on_timeout: true
        - variables:
            is_hold: '{{ wait.trigger is none }}'
      enabled: true
    - variables:
        command: release
    - alias: Release Event
      event: universal_controller_command
      event_data:
        source_device: pico
        action_type: '{{ the_action_type }}'
        action_value: release
        command_input: '{{ command_input }}'
        area_key: '{{ area_id(trigger.event.data.device_id) }}'
        session_id: '{{ session_id }}'
        data_payload: '{{ trigger.event.data }}'
        overrides: '{{ target }}'
        command: '{{ command }}'
        command_type: '{{ command_type }}'
      enabled: true
  mode: single
  variables:
    session_id: '{{ trigger.event.context.id }}'


- id: '1768189177427'
  alias: Pico Command Dispatcher
  description: Single, double, and long press detection with scope safety
  triggers:
  - trigger: event
    event_type: lutron_caseta_button_event
    event_data:
      action: press
  conditions: []
  actions:
  - variables:
      session_id: '{{ trigger.event.context.id | default(''none'') }}'
      serial: '{{ trigger.event.data.serial | default(0) }}'
      button_number: '{{ trigger.event.data.button_number | default(0) }}'
      button_type: '{{ trigger.event.data.button_type | default(''unknown'') }}'
      device_name: '{{ trigger.event.data.device_name | default(''unknown'') }}'
      device_id: '{{ trigger.event.data.device_id | default(''none'') }}'
  - alias: Look for Proactive Subscription
    wait_for_trigger:
    - event_type: pico_subscription
      trigger: event
      event_data:
        session_id: '{{ session_id | default(''none'') }}'
    continue_on_timeout: true
    timeout:
      milliseconds: 30
  - variables:
      sub_captured: '{{ wait.trigger is not none }}'
      subscription: '{{ wait.trigger.event.data if wait.trigger is not none else {}
        }}'
      area_key: '{{ area_id(device_id) | default(''none'') }}'
      target_device_name: '{{ device_name | lower | replace('' '',''_'') | regex_replace(find=''\\d+'',
        replace='''') | default(''unknown'') }}'
      device_prefix: '{{ ''media_'' if ''media'' in target_device_name else '''' }}'
      default_action_type: '{% set intent_map = {''zone'': ''scene_cycle'', ''scene'':
        ''scene_cycle'', ''media'': ''media_call''} %} {{ intent_map.get(target_device_name,
        ''light_call'') }}'
  - alias: Wait for Release (Hold Detection)
    wait_for_trigger:
    - trigger: event
      event_type: lutron_caseta_button_event
      event_data:
        serial: '{{ serial | default(0) }}'
        button_number: '{{ button_number | default(0) }}'
        action: release
      id: release_event
    timeout:
      milliseconds: 350
    continue_on_timeout: true
  - variables:
      is_hold: '{{ wait.trigger is none }}'
      target_lights: '{% set all_tagged = label_entities(target_device_name) | select(''match'',
        ''light.'') | list %} {{ area_entities(area_key) | select(''match'',''light.'')
        | select(''in'', all_tagged ) | list }}'
      command_input: '{{ ''turn_off'' if button_type == ''off'' else ''turn_on'' }}'
  - if:
    - condition: template
      value_template: '{{ not is_hold }}'
    then:
    - alias: Wait For Second Press (Double Click)
      wait_for_trigger:
      - trigger: event
        event_type: lutron_caseta_button_event
        event_data:
          serial: '{{ serial | default(0) }}'
          button_number: '{{ button_number | default(0) }}'
          action: press
        id: press_event
      timeout:
        milliseconds: 250
      continue_on_timeout: true
    - variables:
        is_double: '{{ wait.trigger is not none }}'
        command: '{{ ''double'' if is_double else ''press'' }}'
        the_action_type: '{{ subscription.get(''command_map'', {}).get(command, {}).get(button_number
          | string, {}).get(''type'', default_action_type) }}'
        the_action_value: '{{ subscription.get(''command_map'', {}).get(command, {}).get(button_number
          | string, {}).get(''value'', '''') }}'
    - event: universal_controller_command
      event_data:
        action_type: '{{ the_action_type }}'
        action_value: '{{ the_action_value }}'
        area_key: '{{ area_key }}'
        session_id: '{{ session_id }}'
        command: '{{ command }}'
    else:
    - variables:
        command: hold
        the_action_type: '{{ subscription.get(''command_map'', {}).get(''hold'', {}).get(button_number
          | string, {}).get(''type'', default_action_type) }}'
        repeat_delay: '{{ 125 if the_action_type == ''media_call'' else 500 }}'
    - repeat:
        until:
        - condition: template
          value_template: '{{ not is_hold or repeat.index > 20 }}'
        sequence:
        - event: universal_controller_command
          event_data:
            action_type: '{{ the_action_type }}'
            area_key: '{{ area_key }}'
            session_id: '{{ session_id }}'
            command: hold
        - wait_for_trigger:
          - trigger: event
            event_type: lutron_caseta_button_event
            event_data:
              serial: '{{ serial | default(0) }}'
              button_number: '{{ button_number | default(0) }}'
              action: release
          timeout:
            milliseconds: '{{ repeat_delay | int(500) }}'
          continue_on_timeout: true
        - variables:
            is_hold: '{{ wait.trigger is none }}'
  mode: single