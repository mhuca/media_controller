- id: '1768418509037'
  alias: Dispatcher - ZHA Momentary Producer
  description: Handles timing and intent for all devices labeled 'momentary'
  triggers:
  - event_type: zha_event
    event_data:
      command: toggle
    trigger: event
  conditions:
  - alias: Gatekeeper & Validation
    condition: template
    value_template: '{{ this.attributes.current == 0 }}

      '
  actions:
  - condition: template
    value_template: '{{ ''momentary'' in all_labels and this.attributes.current ==
      0 }}'
  - variables:
      area: '{{ area_id(dev_id) }}'
      target_label: '{{ labels(dev_id) | reject(''eq'', ''momentary'') | list | default([]
        ) }}'
      event_count: 1
      is_hold: false
  - repeat:
      until:
      - condition: template
        value_template: '{{ wait.trigger is none or is_hold }}'
      sequence:
      - wait_for_trigger:
        - event_type: zha_event
          event_data:
            device_id: '{{ dev_id }}'
            command: toggle
          trigger: event
        timeout:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 300
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          sequence:
          - variables:
              event_count: '{{ event_count + 1 }}'
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is none and event_count == 1 }}'
          sequence:
          - variables:
              is_hold: true
  - variables:
      area_lights: "{{ \n  area_entities(area) \n  | select('match', 'light.') \n
        \ | list \n}}\n"
      target_labels: "{{ ( [target_label] if target_label is string else target_label
        ) \n  | map('label_entities') \n  | sum(start=[]) \n  | unique \n  | list
        \n}}\n"
      expanded_targets: '{{ area_lights | intersect(target_labels) if target_labels
        | length > 0 else area_lights }}

        '
      target_entities: "{{ states.light \n  | selectattr('entity_id', 'in', expanded_targets)
        \n  | map(attribute='entity_id') \n  | list }}\n"
  - variables:
      dim_direction: "{% if target_entities | length > 0 %}\n  {{ 'lower' if (state_attr(target_entities[0],
        'brightness') | int(0) > 190 ) else 'raise' }}\n{% else %}\n  raise\n{% endif
        %}\n"
      target_state: "{% if target_entities | length > 0 %}\n  {{ 'turn_on' if (states(target_entities[0])
        == 'off' ) else 'turn_off' }}\n{% else %}\n  turn_off\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_hold }}'
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ wait.trigger is not none or repeat.index >= 22 }}'
          sequence:
          - event: universal_controller_command
            event_data:
              action_type: light_call
              command_input: turn_on
              action_value: '{{ dim_direction }}'
              area_key: '{{ area }}'
              target_label: '{{ target_label }}'
          - wait_for_trigger:
            - event_type: zha_event
              event_data:
                device_id: '{{ dev_id }}'
                command: toggle
              trigger: event
            timeout:
              hours: 0
              minutes: 0
              seconds: 0
              milliseconds: 500
            continue_on_timeout: true
      - event: universal_controller_command
        event_data:
          action_type: light_call
          command_input: turn_on
          action_value: release
          area_key: '{{ area }}'
          target_label: '{{ target_label }}'
    - conditions:
      - condition: template
        value_template: '{{ not is_hold }}'
      sequence:
      - variables:
          taps: '{{ ((event_count + 1) // 2) | int }}'
      - event: universal_controller_command
        event_data:
          action_type: light_call
          command_input: '{{ target_state if taps == 1 else ''turn_on'' }}'
          action_value: '{{ '''' if taps == 1 else ''max'' }}

            '
          area_key: '{{ area }}'
          target_label: '{{ target_label }}'
  variables:
    dev_id: '{{ trigger.event.data.device_id }}'
    all_labels: '{{ labels(dev_id) | list }}'
  mode: parallel
  max: 10
