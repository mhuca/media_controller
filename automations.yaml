      is_hold: false
  - repeat:
      until:
      - condition: template
        value_template: '{{ wait.trigger is none or is_hold }}'
      sequence:
      - wait_for_trigger:
        - event_type: zha_event
          event_data:
            device_id: '{{ dev_id }}'
            command: toggle
          trigger: event
        timeout:
          hours: 0
