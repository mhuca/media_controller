- id: '1760888078136'
  alias: Command - CCT Parallel Running
  description: Sets CCT based on Sun Azimuth, Elevation, and Cloud Cover
  triggers:
  - trigger: state
    entity_id:
    - sensor.cct_calculation
    id: target_change
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions:
  - condition: numeric_state
    entity_id: sensor.count_lights_on
    above: 0
  actions:
  - variables:
      target_kelvin: '{{ states(''sensor.cct_calculation'') | int(3200) }}'
      active_lights: "{{ states.light \n  | selectattr('state', 'eq', 'on') \n  |
        map(attribute='entity_id') \n  | list \n}}\n"
  - variables:
      native_cct_targets: "{{ states.light           \n  | selectattr('state', 'eq',
        'on')\n  | selectattr('attributes.supported_color_modes', 'defined')\n  |
        selectattr('attributes.supported_color_modes', 'contains', 'color_temp')\n
        \ | map(attribute='entity_id')\n  | list \n}}\n"
      dimmer_targets: "{{ active_lights \n  | select('in', label_entities('CurrentCTDimmer'))
        \n  | list\n}}\n"
  - parallel:
    - alias: Update Native CCT
      if:
      - condition: template
        value_template: '{{ native_cct_targets | length > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ native_cct_targets }}'
        data:
          transition: 10
          color_temp_kelvin: '{{ target_kelvin }}'
    - alias: Update Dimmer Group 1
      if:
      - condition: template
        value_template: '{{ dimmer_targets | length > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ dimmer_targets }}'
        data:
          transition: 0
          brightness: '{{ states(''sensor.cct_to_brightness'') | int }}'
  mode: restart
- id: '1761947020136'
  alias: Switch Guest Bedroom Main Switch Events
  description: Single, double, and long press detection for Guest Bedroom Main Light
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: adfe4ae4a6d5faac4e115663cedd6781
      command: toggle
  conditions: []
  actions:
  - wait_for_trigger:
    - event_type: zha_event
      event_data:
        device_id: '{{ device_id }}'
        command: toggle
      id: release_event
      trigger: event
    timeout:
      milliseconds: 450
    continue_on_timeout: true
    alias: Wait for second Toggle Event
  - alias: If Toggle Then Press or Double
    if:
    - condition: template
      value_template: '{{ wait.completed }}'
      alias: Hold - Toggle Event NOT Seen
    then:
    - wait_for_trigger:
      - event_type: zha_event
        event_data:
          device_id: '{{ device_id }}'
          command: toggle
        id: release_event
        trigger: event
      timeout:
        milliseconds: 250
      continue_on_timeout: true
      alias: Wait for Third Toggle Event
    - alias: If Third Toggle Then Double else Press
      if:
      - condition: template
        value_template: '{{ wait.completed }}'
        alias: Double if Timedout
      then:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
          entity_id:
          - light.guest_bedroom_main
        alias: Light Max
      else:
      - action: light.toggle
        metadata: {}
        data: {}
        target:
          entity_id: light.guest_bedroom_main
    else:
    - if:
      - condition: state
        entity_id: light.guest_bedroom_main
        state:
        - 'off'
      then:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.guest_bedroom_main
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 50
    - variables:
        brightness_step: "{% if state_attr('light.guest_bedroom_main','brightness')
          | int > 175 %}\n  -15\n{% else %}\n  15\n{% endif %}\n"
        is_hold: '{{ true }}'
    - repeat:
        until:
        - condition: template
          value_template: '{{ repeat.index  > 10 or not is_hold }}'
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_step: '{{ brightness_step | int(15) }}'
          target:
            entity_id: light.guest_bedroom_main
        - wait_for_trigger:
          - event_type: zha_event
            event_data:
              device_id: '{{ device_id }}'
              command: toggle
            id: release_event
            trigger: event
          timeout:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 450
          continue_on_timeout: true
        - variables:
            is_hold: '{{ wait.completed }}'
  mode: single
  variables:
    device_id: '{{ trigger.event.data.device_id }}'
