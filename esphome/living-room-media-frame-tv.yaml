  - platform: hlw8012
    sel_pin: { number: GPIO12, inverted: true }
    cf_pin: GPIO4
    cf1_pin: GPIO5
    voltage_divider: 780 
    current_resistor: 0.001
    change_mode_every: 1 
    update_interval: 5s 
    power:
      id: raw_power
      name: "Power"
      unit_of_measurement: W
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
        - calibrate_linear:
            - 0.0000 -> 0.5900
            - 0.0000 -> 1.5600
            - 198.5129 -> 87.8300
            - 434.2469 -> 189.5000
        - lambda: if (x < 1.5600) return 0; else return (x - 1.5600);

