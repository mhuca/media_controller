      - event: universal_controller_command
        event_data:
          source_device: presence
          action_type: light_call
          command_input: turn_off
          area_key: '{{ target_area | default(''unknown'') }}'
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ area_override | default(''input_boolean.none'') }}'
