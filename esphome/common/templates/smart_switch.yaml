select:
  - platform: template
    name: "Indicator LED Mode"
    id: indicator_led_mode
    icon: "mdi:led-variant"
    entity_category: "config"
    optimistic: true
    options:
      - "Status Viewport"
      - "Locator Beacon"
      - "Always Off"
    initial_option: "Status Viewport"
    restore_value: true
    on_value:
      then:
        - script.execute: evaluate_indicator_state