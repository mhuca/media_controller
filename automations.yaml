- id: '1769115962371'
  alias: Lutron Pico - Backup (1/22/26)
  description: Single, double, and long press detection
  triggers:
  - trigger: event
    event_type: lutron_caseta_button_event
    event_data:
      action: press
  conditions: []
  actions:
  - variables:
      session_id: '{{ trigger.event.context.id | default(''none'') }}'
      serial: '{{ trigger.event.data.serial | default(0) }}'
      button_number: '{{ trigger.event.data.button_number | default(0) }}'
      button_type: '{{ trigger.event.data.button_type | default(''unknown'') }}'
      device_name: '{{ trigger.event.data.device_name | default(''unknown'') }}'
      device_id: '{{ trigger.event.data.device_id | default(''none'') }}'
  - alias: Look for Proactive Subscription
    wait_for_trigger:
    - event_type: pico_subscription
      trigger: event
      event_data:
        session_id: '{{ session_id | default(''none'') }}'
    continue_on_timeout: true
    enabled: true
