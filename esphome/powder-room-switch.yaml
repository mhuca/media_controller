# =============================================================================
# Area Switch Implementation: Powder Room
# Path: /config/esphome/powder_room_switch.yaml
# =============================================================================

substitutions:
  device_name: "powder-room-switch"
  area_id: "powder_room"
  area_name: "Powder Room"
  friendly_name: "${area_name} Switch"
  board: esp01_1m

esphome:
  name: ${device_name}
  comment: "Decoupled Edge Controller with Local Zigbee2MQTT Fallback"
  
  # Boot Trigger: Request Area Context Update on startup
  # on_boot:
  #   priority: -100.0
  #   then:
  #     - if:
  #         condition:
  #           api.connected:
  #         then:
  #           - homeassistant.event:
  #               event: esphome.gpe_area_request_update
  #               data:
  #                 area_id: "${area_id}"
  #                 device_name: "${device_name}"
  #           - logger.log: "Boot sequence complete. Context request sent for ${area_id}."

logger:
  level: INFO

packages:
  board_template: !include common/templates/ts602s_switch.yaml

# -----------------------------------------------------------------------------
# Local Hardware Motion Sensor (GPIO3 Native Overrides)
# -----------------------------------------------------------------------------
binary_sensor:
  - id: !extend motion_sensor
    platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: false
    
    # Tier 1: State streams automatically to HA native API
    # Tier 2: Executes local fallback ONLY when API is disconnected
    on_press:
      then:
        - if:
            condition:
              not:
                api.connected:
            then:
              - logger.log: "Tier 2: Motion Detected (API Offline) -> Activating Local Fallback"
              - script.stop: tier2_light_off_timer
              - script.stop: tier2_fan_off_timer
              - script.execute: execute_tier2_activation

    on_release:
      then:
        - if:
            condition:
              not:
                api.connected:
            then:
              - if:
                  condition:
                    lambda: 'return id(glbl_door_is_open);'
                  then:
                    - logger.log: "Tier 2: Motion Cleared with Door OPEN -> Starting Watchdog Grace Timers"
                    - script.execute: tier2_light_off_timer
                    - script.execute: tier2_fan_off_timer
                  else:
                    - logger.log: "Tier 2: Motion Cleared with Door CLOSED -> Shutting Down Active Loads"
                    - script.stop: tier2_light_off_timer
                    - script.stop: tier2_fan_off_timer
                    - lambda: |-
                        if (esphome::mqtt::global_mqtt_client != nullptr && esphome::mqtt::global_mqtt_client->is_connected()) {
                          auto m = esphome::mqtt::global_mqtt_client;
                          std::string light_topic = id(gpe_root_topic) + "/" + id(gpe_light_target) + "/set";
                          std::string fan_topic = id(gpe_root_topic) + "/" + id(gpe_fan_target) + "/set";
                          
                          m->publish(light_topic, "{\"state\":\"OFF\"}");
                          m->publish(fan_topic, "{\"state\":\"OFF\"}");
                        }

# -----------------------------------------------------------------------------
# Dynamic Learned State Globals (RAM-Only: No Flash Wear)
# -----------------------------------------------------------------------------
globals:
  # MQTT Target Topics
  - id: gpe_root_topic
    type: std::string
    restore_value: no
    initial_value: '"zigbee2mqtt"'
  - id: gpe_light_target
    type: std::string
    restore_value: no
    initial_value: '"${area_name}"'
  - id: gpe_fan_target
    type: std::string
    restore_value: no
    initial_value: '"${area_name} Fan"'
  - id: gpe_door_topic
    type: std::string
    restore_value: no
    initial_value: '"${area_name} Door"'

  # Hardware Capabilities & Runtime Postures
  - id: gpe_scene_eligible
    type: bool
    restore_value: no
    initial_value: "true"
  - id: gpe_use_scene
    type: bool
    restore_value: no
    initial_value: "true"

  # Dynamic Scene Identifiers
  - id: light_on_scene_id
    type: int
    restore_value: no
    initial_value: "15"
  - id: light_off_scene_id
    type: int
    restore_value: no
    initial_value: "0"

  # Fallback Timeouts (Seconds)
  - id: gpe_light_timeout
    type: int
    restore_value: no
    initial_value: "300"
  - id: gpe_fan_timeout
    type: int
    restore_value: no
    initial_value: "900"

# -----------------------------------------------------------------------------
# Networking & Local Zigbee2MQTT Subscription
# -----------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_disconnect:
    then:
      - lambda: 'id(glbl_detach_relay) = false;'
      - logger.log: "TIER 3 ACTIVATED: Wi-Fi Disconnected -> Relays Physically Attached"
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  keepalive: 15s
  on_connect:
    then:
      - lambda: |-
          id(glbl_detach_relay) = true;
          ESP_LOGI("TIER3_RECOVERY", "MQTT Connected -> Re-arming Decoupled Mode (glbl_detach_relay = true)");

          if (esphome::mqtt::global_mqtt_client != nullptr) {
            std::string full_door_topic = id(gpe_root_topic) + "/" + id(gpe_door_topic);
            esphome::mqtt::global_mqtt_client->subscribe(full_door_topic, [](const std::string &topic, const std::string &payload) {
              if (payload.find("\"contact\":true") != std::string::npos || payload.find("\"contact\": true") != std::string::npos) {
                id(glbl_door_is_open) = false;
                ESP_LOGI("TIER2_DOOR", "Door Contact Updated via MQTT -> CLOSED");
              } else if (payload.find("\"contact\":false") != std::string::npos || payload.find("\"contact\": false") != std::string::npos) {
                id(glbl_door_is_open) = true;
                ESP_LOGI("TIER2_DOOR", "Door Contact Updated via MQTT -> OPEN");
              }
            });
            ESP_LOGI("GPE_MQTT", "Subscribed to door topic on connect: %s", full_door_topic.c_str());
          }
  # Tier 2 -> Tier 3 Fail-Safe Fallback
  on_disconnect:
    then:
      - lambda: |-
          id(glbl_detach_relay) = false;
          ESP_LOGW("TIER3_FAILSAFE", "MQTT Disconnected -> Fallback to Physical Relays (glbl_detach_relay = false)");
# -----------------------------------------------------------------------------
# Native API Context Synchronizer (Tier 1 Context)
# Path: /config/esphome/powder_room_switch.yaml
# -----------------------------------------------------------------------------
api:
  id: esphome_api
  
  # Live Connectivity Handlers
  on_client_connected:
    then:
      - lambda: 'id(glbl_api_is_connected) = true;'
      - homeassistant.event:
          event: esphome.gpe_area_request_update
          data:
            area_id: "${area_id}"
            device_name: "${device_name}"
      - logger.log: "Native API Connected -> Requesting Context Update for ${area_id}"

  on_client_disconnected:
    then:
      - lambda: 'id(glbl_api_is_connected) = false;'
      - logger.log: "Native API Disconnected -> Setting glbl_api_is_connected = false"
  actions:
    - action: gpe_area_update
      variables:
        area_id: string
        root_topic: string
        light_target: string
        fan_target: string
        door_topic: string
        
        # Flattened Policy & Timeout Configuration
        scene_eligible: bool
        use_scene: bool
        light_on_scene: int
        light_off_scene: int
        light_sec: int
        fan_sec: int
      then:
        - lambda: |-
            if (area_id == "${area_id}") {
              // 1. Dynamic Topic & Entity Targets
              if (!root_topic.empty()) id(gpe_root_topic) = root_topic;
              if (!light_target.empty()) id(gpe_light_target) = light_target;
              if (!fan_target.empty()) id(gpe_fan_target) = fan_target;

              // 2. Features Object Mapping
              id(gpe_scene_eligible) = scene_eligible;
              id(gpe_use_scene) = use_scene;

              // 3. Scenes Object Mapping
              id(light_on_scene_id) = light_on_scene;
              id(light_off_scene_id) = light_off_scene;

              // 4. Timeouts Object Mapping
              id(gpe_light_timeout) = light_sec;
              id(gpe_fan_timeout) = fan_sec;

              // 5. Dynamic MQTT Door Subscription
              // Prevent duplicate MQTT subscriptions if topic hasn't changed
              if (!door_topic.empty() && door_topic != id(gpe_door_topic)) {
                if (esphome::mqtt::global_mqtt_client != nullptr) {
                  std::string old_topic = id(gpe_root_topic) + "/" + id(gpe_door_topic);
                  esphome::mqtt::global_mqtt_client->unsubscribe(old_topic);
                  
                  id(gpe_door_topic) = door_topic;
                  std::string new_topic = id(gpe_root_topic) + "/" + id(gpe_door_topic);
                  
                  esphome::mqtt::global_mqtt_client->subscribe(new_topic, [](const std::string &topic, const std::string &payload) {
                    if (payload.find("\"contact\":true") != std::string::npos || payload.find("\"contact\": true") != std::string::npos) {
                      id(glbl_door_is_open) = false;
                      ESP_LOGI("TIER2_DOOR", "Door Contact Updated via MQTT -> CLOSED");
                    } else if (payload.find("\"contact\":false") != std::string::npos || payload.find("\"contact\": false") != std::string::npos) {
                      id(glbl_door_is_open) = true;
                      ESP_LOGI("TIER2_DOOR", "Door Contact Updated via MQTT -> OPEN");
                    }
                  });
                  ESP_LOGI("GPE_MQTT", "Updated door subscription to: %s", new_topic.c_str());
                }
              }

              ESP_LOGI("GPE_LEARN", "Context Synced -> Area: %s | Light Target: %s | Light Scene: %d | Fan Timeout: %ds",
                area_id.c_str(), id(gpe_light_target).c_str(), id(light_on_scene_id), id(gpe_fan_timeout));
            }

# -----------------------------------------------------------------------------
# Routing & Direct Execution Scripts
# -----------------------------------------------------------------------------
script:
  # --- TIER 2 ACTIVATION EXECUTION ---
  - id: execute_tier2_activation
    mode: single
    then:
      - lambda: |-
          // Strict Guard: ONLY execute Tier 2 fallback logic if API is truly offline
          if (!id(glbl_api_is_connected)) {
            if (esphome::mqtt::global_mqtt_client != nullptr && esphome::mqtt::global_mqtt_client->is_connected()) {
              auto m = esphome::mqtt::global_mqtt_client;
              
              std::string light_topic = id(gpe_root_topic) + "/" + id(gpe_light_target) + "/set";
              std::string fan_topic = id(gpe_root_topic) + "/" + id(gpe_fan_target) + "/set";
              
              bool recall_scene = id(gpe_scene_eligible) && id(gpe_use_scene);
              std::string light_payload;

              if (recall_scene) {
                light_payload = "{\"scene_recall\": " + std::to_string(id(light_on_scene_id)) + "}";
              } else {
                light_payload = "{\"state\":\"ON\"}";
              }
              
              m->publish(light_topic, light_payload);
              m->publish(fan_topic, "{\"state\":\"ON\"}");
              
              ESP_LOGW("TIER2_EXEC", "Published Fallback -> Light: %s [%s] | Fan: ON", light_topic.c_str(), light_payload.c_str());

              id(tier2_light_off_timer).execute();
              id(tier2_fan_off_timer).execute();
            } else {
              ESP_LOGE("TIER2_EXEC", "Critical: Loss of both Core API and Local MQTT!");
            }
          } else {
            ESP_LOGD("TIER2_EXEC", "API connected -> Tier 2 local execution suppressed.");
          }
# Overrides the base stub from smart_switch.yaml
  - id: !extend execute_tier2_double
    mode: single
    then:
      - lambda: |-
          if (!id(glbl_api_is_connected)) {
            if (esphome::mqtt::global_mqtt_client != nullptr && esphome::mqtt::global_mqtt_client->is_connected()) {
              auto m = esphome::mqtt::global_mqtt_client;
              std::string fan_topic = id(gpe_root_topic) + "/" + id(gpe_fan_target) + "/set";
              
              // Example Tier 2 Double-Click Action: Force Fan ON for max ventilation
              m->publish(fan_topic, "{\"state\":\"ON\"}");
              ESP_LOGW("TIER2_DOUBLE", "Published Tier 2 Double-Click -> Fan Boost: %s", fan_topic.c_str());
            }
          }
  # --- TIER 2 LIGHT WATCHDOG OFF TIMER ---
  - id: tier2_light_off_timer
    mode: restart
    then:
      - delay: !lambda "return id(gpe_light_timeout) * 1000;"
      - lambda: |-
          // Simple, clean boolean checks via globally tracked flags
          bool mqtt_online = (esphome::mqtt::global_mqtt_client != nullptr && esphome::mqtt::global_mqtt_client->is_connected());

          if (!id(glbl_api_is_connected) && mqtt_online) {
            auto m = esphome::mqtt::global_mqtt_client;
            std::string light_topic = id(gpe_root_topic) + "/" + id(gpe_light_target) + "/set";
            std::string light_payload;
            
            if (id(gpe_scene_eligible) && id(gpe_use_scene) && id(light_off_scene_id) > 0) {
              light_payload = "{\"scene_recall\": " + std::to_string(id(light_off_scene_id)) + "}";
            } else {
              light_payload = "{\"state\":\"OFF\"}";
            }
            
            m->publish(light_topic, light_payload);
            ESP_LOGI("TIER2_TIMER", "Light Watchdog Expired -> Deactivated %s", light_topic.c_str());
          } else {
            ESP_LOGI("TIER2_TIMER", "Light Watchdog Expired -> Ignored (API restored or MQTT down)");
          }

  # --- TIER 2 FAN WATCHDOG OFF TIMER ---
  - id: tier2_fan_off_timer
    mode: restart
    then:
      - delay: !lambda "return id(gpe_fan_timeout) * 1000;"
      - lambda: |-
          bool mqtt_online = (esphome::mqtt::global_mqtt_client != nullptr && esphome::mqtt::global_mqtt_client->is_connected());

          if (!id(glbl_api_is_connected) && mqtt_online) {
            auto m = esphome::mqtt::global_mqtt_client;
            std::string fan_topic = id(gpe_root_topic) + "/" + id(gpe_fan_target) + "/set";
            
            m->publish(fan_topic, "{\"state\":\"OFF\"}");
            ESP_LOGI("TIER2_TIMER", "Fan Watchdog Expired -> Deactivated %s", fan_topic.c_str());
          } else {
            ESP_LOGI("TIER2_TIMER", "Fan Watchdog Expired -> Ignored (API restored or MQTT down)");
          }