# Example configuration.yaml
  - name: Sun Last Rising
    unique_id: sun_last_rising
    query: >
      SELECT
        states.state
      FROM
        states
      WHERE
        state_id = (
          SELECT
            states.old_state_id
          FROM
            states
          WHERE
            metadata_id = (
              SELECT
                metadata_id
              FROM
                states_meta
              WHERE
                entity_id = 'sensor.sun_next_rising'
            )
            AND old_state_id IS NOT NULL
          ORDER BY
            last_updated_ts DESC
          LIMIT
            1
        )
    column: "state"
