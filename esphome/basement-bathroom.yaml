substitutions:
  name: basement-bathroom
  friendly_name: Basement Bathroom
  event: nodered_automation
  button: button
  short_name: Speed
  device_type: Fan
  board: esp01_1m

esphome:
  project:
    name: Generic.KS-602s
    version: "0.9"

packages:   # as a list
  - !include common/wifi.yaml
  - !include common/device_base.yaml
  
api:

# wifi:
#   # Optional manual IP
#   manual_ip:
#     static_ip: 10.0.168.136
#     gateway: 10.0.168.1
#     subnet: 255.255.255.0

web_server:
  port: 80

ota:
  - platform: web_server

switch:
  - id: switch_1
    name: Local Switch
    platform: template
    internal: true
    lambda: return id(hw_relay).state;
    turn_on_action:
      - fan.turn_on: fan_1
    turn_off_action:
      - fan.turn_off: fan_1
    on_turn_on:
      - fan.turn_on: fan_1
    on_turn_off:
      - fan.turn_off: fan_1

sensor:
  - id: ha_humidity
    platform: homeassistant
    entity_id: sensor.basement_bathroom_humidity

  - id: humidity_1
    platform: template
    lambda: return id(ha_humidity).state;
    name: Humidity
    device_class: humidity
    unit_of_measurement: "%"
    state_class: "measurement"

  - id: ha_temperature
    platform: homeassistant
    entity_id: sensor.basement_bathroom_temperature

  - id: temperature_1
    platform: template
    lambda: return id(ha_temperature).state;
    name: Temperature
    device_class: temperature
    unit_of_measurement: "°C"
    state_class: "measurement"


binary_sensor:
#  - id: ha_door
  # - id: switch_2
  #   platform: homeassistant
  #   entity_id: binary_sensor.powder_room_door

  # - id: ha_motion
  #   platform: homeassistant
  #   entity_id: binary_sensor.powder_room_motion

  - id: button_1_local
    platform: template
    internal: true
    lambda: return id(button_1).state;

text:
  - id: timer_entity_id
    platform: template
    name: ${device_type} Timer"
#    initial_value: id(glbl_timer_entity_id)
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text
    restore_value: true
    on_value:
      then:
        - globals.set:
            id: glbl_timer_entity_id
            value: !lambda 'return x;' # x represents the value of the text_template

output:
  - id: gpio_13
    platform: gpio
    pin:
      number: 13
      inverted: true

light:
  - id: relay_status_leds
    name: ${friendly_name} Indicator Lights
    platform: status_led
    output: gpio_13
    # Classify this as a "config" entity rather than a primary entity
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

  # See: https://esphome.io/components/light/binary.html
fan:
  - id: fan_1
    name: Fan
    platform: binary
    output: relay_1
    #lambda: return id(glbl_relay_state);
    # Resume last state on boot if possible. Else, off
    restore_mode: RESTORE_DEFAULT_OFF

    # Wire in the count down timer automation if enabled
    on_turn_on:
      then:
        # - output.turn_on: relay_1
        - globals.set:
            id: glbl_relay_state
            value: "true"
        - if:
            condition:
              # If the countdown timer is enabled
              lambda: 'return id(glbl_timeout_enabled);'
            then:                          
              # The light is already on, start counting the seconds.
              # When timer ends, light will be turned off
              - script.execute: start_timer
              - logger.log:
                  level: DEBUG
                  format: "Timer Just Started sue to fan_1 being turned on"

            else:
              - logger.log:
                  level: DEBUG
                  format: "Fan1 turned on, countdown timer not enabled"

    # This can be called by the natural end of the timer OR manually through any other source.
    # Regardless of the source, we just need to stop the ticking if it's running.
    on_turn_off:
      then:
        # - output.turn_off: relay_1
        - globals.set:
            id: glbl_relay_state
            value: "false"
        - if:
            condition:
              lambda: 'return id(_timer_tick).is_running();'
            then:
              - script.execute: on_timer_stop

            else:
              - logger.log:
                  level: DEBUG
                  format: "Fan1 turned off, countdown timer not enabled"