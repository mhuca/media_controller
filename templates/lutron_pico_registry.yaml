        #   {% set time_diff = now_ts - s.ts %}
          
        #   {% set ns = namespace(status=s.status, count=s.count, verdict='none', context=s.context, ts=s.ts) %}

        #   {% if act == 'press' %}
        #     {# If we are already pending and a NEW press context arrives quickly #}
        #     {% if s.status == 'pending' and time_diff < 0.5 %}
        #       {% set ns.status = 'complete' %}
        #       {% set ns.count = 2 %}
        #       {% set ns.verdict = 'double' %}
        #     {% else %}
        #       {# Initial Press #}
        #       {% set ns.status = 'pending' %}
        #       {% set ns.count = 1 %}
        #       {% set ns.verdict = 'none' %}
        #       {% set ns.context = event_context %}
        #       {% set ns.ts = now_ts %}
        #     {% endif %}
          
        #   {% elif act == 'release' %}
        #     {# A release of the SAME press that started the window = Single #}
        #     {% if s.status == 'pending' and s.verdict == 'none' and time_diff < 0.5 %}
        #       {# We don't mark 'complete' yet in case a double is coming, #}
        #       {# but we can set the verdict. #}
