- id: '1769615841394'
  alias: Kitchen Lighting Dispatcher
  description: Hallway and Kitchen Presence - State
  triggers:
  - entity_id:
    - binary_sensor.hallway_presence
    trigger: state
    id: Vacant
    to:
    - 'off'
  - entity_id:
    - binary_sensor.hallway_presence
    trigger: state
    to:
    - 'on'
    id: Occupied
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.kitchen_light_timer
    id: Timer
  - trigger: state
    entity_id:
    - binary_sensor.hallway_presence
    id: hallway
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_prep_zone_presence
    id: prep_zone
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_island_presence
    id: island
  conditions: []
  actions:
  - variables:
      raw_lux: '{{ states(''sensor.kitchen_fp2_light_sensor_light_level'') | float(0)
        }}'
      master_cct: '{{ states(''sensor.cct_calculation'') | float(3400) }}'
      is_dark_enough: '{{ states(''binary_sensor.kitchen_light_required'') == ''on''
        }}'
      current_brightness: '{{ (state_attr(''light.kitchen_main'', ''brightness'')
        | float(0) ) }}

        '
      lux_offset: '{{ (current_brightness * 0.4) | round(0) }}'
      effective_lux: "{% set result = raw_lux - lux_offset %} \n{{ result if result
        > 0 else 0 }}\n"
      base_brightness: "{% if is_dark_enough %}\n  {% set lux_ratio = (effective_lux
        / 100) %}\n  {% set lux_ratio = 1 if lux_ratio > 1 else lux_ratio %}\n  {%
        set brightness = (255 * 75 / 100) * (1 - lux_ratio ** 0.8) %}\n  {% set final
        = brightness | round(0) | int %}\n  {{ final if final > 25 else 25 }}\n{%
        else %}\n  0\n{% endif %}\n"
      pots: "{% if not is_dark_enough %}\n  0\n{% elif master_cct > 2700 %}\n  {{
        base_brightness | int }}\n{% elif master_cct <= 2202 %}\n  0\n{% else %}\n
        \ {% set range_total = 2700 - 2202 %}\n  {% set current_pos = master_cct -
        2202 %}\n  {% set fade_factor = (current_pos / range_total) ** 2 %}\n  {{
        (base_brightness * fade_factor) | round(0) | int }}\n{% endif %}\n"
  - if:
    - condition: state
      entity_id: binary_sensor.night_lights_sensor
      state: 'on'
    then:
    - choose:
      - conditions:
        - condition: trigger
          id:
          - Vacant
        sequence:
        - if:
          - condition: state
            entity_id: input_boolean.visitor_mode
            state: 'off'
          then:
          - action: timer.start
            metadata: {}
            data: {}
            target:
              entity_id:
              - timer.kitchen_light_timer
      - conditions:
        - condition: trigger
          id:
          - Occupied
        sequence:
        - action: timer.cancel
          metadata: {}
          data: {}
          target:
            entity_id:
            - timer.kitchen_light_timer
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: 90
            command_input: turn_on
            target_label: night_light
            area_key: kitchen
            data_payload: '{{ trigger }}'
            overrides: {}
      - conditions:
        - condition: trigger
          id:
          - Timer
        sequence:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: ''
            command_input: turn_off
            target_label: ''
            area_key: kitchen
            data_payload: '{{ trigger }}'
            overrides: {}
    else:
    - choose:
      - conditions:
        - condition: trigger
          id:
          - hallway
        sequence:
        - if:
          - condition: template
            value_template: "{% set current = state_attr('light.kitchen_main', 'brightness')
              | float(0) %} \n{{ (pots - current) | abs > 15 or pots == 0 }}\n"
          - condition: template
            value_template: '{{ states(''binary_sensor.hallway_presence'') == ''on''
              and pots > 0 }}'
          then:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_main
            data:
              brightness: '{{ pots }}'
              transition: 5
          else:
          - delay: 00:02:00
          - action: light.turn_off
            target:
              entity_id: light.kitchen_main
            data: {}
      - conditions:
        - condition: trigger
          id:
          - island
        sequence:
        - if:
          - condition: template
            value_template: '{{ states(''binary_sensor.kitchen_island_presence'')
              == ''on'' and base_brightness > 0 }}'
          - condition: template
            value_template: '{% set current = state_attr(''light.kitchen_island'',
              ''brightness'') | float(0) %}

              {{ (base_brightness - current) | abs > 15 or base_brightness == 0 }}

              '
          then:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_island
            data:
              brightness: '{{ base_brightness }}'
              transition: 3
          else:
          - delay: 00:00:20
          - action: light.turn_off
            target:
              entity_id: light.kitchen_island
      - conditions:
        - condition: trigger
          id:
          - prep_zone
        sequence:
        - if:
          - condition: template
            value_template: '{{ states(''binary_sensor.kitchen_prep_zone_presence'')
              == ''on'' and base_brightness > 0 }}'
          - condition: template
            value_template: "{% set current = state_attr('light.kitchen_counter',
              'brightness') | float(0) %} \n{{ (base_brightness - current) | abs >
              5 or base_brightness == 0 }}\n"
          then:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_counter
            data:
              brightness: '{{ base_brightness }}'
              transition: 3
          else:
          - delay: 00:00:20
          - action: light.turn_off
            target:
              entity_id: light.kitchen_counter
  mode: queued
  max: 10
- id: '1769837598005'
  alias: Dispatcher - Hallway  Kitchen Lights
  description: Native Binary sensor Hallway Presence changes State
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_presence_master
    id: Vacant
    to:
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.kitchen_presence_master
    to:
    - 'on'
    id: Occupied
  - trigger: state
    entity_id: binary_sensor.kitchen_light_required
    to: 'on'
    id: GotDark
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - Occupied
        - condition: trigger
          id: GotDark
      - condition: state
        entity_id: binary_sensor.kitchen_presence_master
        state: 'on'
      - condition: state
        entity_id: binary_sensor.kitchen_light_required
        state: 'on'
      - condition: state
        entity_id: input_boolean.kitchen_light_override
        state: 'off'
        enabled: false
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.night_lights_sensor
          state: 'on'
        then:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: 90
            command_input: turn_on
            target_label: night_light
            area_key: kitchen
            data_payload: '{{ trigger }}'
            overrides: {}
        else:
        - alias: Emit Generic Universal Controller Command Event
          event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            action_value: 151
            command_input: turn_on
            target_label: main
            area_key: kitchen
            data_payload: '{{ trigger }}'
            overrides: {}
          enabled: true
    - conditions:
      - condition: trigger
        id:
        - Vacant
      sequence:
      - alias: Emit Generic Universal Controller Command Event
        event: universal_controller_command
        event_data:
          source_device: presence
          action_type: light_call
          action_value: ''
          command_input: turn_off
          target_label: ''
          area_key: kitchen
          data_payload: '{{ trigger }}'
          overrides: {}
      - delay: 00:30:00
        enabled: false
      - if:
        - condition: state
          entity_id: binary_sensor.kitchen_presence_master
          state: 'off'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.kitchen_light_override
        enabled: false
  mode: queued
- id: '1769870132062'
  alias: Powder Room Presence Logic (Dim Warning)
  description: ''
  triggers:
  - entity_id: binary_sensor.powder_room_fan_motion
    to: 'on'
    trigger: state
    id: Motion_On
  - entity_id:
    - binary_sensor.powder_room_door
    trigger: state
    to:
    - 'on'
    id: Door_Open
  - entity_id:
    - binary_sensor.powder_room_door
    trigger: state
    to:
    - 'off'
    id: Door_Closed
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Motion_On
        - Door_Open
      sequence:
      - data:
          brightness_pct: 100
        action: light.turn_on
        target:
          entity_id: light.powder_room_lights
      - alias: IsDoorOpen
        if:
        - condition: state
          entity_id: binary_sensor.powder_room_door
          state:
          - 'on'
        then:
        - delay:
            hours: 0
            minutes: 2
            seconds: 0
            milliseconds: 0
        - target:
            entity_id: light.powder_room_lights
          action: light.turn_off
          data: {}
        else:
        - stop: Sequence complete - Door Closed
    - conditions:
      - condition: trigger
        id:
        - Door_Closed
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - alias: Wait for Motion
        wait_template: '{{ is_state(''binary_sensor.powder_room_fan_motion'', ''on'')
          }}'
        timeout: 00:00:20
        continue_on_timeout: true
      - condition: template
        value_template: '{{ wait.remaining == 0 }}'
      - target:
          entity_id: light.powder_room_lights
        data:
          brightness_pct: 10
        action: light.turn_on
      - alias: Wait for Motion
        wait_template: '{{ is_state(''binary_sensor.powder_room_fan_motion'', ''on'')
          }}'
        timeout: 00:00:10
        continue_on_timeout: true
      - condition: template
        value_template: '{{ not wait.completed }}'
      - target:
          entity_id: light.powder_room_lights
        action: light.turn_off
        data: {}
  mode: restart
