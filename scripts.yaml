pico_advanced_click_hold_handler:
  fields:
    pico_serial:
      description: The serial number of the Pico remote (e.g., 69226113).
      example: '69226113'
      required: true
      selector:
        text:
    pico_button_type:
      description: The type of button pressed (e.g., raise, main, lower, off).
      example: raise
      required: true
      selector:
        text:
    target_entity:
      description: The entity ID to be controlled by the single click (e.g., light.living_room).
      example: light.living_room
      required: true
      selector:
        target:
    single_click_service:
      description: The service to call on a single click (e.g., light.toggle, script.turn_on).
      example: light.toggle
      required: true
      selector:
        text:
    double_click_service:
      description: The service to call on a double click (e.g., light.turn_on, scene.turn_on).
      example: light.turn_on
      required: true
      selector:
        text:
    hold_script_id:
      description: The script to call on a hold (e.g., script.start_dim_up).
      example: script.start_dim_up
      required: true
      selector:
        target:
      name: Hold Script
  sequence:
  - variables:
      CLICK_TIMEOUT: '0.4'
  - wait_for_trigger:
    - event_type: lutron_caseta_button_event
      id: release_one
      event_data:
        serial: '{{ pico_serial }}'
        button_type: '{{ pico_button_type }}'
        action: release
      trigger: event
    timeout: '{{ CLICK_TIMEOUT }}'
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.trigger == none }}'
    then:
    - target:
        entity_id: '{{ hold_script_id }}'
      action: script.turn_on
    - wait_for_trigger:
      - event_type: lutron_caseta_button_event
        event_data:
          serial: '{{ pico_serial }}'
          button_type: '{{ pico_button_type }}'
          action: release
        trigger: event
      continue_on_timeout: true
    - stop: Hold and Release Handled
  - wait_for_trigger:
    - event_type: lutron_caseta_button_event
      id: press_two
      event_data:
        serial: '{{ pico_serial }}'
        button_type: '{{ pico_button_type }}'
        action: press
      trigger: event
    timeout: '{{ CLICK_TIMEOUT }}'
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.trigger == none }}'
    then:
    - target:
        entity_id: '{{ target_entity }}'
      action: '{{ single_click_service }}'
    - stop: Single Click Handled
  - data:
      brightness_pct: 100
    target:
      entity_id: '{{ target_entity }}'
    action: '{{ double_click_service }}'
  - stop: Double Click Handled
  alias: Pico Advanced Click/Hold Handler
  description: ''
  mode: single
