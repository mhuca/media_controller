      target_label: '{{ trigger.event.data.target_label | default('''', true) }}'
      raw_target: "{% if target_override == '' %} \n  {{ {'area_id': area_key} }}
        \n{% else %}\n  {{ target_override }} \n{% endif %}\n"
      area_entities_list: "{% set ns = namespace(found=[]) %}\n{% if raw_target.area_id
        is defined %}\n  {% set ns.found = area_entities(raw_target.area_id) %}\n{%
        elif raw_target.entity_id is defined %}\n  {% set ent = raw_target.entity_id
        %}\n  {% set ns.found = [ent] if ent is string else ent %}\n{% endif %}\n{%
        set expanded = ns.found \n    | map('expand') \n    | sum(start=[]) \n    |
        selectattr('domain', 'eq', 'light') \n    | map(attribute='entity_id') \n
        \   | list \n%}\n{{ expanded }}\n"
      label_entities_list: '{{ label_entities(target_label) | list | unique | list
        }}

        '
  - alias: Target Expansion (The "Engine")
    variables:
      target_entities: "{% if target_label != '' %}\n  {{ area_entities_list | select('in',
        label_entities(target_label)) | list | unique | list }}\n{% else %}\n  {{
        area_entities_list | unique | list }}\n{% endif %}\n"
      apply_cct: '{{ action_val == '''' }}'
      current_kelvin: '{{ states(''sensor.cct_calculation'') | int(4000) }}'
  - alias: Hardware Bucketing
    variables:
      native_cct_lights: "{{ states.light \n  | selectattr('entity_id', 'in', target_entities)
        \n  | selectattr('attributes.supported_color_modes', 'defined')\n  | selectattr('attributes.supported_color_modes',
        'search', 'color_temp') \n  | map(attribute='entity_id') \n  | list \n}}\n"
      dimmer_lights: '{{ target_entities | select(''in'', label_entities(''CurrentCTDimmer''))
        | list }}'
      standard_lights: '{% set specialized = native_cct_lights + dimmer_lights %}

        {{ target_entities | reject(''in'', specialized) | list }}

        '
  - alias: Data Constants
    variables:
      dim_factor: 7
      command_map:
        max:
          brightness_pct: 100
        raise:
          brightness_step_pct: 15
        lower:
          brightness_step_pct: -15
        min:
          brightness_pct: 10
        release:
          brightness_step_pct: 0
      payload:
        transition: 0.4
  - parallel:
    - alias: CCT Lights Turn On
      if:
      - condition: template
        value_template: '{{ native_cct_lights | length > 0 }}'
      then:
      - variables:
          serv_data: "{% set payload = payload | combine({'color_temp_kelvin': target_kelvin})
            %}\n{% set cmd = command_map[action_val] | default({}) %}\n{% if is_number(action_val)
            %}\n  {% set cmd = {'brightness': action_val | int(127) } %}\n{% endif
            %}\n{{ payload | combine(cmd) }}\n"
      - action: light.turn_on
        target:
          entity_id: '{{ native_cct_lights }}'
        data: '{{ serv_data }} '
    - alias: Dimmer Lights Turn On
      if:
      - condition: template
        value_template: '{{ dimmer_lights | length > 0 }}'
      then:
      - variables:
          payload:
            transition: 0
          serv_data: "{{ payload \n    | combine({'brightness': states('sensor.cct_to_brightness')
            \n    | int(150)})\n}}\n"
      - action: light.turn_on
        target:
          entity_id: '{{ dimmer_lights }}'
        data: '{{ serv_data }}'
    - alias: Standard Lights Turn On
      if:
      - condition: template
        value_template: '{{ standard_lights | length > 0 }}'
      then:
      - variables:
          serv_data: "{% set cmd = command_map[action_val] | default({}) %}\n{% if
            is_number(action_val) %}\n  {% set cmd = {'brightness': action_val | int(127)
            } %}\n{% endif %}   \n{{ payload | combine(cmd) }}\n"
      - action: light.turn_on
        target:
          entity_id: '{{ standard_lights }}'
        data: '{{ serv_data }}'
