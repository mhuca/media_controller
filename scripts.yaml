        cycle_options: '{{ cycle_options_id | default(none) }}'
  - alias: 2. Calculate JSON and Store Temporarily (TRIGGER)
    target:
      entity_id: input_text.temp_json_output
    data:
      value: '{% set new_area_dict = {area_key: new_area_data} %} {% set updated_map
        = current_ci_map | combine(new_area_dict) %} {{ updated_map | tojson }}

        '
    action: input_text.set_value
  mode: single
