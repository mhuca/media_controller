  actions:
  - wait_for_trigger:
    - event_type: zha_event
      event_data:
        device_id: '{{ device_id }}'
        command: toggle
      id: release_event
      trigger: event
    timeout:
      milliseconds: 450
    continue_on_timeout: true
    alias: Wait for second Toggle Event
  - alias: If Toggle Then Press or Double
    if:
    - condition: template
      value_template: '{{ wait.completed }}'
      alias: Hold - Toggle Event NOT Seen
    then:
    - wait_for_trigger:
      - event_type: zha_event
        event_data:
          device_id: '{{ device_id }}'
          command: toggle
        id: release_event
        trigger: event
      timeout:
        milliseconds: 250
      continue_on_timeout: true
      alias: Wait for Third Toggle Event
    - alias: If Third Toggle Then Double else Press
      if:
      - condition: template
        value_template: '{{ wait.completed }}'
        alias: Double if Timedout
      then:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
