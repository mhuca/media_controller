night_lights_sensor_on:
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.night_lights_sensor
      state: 'on'
    - condition: state
      entity_id: input_boolean.visitor_mode
      state: 'off'
    then:
    - action: light.turn_off
      data:
        transition: 60
      target:
        area_id:
        - hallway
    - action: light.turn_off
      data:
        transition: 60
      target:
        area_id:
        - dining_room
    - action: light.turn_off
      data:
        transition: 60
      target:
        entity_id:
        - light.living_room_main_bulb_1
        - light.living_room_main_bulb_2
    - if:
      - condition: state
        entity_id: binary_sensor.hallway_presence
        state: 'off'
      then:
      - action: light.turn_off
        metadata: {}
        data:
          transition: 60
        target:
          area_id: kitchen
    - if:
      - condition: state
        entity_id: binary_sensor.mark_office_presence_sensor
        state: 'on'
      then:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 75
        target:
          area_id: mark_office
      else:
      - action: light.turn_off
        metadata: {}
        data:
          transition: 10
        target:
          area_id: mark_office
    - action: input_boolean.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - input_boolean.mark_office_wall_override
        - input_boolean.garage_light_override
        - input_boolean.mud_room_light_override
    - action: timer.start
      metadata: {}
      data: {}
      target:
        entity_id: timer.door_open_timer
  alias: Night Lights Sensor On
  description: State of night_lights_sensor is On
outside_person_night_light_on:
