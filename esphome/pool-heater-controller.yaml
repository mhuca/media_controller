substitutions:
  name: pool-heater-controller
  friendly_name: Pool Heater Controller
  board: esp01_1m

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  project: 
    name: Sonoff.4Ch R3 Pro
    version: "1.0"
  
esp8266:
  board: ${board}
  restore_from_flash: true

preferences:
  flash_write_interval: 30s

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sonoff-4Ch-Pro Fallback Hotspot"

#captive_portal:

# Example of interlocking logic with RF remote.
switch:
  - id: relay_1
    platform: gpio
    pin: GPIO12
    name: "Relay 1"
    restore_mode: ALWAYS_OFF

  - id: relay_2
    platform: gpio
    pin: GPIO5
    name: "Relay 2"
    restore_mode: RESTORE_DEFAULT_OFF

  - id: relay_3
    platform: gpio
    pin: GPIO4
    name: "Relay 3"
    restore_mode: RESTORE_DEFAULT_OFF


binary_sensor:
  - id: button_1
    platform: gpio
    pin: 
      number: 0 # Example for button 1
      inverted: true
    name: "Button 1"
    on_press:
      - switch.toggle: relay_1
  - id: button_2
    platform: gpio
    pin: 
      number: 9 # Example for button 2
      inverted: true
    name: "Button 2"
    on_press:
      - switch.toggle: relay_2
  - id: button_3
    platform: gpio
    pin: 
      number: 10 # Example for button 3
      inverted: true
    name: "Button 3"
    on_press:
      - switch.toggle: relay_3
  - id: button_4
    platform: gpio
    pin: 
      number: 14 # Example for button 4
      inverted: true
      mode: 
        pullup: true
        input: true
    name: "Button 4"
    on_click: 
      then:
        # - homeassistant.action: 
        #     action: light.toggle
        #     data:
        #       entity_id: light.pool_shed


one_wire:
  - platform: gpio
    pin: GPIO2

sensor:
  - platform: dallas_temp
    name: temperature
    update_interval: 120s
    # Optional variables:
    unit_of_measurement: "°C"
    icon: "mdi:temperature-celsius"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1

output:
  # See" https://esphome.io/components/output/ledc.html
  # - id: relay_2
  #   platform: gpio
  #   pin:
  #     number: 5

light:
