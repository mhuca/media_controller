  - alias: If TV is Off Turn On TV
    if:
    - condition: state
      entity_id: media_player.samsung_the_frame_65_2
      state: 'off'
    then:
    - target:
        entity_id: media_player.samsung_the_frame_65_2
      action: media_player.turn_on
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 500
    enabled: true
  - alias: If Art Mode Off Turn On Art
    if:
    - condition: state
      entity_id: binary_sensor.art_mode_frame_tv
      state:
      - 'off'
    then:
    - action: remote.send_command
      metadata: {}
      data:
        command:
        - KEY_POWER
        - KEY_POWER
        delay_secs: 0.1
      target:
        entity_id: remote.samsung_the_frame_65
    - delay:
        hours: 0
        minutes: 0
        seconds: 3
        milliseconds: 0
    enabled: true
  - if:
    - condition: state
      state:
      - 'on'
      entity_id: binary_sensor.art_mode_frame_tv
    then:
    - stop: System already in Art Mode and powered on; audio initiated.
    else:
