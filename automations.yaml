      data:
        command: '{{ command_to_send }}'
    - delay:
        hours: 0
        minutes: 0
        seconds: 0
        milliseconds: 50
  - alias: 3. Cleanup/Finalization
    data:
      name: Activity Engine
      message: 'Activity ''{{ activity_key }}'' executed. Action Code (Binary Difference):
        {{ action_code }}. Required State: {{ required_state_mask }}. Current State:
        {{ current_state_mask }}'
    action: logbook.log
  - alias: 4.0 Post-Action Art Mode Correction (Simplified Frame TV Fix)
    if:
    - condition: template
      value_template: '{{ (required_state_mask | bitwise_and(1024)) > 0 }}'
    - condition: template
      value_template: '{{ (required_state_mask | bitwise_and(512)) > 0 }}'
    then:
    - alias: Wait for TV Boot Sequence to Pass Default Art Mode
      delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
      enabled: false
    - alias: Force Art Mode OFF (Disable)
      data:
        action: disable
      action: script.art_mode_toggle_controller
      enabled: false
    enabled: false
  mode: single
