substitutions:
  target_id: light_1
  device_type: Light

# This file includes the generic timer base and specializes it for a Light component.
packages:
  - !include switch_base.yaml
  - !include generic_602_timer_base.yaml

# -----------------------------------------------------------------------------
# 1. Component Definition (Light)
# -----------------------------------------------------------------------------
light:
  - id: ${target_id}
    name: ${device_type}
    platform: binary
    output: relay_1 # Defined in generic_602_timer_base.yaml
    restore_mode: RESTORE_DEFAULT_OFF
    
    # Timer start logic
    on_turn_on:
      then:
        - if:
            condition:
              # Only start the timer if the HA toggle 'glbl_timeout_enabled' is TRUE.
              lambda: 'return id(glbl_timeout_enabled);'
            then:
              - script.execute: start_timer
            else:
              - logger.log:
                  level: DEBUG
                  format: "Light turned on, timer disabled."
    
    # Timer stop logic
    on_turn_off:
      then:
        - if:
            condition:
              # If the light is manually turned off while the countdown is active, stop the script.
              lambda: 'return id(_glbl_current_tick_count) > 0;'
            then:
              - light.turn_off: ${target_id} 
              - script.execute: on_timer_stop
            else:
              - logger.log:
                  level: DEBUG
                  format: "Light turned off. Timer was not active."


