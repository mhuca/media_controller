            target: {}
            data:
              action: disable
          '1024':
            action_type: power_on
            service: media_player.turn_on
            target: media_player.samsung_the_frame_65_2
          '2048':
            action_type: power_on
            service: media_player.turn_on
            target: media_player.living_room_atv
          '4096':
