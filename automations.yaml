        state:
        - 'off'
      then:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.guest_bedroom_main
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 50
    - variables:
        brightness_step: "{% if state_attr('light.guest_bedroom_main','brightness')
          | int > 175 %}\n  -15\n{% else %}\n  15\n{% endif %}\n"
        is_hold: '{{ true }}'
    - repeat:
        until:
        - condition: template
          value_template: '{{ repeat.index  > 10 or not is_hold }}'
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_step: '{{ brightness_step | int(15) }}'
          target:
            entity_id: light.guest_bedroom_main
        - wait_for_trigger:
          - event_type: zha_event
            event_data:
              device_id: '{{ device_id }}'
              command: toggle
            id: release_event
            trigger: event
          timeout:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 450
          continue_on_timeout: true
        - variables:
            is_hold: '{{ wait.completed }}'
