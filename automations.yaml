        'light_call') }}\n"
  - alias: Wait for first Release Event... If None After 450ms then it's Hold
    wait_for_trigger:
    - event_type: lutron_caseta_button_event
      event_data:
        serial: '{{ serial | default(0) }}'
        button_number: '{{ button_number | default(0) }}'
        action: release
      id: release_event
      trigger: event
    timeout:
      milliseconds: 350
    continue_on_timeout: true
  - variables:
      is_hold: '{{ wait.trigger is none }}'
      release_wait: '{{ wait }}'
      data_override: "{% set all_overrides = label_entities('override') \n  | select('match',
        'sensor.')\n  | list\n%}\n{% set overrides = \n  device_entities(device_id)
        \n  | select('match','sensor.')\n  | select('in', all_overrides )\n  | list\n%}\n{%
        if overrides | length > 0 %}\n  {{ states(overrides[0]) | default('') }}\n{%
        endif%}\n"
      command_input: '{{ ''turn_off'' if button_type == ''off'' else ''turn_on'' }}'
      temp_all: "{{\n  label_entities(target_device_name) \n    | select('match',
        'light.')\n    | list \n}}\n"
      temp_area_lights: "{{\n  area_entities(area_key) \n  | select('match','light.')\n
        \ | list\n}}\n"
      target_lights: "{% set all_lights = label_entities(target_device_name) \n  |
        select('match', 'light.')\n  | list\n%}    \n{{\n  area_entities(area_key)
        \n  | select('match','light.')\n  | select('in', all_lights )\n  | list\n}}\n"
      target: "{% set target = {} %}\n{% if device_name != 'Remote' %} \n  {% set
        target = target \n    | combine({'target':{'entity_id': target_lights }})
        \n  %}\n{% endif %}\n{% if data_override | length > 0 %}\n  {% set target
        = target \n    | combine(data_override) \n  %}\n{% endif %}\n{{ target }}
        \n"
      hold_duration: '{{ 500 - (wait.remaining | default(0) * 1000) }}'
  - if:
    - condition: template
      value_template: '{{ not is_hold }}'
    then:
    - wait_for_trigger:
      - event_type: lutron_caseta_button_event
        event_data:
          serial: '{{ serial | default(0) }}'
          button_number: '{{ button_number | default(0) }}'
          action: press
        id: press_event
        trigger: event
      timeout:
        milliseconds: 250
      continue_on_timeout: true
      alias: Wait For Second Press
    - variables:
        is_double: '{{ wait.trigger is not none }}'
    - if:
      - condition: template
        value_template: '{{ is_double }}'
      then:
      - variables:
          command: double
          action_value: "{% set command_map = {\n    'on': 'max',\n    'raise': '',\n
            \   'stop': '',\n    'lower': '',\n    'off': 'min',\n    'media_on':
            '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
            \   'media_stop': 'play.toggle',\n    'media_off': ''\n} %}\n{{ command_map.get(device_prefix
            ~ button_type, '') }}\n"
          command_input: turn_on
      else:
      - variables:
          command: press
          action_value: "{% set command_map = {\n    'on': '',\n    'raise': 'raise',\n
            \   'stop': '',\n    'lower': 'lower',\n    'off': '',\n    'media_on':
            'play.toggle',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
            \   'media_stop': 'volume.mute',\n    'media_off': 'media.next'\n} %}\n{{
            command_map.get(device_prefix ~ button_type, '') }}\n"
    - variables:
        command_type: "{{ button_type  \n  | lower \n  | replace(' ', '') \n  | replace('_',
          '') }}_{{ command }}\n"
    - variables:
        the_action_type: '{{ cmd_map.get(command, {}).get(button_number | string,
          {}).get(''type'', default_action_type) }}'
        the_action_value: '{{ cmd_map.get(command, {}).get(button_number | string,
          {}).get(''value'', action_value ) }}'
    - variables:
        override_command: "{% if subscription is not none %}\n  {{ subscription.command_map[command]
          is not none }}\n{% else %}\n  {{ false }}\n{% endif %}\n"
        valid_commands: '{{ subscription.command_map[command] if override_command
          else none }}'
        override_button: "{% if valid_commands is not none %}\n  {{ valid_commands[
          button_number | string ] is not none }}\n{% else %}\n  {{ false }}\n{% endif
          %}\n"
        he_action_type: "{{ \n  subscription.command_map[command][ button_number |
          string ]['type']\n  if override_button else default_action_type\n}}\n"
        he_action_value: "{{ \n  subscription.command_map[command][ button_number
          | string ]['value']\n  if override_button else action_value\n}}\n"
        the_action_type: '{{ cmd_map.get(command, {}).get(button_number | string,
          {}).get(''type'', default_action_type) }}

          '
        the_action_value: '{{ (subscription or {}).get(''command_map'', {}).get(command,
          {}).get(button_number | string, {}).get(''value'', '''') }}'
      enabled: false
    - alias: Press Event
      event: universal_controller_command
      event_data:
        source_device: pico
        action_type: '{{ the_action_type }}'
        action_value: '{{ the_action_value }}'
        command_input: '{{ command_input }}'
        area_key: '{{ area_id(device_id) | default(none) }}'
        session_id: '{{ session_id }}'
        data_payload: '{{ trigger.event.data }}'
        overrides: '{}'
        command: '{{ command }}'
        command_type: '{{ command_type }}'
      enabled: true
    else:
    - variables:
        command: hold
        action_value: "{% set command_map = {\n    'on': 'raise',\n    'raise': 'raise',\n
          \   'stop': '',\n    'lower': 'lower',\n    'off': 'lower',\n    'media_on':
          '',\n    'media_raise': 'volume.up',\n    'media_lower': 'volume.down',\n
          \   'media_stop': '',\n    'media_off': ''\n} %}\n{{ command_map.get(device_prefix
          ~ button_type, '') }}\n"
        command_input: turn_on
    - variables:
        command_type: "{{ trigger.event.data.button_type  \n  | lower \n  | replace('
          ', '') \n  | replace('_', '') }}_{{ command }}\n"
        repeat_delay: '{{ 125 if action_type == ''media_call'' else 500 }}'
        max_hold_time: 9
        max_iterations: '{{ (max_hold_time / (repeat_delay / 1000)) | round(0) }}'
        the_action_type: '{{ cmd_map.get(command, {}).get(button_number | string,
          {}).get(''type'', default_action_type) }}

          '
        the_action_value: '{{ cmd_map.get(command, {}).get(button_number | string,
          {}).get(''value'', action_value ) }}

          '
    - repeat:
        until:
        - condition: template
          value_template: '{{ wait.trigger is not none or repeat.index > max_iterations
            }}'
        sequence:
        - alias: Hold Event
          event: universal_controller_command
          event_data:
            source_device: pico
            action_type: '{{ the_action_type }}'
            action_value: '{{ the_action_value }}'
            command_input: '{{ command_input }}'
            area_key: '{{ area_id(device_id) | default(none) }}'
            session_id: '{{ session_id }}'
            data_payload: '{{ trigger.event.data }}'
            overrides: '{}'
            command: '{{ command }}'
            command_type: '{{ command_type }}'
          enabled: true
        - wait_for_trigger:
          - event_type: lutron_caseta_button_event
            event_data:
              serial: '{{ serial | default(0) }}'
              button_number: '{{ button_number | default(0) }}'
              action: release
            trigger: event
          timeout:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: '{{ repeat_delay | int }}'
          continue_on_timeout: true
        - variables:
            is_hold: '{{ wait.trigger is none }}'
      enabled: true
    - variables:
        command: release
    - alias: Release Event
      event: universal_controller_command
      event_data:
        source_device: pico
        action_type: '{{ the_action_type }}'
        action_value: release
        command_input: '{{ command_input }}'
        area_key: '{{ area_id(device_id) | default(none) }}'
        session_id: '{{ session_id }}'
        data_payload: '{{ trigger.event.data }}'
        overrides: '{}'
        command: '{{ command }}'
        command_type: '{{ command_type }}'
      enabled: true
  mode: single
  variables:
    session_id: '{{ trigger.event.context.id }}'
- id: '1769201639338'
  alias: Command - Master Occupancy & Night-Light Engine
  description: High-performance, zero-maintenance global lighting logic.
  triggers:
  - value_template: '{{ label_entities(''occupancy'') | contains(trigger.event.data.entity_id
      | default(''none'')) }}

      '
    id: presence_event
    trigger: template
  - event_type: timer.finished
    id: timer_event
    trigger: event
    enabled: true
  actions:
  - variables:
      session_id: '{{ context.id | default(range(1000, 9999) | random) }}'
      raw_area: "{% if trigger.id == \"presence_event\" %} \n  {{ area_id(trigger.entity_id)
        | default('unknown') }}\n{% else %} \n  {{ (trigger.event.data.entity_id |
        default('timer.unknown')).split('.')[1].replace('_light_timer', '') }}\n{%
        endif %}\n"
  - alias: Wait for Area Subscription
    wait_for_trigger:
    - event_type: presence_subscription
      event_data:
        session_id: '{{ session_id }}'
      trigger: event
    timeout: '00:00:00.030'
    continue_on_timeout: true
  - variables:
      sub_data: '{{ wait.trigger.event.data if wait.trigger is not none else {} }}'
      target_area: '{{ sub_data.target_area | default(raw_area) }}'
      area_timer: timer.{{ target_area | default('none') }}_light_timer
      area_door: binary_sensor.{{ target_area | default('none') }}_door
      area_override: input_boolean.{{ target_area | default('none') }}_light_override
      is_night: '{{ is_state(''binary_sensor.night_lights_sensor'', ''on'') }}'
      visitor_mode: '{{ is_state(''input_boolean.visitor_mode'', ''on'') }}'
      is_locked: '{{ is_state(area_door, ''off'') or is_state(area_override, ''on'')
        }}

        '
  - choose:
    - conditions:
      - condition: trigger
        id: presence_event
      - condition: template
        value_template: '{{ is_state(trigger.entity_id | default(''none''), ''on'')
          }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: '{{ area_timer | default(''timer.none'') }}'
      - variables:
          target_val: '{{ sub_data.action_value | default(35 if is_night else 75)
            | int(default=75) }}

            '
      - if:
        - condition: template
          value_template: '{{ is_locked | default(false) }}'
        then:
        - stop: Privacy Lock Active
        else:
        - event: universal_controller_command
          event_data:
            source_device: presence
            action_type: light_call
            command_input: turn_on
            area_key: '{{ target_area | default(''unknown'') }}'
            target_label: '{{ ''night_light'' if is_night else '''' }}'
            action_value: '{{ target_val }}'
    - conditions:
      - condition: trigger
        id: presence_event
      - condition: template
        value_template: '{{ is_state(trigger.entity_id | default(''none''), ''off'')
          }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_locked or visitor_mode or (raw_area == ''unknown'')
            }}'
        then:
        - stop: Inhibit Vacancy logic
        else:
        - action: timer.start
          data: {}
          target:
            entity_id: '{{ area_timer | default(''timer.none'') }}'
    - conditions:
      - condition: trigger
        id: timer_event
      sequence:
      - event: universal_controller_command
        event_data:
          source_device: presence
          action_type: light_call
          command_input: turn_off
          area_key: '{{ target_area | default(''unknown'') }}'
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ area_override | default(''input_boolean.none'') }}'
  mode: parallel
  max: 50
- id: '1769202595288'
