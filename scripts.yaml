    from contaminating the registry.\n\n## 4. RECENT UPDATES\n\n* **Focus Validation**:
    Added for Apple TV to prevent capturing stale `app_id` strings when the device
    is on the Launcher.\n\n* **CEC Mitigation**: Added explicit `source_on` state
