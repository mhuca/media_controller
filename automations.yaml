  - alias: Determine Targets
    variables:
      target_remote: "{% set device_id =  \n  (area_devices(area_key) \n    | intersect(label_devices('media_role_source_atv')))\n
        \   | first\n%}\n{{ device_entities(device_id) \n  | select('match','remote.')
