substitutions:
  name: kc868-a6-tv-proxy
  friendly_name: KC868-A6 TV Proxy #change
  icon: "mdi:light-switch"
  event: nodered_automation
  button: button
  board: esp32dev
  
  
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  # Registry-First: The custom eISCP logic
  project:
    name: Teckin.SP10 
    version: "1.0"

packages:   # as a list
#  - !include wifi.yaml
  - !include common/trusted.yaml
#  - !include formatted_uptime_sensor.yaml
#  - !include sensor_base.yaml



preferences:
  flash_write_interval: 30s


ota:
  - platform: esphome

uart:
  - id: rs485
    tx_pin: GPIO27
    rx_pin: GPIO14
    baud_rate: 9600

  # 1. THE INBOUND BUS: Kept purely for listening to the TV's responses.
  - id: rs232
    rx_pin: GPIO16
    baud_rate: 9600
    stop_bits: 1
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: 1
      sequence:
        - homeassistant.event:
            event: esphome.samsung_tv_serial
            data:
              raw_byte: !lambda |-
                char buf[5];
                sprintf(buf, "%02X", bytes[0]);
                return std::string(buf);

  # 2. THE OUTBOUND BACKDOOR: We define a standard, un-bugged transmitter component 
  # completely decoupled from the complex IDF class structure.
  - id: rs232_tx
    tx_pin: GPIO17
    baud_rate: 9600
    stop_bits: 1

api:
  actions:
    - action: send_tv_command
      variables:
        b1: int
        b2: int
        b3: int
        b4: int
        b5: int
        b6: int
        b7: int
      then:
        # We write directly to our clean, dedicated TX bus ID!
        - uart.write:
            id: rs232_tx
            data: !lambda |-
              return {(uint8_t)b1, (uint8_t)b2, (uint8_t)b3, (uint8_t)b4, (uint8_t)b5, (uint8_t)b6, (uint8_t)b7};
