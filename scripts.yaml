media_activity_snapshot:
  alias: Media Activity Snapshot (v1.3)
  description: "# MEDIA ACTIVITY SNAPSHOT (V1.3)\n## 1. OVERVIEW\nCaptures the current
    physical state of a Media Area (AVR, Display, Source, Power) and broadcasts a
    `capture_media_activity` event to the Node-RED Authoring Tool.\n## 2. DISCOVERY
    LOGIC\nUses HA Labels to dynamically find hardware without hardcoding entity IDs:\n*
    **media_role_avr**: Primary Audio Processor (Pioneer, DHC, etc.).  \n* **media_role_tv**:
    Primary Screen/TV (The Frame, Projector).  \n* **media_role_source_atv**: Active
    Playback Device (ATV, Shield, PS5).  \n* **media_power_sensor**: Hardware Validator
    (Athom Plug / Power Sensor).\n## 3. RECENT UPDATES\n* **CEC Mitigation**: Added
    explicit `source_on` state capture for environments where CEC is disabled.  \n*
    **Registry Alignment**: Ensures the Authoring Tool receives literal power states
    for all targeted silicon."
  sequence:
  - alias: 1. Resolve Entities and States
    variables:
      area_entities_list: '{{ area_entities(area_id) }}'
      avr_id: '{{ label_entities(''media_role_avr'') | select(''in'', area_entities_list)
        | first | default(''none'') }}

        '
      display_id: '{{ label_entities(''media_role_tv'') | select(''in'', area_entities_list)
        | first | default(''none'') }}

        '
      source_id: '{{ label_entities(''media_role_source_atv'') | select(''in'', area_entities_list)
        | first | default(''none'') }}

        '
      power_sensor_id: '{{ label_entities(''media_power_sensor'') | select(''in'',
        area_entities_list) | first | default(''none'') }}

        '
      current_avr_source: '{{ state_attr(avr_id, ''source'') if avr_id != ''none''
        else ''unknown'' }}'
      current_avr_mode: '{{ state_attr(avr_id, ''sound_mode'') if avr_id != ''none''
        else ''unknown'' }}'
      current_avr_state: '{{ states(avr_id) if avr_id != ''none'' else ''off'' }}'
      current_display_state: '{{ states(display_id) if display_id != ''none'' else
        ''off'' }}'
      current_source_state: '{{ states(source_id) if source_id != ''none'' else ''off''
        }}'
      current_power_watts: '{{ states(power_sensor_id) | float(0) if power_sensor_id
        != ''none'' else 0 }}'
      current_app_id: '{{ state_attr(source_id, ''app_id'') if source_id != ''none''
        else ''none'' }}'
      current_app_name: '{{ state_attr(source_id, ''app_name'') if source_id != ''none''
        else ''none'' }}'
  - alias: 2. Validate and Fire Event
    if:
    - condition: template
      value_template: '{{ avr_id != ''none'' }}'
    then:
    - event: capture_media_activity
      event_data:
        area_id: '{{ area_id }}'
        activity_name: '{{ activity_name | lower | replace('' '', ''_'') }}'
        sequence_weight: '{{ sequence_weight | int(50) }}'
        entities:
          avr: '{{ avr_id }}'
          display: '{{ display_id }}'
          source: '{{ source_id }}'
          power_sensor: '{{ power_sensor_id }}'
        captured_states:
          avr_on: '{{ 1 if current_avr_state == ''on'' else 0 }}'
          avr_source: '{{ current_avr_source }}'
          avr_sound_mode: '{{ current_avr_mode }}'
          display_on: '{{ 1 if current_display_state == ''on'' else 0 }}'
          source_on: '{{ 1 if current_source_state == ''on'' else 0 }}'
          power_watts: '{{ current_power_watts }}'
          app_id: '{{ current_app_id }}'
          app_name: '{{ current_app_name }}'
          target_command: '{{ target_command if target_command != ''none'' else none
            }}'
    - action: logbook.log
      data:
        name: Media Matrix
        message: 'SNAPSHOT: [{{ area_id }}] - Source {{ ''ON'' if current_source_state
          == ''on'' else ''OFF'' }} (CEC Disabled)'
    else:
    - action: logbook.log
      data:
        name: Media Matrix
        message: 'SNAPSHOT FAILED: No entity with label ''media_role_avr'' found in
          Area [{{ area_id }}].'
  fields:
    area_id:
      name: Target Area
      required: true
      selector:
        area:
    activity_name:
      name: Activity Name
      required: true
      selector:
        text:
    sequence_weight:
      name: Sequence Weight
      default: '50'
      selector:
        text:
    target_command:
      name: Target Command (Optional)
      description: e.g., top_menu, home, menu. Sent to the source device.
      required: false
      default: none
      selector:
        text:
media_registry_auditor:
  alias: Media Registry Auditor (V1.2)
  description: '# MEDIA REGISTRY AUDITOR (V1.2)

    Maps AVR Sources to physical entities using Labels and Area context.


    Logic:

    1. Find the AVR in an Area.

    2. Find the labeled Source Entity (media_role_source_atv) in that same Area.

    3. Map that Entity to the AVR''s ''AppleTV'' source string.

    '
  sequence:
  - alias: Iterate through all AVRs
    repeat:
      for_each: '{{ label_entities(''media_role_avr'') }}'
      sequence:
      - variables:
          avr_entity: '{{ repeat.item }}'
          area_name: '{{ area_id(avr_entity) }}'
          source_list: '{{ state_attr(avr_entity, ''source_list'') | default([]) }}'
          labeled_source_entity: '{% set area_devs = area_entities(area_name) %} {%
            set global_atvs = label_entities(''media_role_source_atv'') %} {{ global_atvs
            | select(''in'', area_devs) | first | default(''none'') }}

            '
          shadow_map: "{% set ns = namespace(matches={}) %} {% if labeled_source_entity
            != 'none' %}\n  {% for src in source_list %}\n    {% if 'apple' in src
            | lower or 'atv' in src | lower %}\n      {% set ns.matches = dict(ns.matches,
            **{src: labeled_source_entity}) %}\n    {% endif %}\n  {% endfor %}\n{%
            endif %} {{ ns.matches }}\n"
      - event: sync_media_registry
        event_data:
          area_id: '{{ area_name }}'
          avr_entity: '{{ avr_entity }}'
          source_list: '{{ source_list }}'
          shadow_map: '{{ shadow_map }}'
  - action: logbook.log
    data:
      name: Media Matrix
      message: Media Registry Audit Complete for {{ area_name }}.
'1774881466555':
  alias: Media Registry Auditor (V1.3)
  description: "# MEDIA REGISTRY AUDITOR (V1.3)\n## 1. OVERVIEW\nDiscovers and maps
    the physical relationship between AVRs, Displays, and Sources within an Area.
    \n## 2. DISCOVERY LOGIC\n* **Primary Hook**: Finds all entities labeled `media_role_avr`.
    \n* **Area Context**: Matches labeled sources (`media_role_source_atv`) and sensors
    (`media_power_sensor`) within the same area. \n* **Registry Sync**: Broadcasts
    a `sync_media_matrix` event for Node-RED ingestion.\n## 3. DATA STRUCTURE\nGenerates
    a 0-based index for `source_list` and `sound_mode_list` to align with the 16-bit
    Codebook."
  sequence:
  - repeat:
      for_each: '{{ label_entities(''media_role_avr'') }}'
      sequence:
      - variables:
          avr: '{{ repeat.item }}'
          area: '{{ area_id(avr) }}'
          sources: "{% set ns = namespace(items={}) %} {% for src in state_attr(avr,
            'source_list') | default([]) %}\n  {% set ns.items = dict(ns.items, **{src:
            loop.index0}) %}\n{% endfor %} {{ ns.items }}"
          modes: "{% set ns = namespace(items={}) %} {% for mode in state_attr(avr,
            'sound_mode_list') | default([]) %}\n  {% set ns.items = dict(ns.items,
            **{mode: loop.index0}) %}\n{% endfor %} {{ ns.items }}"
          source_entity: '{{ label_entities(''media_role_source_atv'') | select(''in'',
            area_entities(area)) | first | default(''none'') }}

            '
          power_sensor: '{{ label_entities(''media_power_sensor'') | select(''in'',
            area_entities(area)) | first | default(''none'') }}

            '
      - event: sync_media_matrix
        event_data:
          area_id: '{{ area }}'
          avr_registry:
            source: '{{ sources }}'
            sound_mode: '{{ modes }}'
          shadow_registry:
            AppleTV: '{{ source_entity }}'
          hardware_map:
            avr: '{{ avr }}'
            source: '{{ source_entity }}'
            power_sensor: '{{ power_sensor }}'
  - action: logbook.log
    data:
      name: Matrix Auditor
      message: Registry sync event broadcast for all areas.
