- id: '1765010749347'
  alias: Command - Sofabaton Dispatcher
  description: Triggers actions based on URL query parameters and passes control to
    the Command Router.
  triggers:
  - webhook_id: sofabaton01
    allowed_methods:
    - GET
    - POST
    local_only: true
    trigger: webhook
  conditions: []
  actions:
  - variables:
      last_run: '{{ as_timestamp(this.attributes.last_triggered) | float | default(now())
        }}'
      now_ms: '{{ as_timestamp(now()) | float }}'
      time_delta: '{{ (now_ms - last_run) * 1000 if last_run < now_ms else -1 }}'
      is_hold: '{{ time_delta < 110 }}'
  - variables:
      incoming_payload: '{{ trigger.json | default({''hold_secs'': 0}) }}'
      value_map:
        VUP: volume_up
        VDN: volume_down
        MUT: volume_mute
        PLY: media_play_pause
        NXT: media_next_track
        PRV: media_previous_track
        PWR: turn_off
      type_map:
        MED: media_call
        LIT: light_call
        SCN: scene_cycle
        REM: remote_send
        PET: pet_feeder
        ARC: area_command
      final_type: '{{ type_map.get(trigger.query.action, trigger.query.action | default(''media_call''))
        }}'
      final_value: '{{ value_map.get(trigger.query.value | upper, trigger.query.value)
        }}'
      area_key: '{{ trigger.query.area_key | default(''living_room'') }}'
      command_input: '{{ ''broadcast'' if final_type in [''scene_cycle'',''light_call'']
        else '''' }}'
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 20
  - wait_for_trigger:
    - webhook_id: sofabaton01
      allowed_methods:
      - GET
      - POST
      local_only: true
      trigger: webhook
    timeout:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 140
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          sequence:
          - event: universal_controller_command
            event_data:
              source_device: sofabaton
              action_type: '{{ final_type }}'
              action_value: '{{ final_value }}'
              target_label: []
              command: hold
              command_input: '{{ command_input }}'
              area_key: '{{ area_key }}'
              data_payload: '{{ incoming_payload }}'
              overrides: {}
          - wait_for_trigger:
            - trigger: webhook
              webhook_id: sofabaton01
            timeout: '00:00:00.150'
            continue_on_timeout: true
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is none }}'
      sequence:
      - wait_for_trigger:
        - trigger: webhook
          webhook_id: sofabaton01
          allowed_methods:
          - POST
          - PUT
          local_only: true
        timeout:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 250
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.trigger is not none }}'
        then:
        - variables:
            command: double
        else:
        - variables:
            command: press
      - event: universal_controller_command
        event_data:
          source_device: sofabaton
          action_type: '{{ final_type }}'
          action_value: '{{ final_value }}'
          target_label: []
          command: '{{ command }}'
          command_input: '{{ command_input }}'
          area_key: '{{ area_key }}'
          data_payload: '{{ incoming_payload }}'
          overrides: {}
  mode: single
- id: '1765533661574'
  alias: Command - Lighting Cycle
  description: ''
  triggers:
  - trigger: event
    event_type: universal_controller_command
    event_data:
      action_type: cycling
  conditions: []
  actions:
  - alias: Define Actions
    variables:
      area_key: '{{ trigger.event.data.area_key }}'
      command: '{{ trigger.event.data.command_input }}'
      action_type: '{{ trigger.event.data.action_type }}'
      action_value: '{{ trigger.event.data.action_value }}'
  - variables:
      target_state_entity: input_text.{{ area_key }}_scene_state
      target_label: lighting
      all_labels: '{{ label_entities(''lighting'') }}

        '
      options: "{% set all_scripts = states.script %}    \n{{ all_scripts\n  | selectattr('entity_id',
        'in', area_entities(area_key))\n  | selectattr('entity_id', 'in', label_entities(target_label))\n
        \ | map(attribute='entity_id')\n  | list | sort(reverse=false)\n}}\n"
      current_state: '{{ states(''input_text.'' ~ area_key ~ ''_scene_state'') }}

        '
      current: '{{ current_state | default(options[1] if options | length > 0 else
        none) }}

        '
      current_index: '{{ options.index(current) if current in options else -1 }}

        '
      next_script_id: none
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action_value == ''scene.next'' }}'
      sequence:
      - variables:
          new_index: "{% if current_index == -1 %}\n  0\n{% elif current_index >=
            options | length - 1 %}\n  {{ current_index }}\n{% else %}\n  {{ current_index
            + 1 }}\n{% endif %}\n"
          next_script_id: '{{ options[new_index] }}'
      alias: Scene Next
    - conditions:
      - condition: template
        value_template: '{{ action_value == ''scene.previous'' }}'
      sequence:
      - variables:
          new_index: "{% if current_index <= 0 %}\n  0\n{% else %}\n  {{ current_index
            - 1 }}\n{% endif %}\n"
          next_script_id: '{{ options[new_index] }}'
      alias: Scene Previous
    - conditions:
      - condition: template
        value_template: '{{ action_value == ''scene.min'' }}'
      sequence:
      - variables:
          next_script_id: '{{ options[0] if options | length > 0 else none }}'
      alias: Scene First
    - conditions:
      - condition: template
        value_template: '{{ action_value == ''scene.max'' }}'
